<style>
:root{--navy:#1E3A8A;--blue:#3B82F6;--cyan:#22D3EE;--sky:#38BDF8;--violet:#8B5CF6;--gold:#F59E0B;
--bg:#F5F9FF;--ink:#0F1E3D;--mut:#5B6B8C;--line:#E3EBF8;--soft:#EEF4FF;--g1:#2F5FD8;--g2:#3B9BF6;--ok:#0E9F6E;--okb:#E3F8EE;--wb:#FEF3C7;--wt:#92400E;--bd:#DC2626;--bdb:#FEE4E2}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 Inter,system-ui,Arial,sans-serif;color:var(--ink);background:radial-gradient(900px 520px at 88% -8%,rgba(139,92,246,.13),transparent 62%),radial-gradient(760px 520px at 8% -4%,rgba(34,211,238,.16),transparent 62%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:24px;margin:0;letter-spacing:-.02em}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.app>*{min-width:0}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:16px 12px 20px;display:flex;flex-direction:column;gap:2px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px}
.logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line),0 6px 22px rgba(59,130,246,.28);position:relative;animation:glow 4.5s ease-in-out infinite}
.logo img{width:36px;height:36px;object-fit:contain}
@keyframes glow{50%{box-shadow:0 0 0 1px var(--line),0 6px 30px rgba(139,92,246,.4)}}
.bn{font-weight:800;font-size:19px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--navy),var(--blue) 60%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.bn small{font-weight:600;background:none;color:var(--gold);-webkit-text-fill-color:var(--gold);font-size:19px}
.org{font-size:12px;color:var(--mut)}
.nh{font-size:10.5px;letter-spacing:.09em;color:#8A99B8;padding:14px 12px 4px;font-weight:700}
.nv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#3A4A6B;cursor:pointer;border:0;background:none;text-align:left;width:100%;min-height:40px;transition:.18s}
.nv svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nv:hover{background:var(--soft)}
.nv.on{background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(139,92,246,.14));color:var(--navy);font-weight:700;box-shadow:inset 0 0 0 1px rgba(59,130,246,.22)}
.nv.on svg{stroke:var(--g1);opacity:1}
.nv .sp{margin-left:auto;color:var(--gold);font-size:12px}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--mut)}
main{padding:0 28px 40px;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 0;margin:0 -28px;padding-inline:28px;background:rgba(245,249,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid transparent;flex-wrap:wrap}
.top .grow{flex:1}
.burger{display:none!important}

.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(var(--c,4),minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY='2026-10-26',NOW=16*60,DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dt=s=>new Date(s+'T00:00:00');
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return ds(d)};
const dow=s=>(dt(s).getDay()+6)%7;
const fmtD=s=>dt(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtDY=s=>dt(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const tm=m=>{const h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+(mm?':'+String(mm).padStart(2,'0'):'')+(h<12?' am':' pm')};
const tmin=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const tstr=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const money=n=>'PKR '+Math.round(n).toLocaleString('en-US');
const mshort=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?Math.round(n/1e3)+'K':String(Math.round(n));
const pl=w=>/(s|x|ch|sh)$/i.test(w)?w+'es':/[^aeiou]y$/i.test(w)?w.slice(0,-1)+'ies':w+'s';
const chip=(t,c='')=>`<span class="ch ${c}">${esc(t)}</span>`;

 leaves().forEach(n=>{if(n.start&&(S.role!=='tutor'||n.tutor===S.me))out.push({date:n.start,title:n.name+' starts',type:'start'});if(n.end)out.push({date:n.end,title:n.name+' ends',type:'start'})});
 if(can('fee'))[...new Set(S.d.vouchers.map(v=>v.due))].forEach(d=>out.push({date:d,title:'Fee due date',type:'fee'}));return out}
const CT={test:['Test','e-test'],exam:['Exam','e-exam'],hol:['Holiday','e-hol'],fee:['Fee due','e-fee'],start:['Batch start/end','e-start'],evt:['Event','e-evt']};
V.cal=()=>{const u=S.ui;u.cy=u.cy??2026;u.cmo=u.cmo??9;u.cf=u.cf||[];const first=new Date(u.cy,u.cmo,1),off=(first.getDay()+6)%7,dim=new Date(u.cy,u.cmo+1,0).getDate(),ev=calEvents().filter(e=>!u.cf.includes(e.type));
 let cells='';for(let i=0;i<Math.ceil((off+dim)/7)*7;i++){const day=i-off+1,inM=day>=1&&day<=dim,d=ds(new Date(u.cy,u.cmo,day)),es=ev.filter(e=>e.date===d);
  cells+=`<div class="dy ${inM?'':'o'} ${d===TODAY?'t':''}" data-a="calDay" data-d="${d}"><span class="n">${new Date(u.cy,u.cmo,day).getDate()}</span>${es.slice(0,3).map(e=>`<span class="ev ${CT[e.type][1]}">${esc(e.title)}</span>`).join('')}${es.length>3?`<span class="sm mut">+${es.length-3} more</span>`:''}</div>`}
 return head('Calendar','Tests, exams, holidays, fee dates and batch starts in one place',`<button class="bt p" data-a="evAdd">+ Add event</button>`)+
 `<div class="tools"><button class="bt g" data-a="cmo" data-v="-1" aria-label="Previous month">‹</button><b style="min-width:150px;text-align:center">${MONTHS[u.cmo]} ${u.cy}</b><button class="bt g" data-a="cmo" data-v="1" aria-label="Next month">›</button><button class="bt g s" data-a="cmo" data-v="0">Today</button><span style="flex:1"></span>${Object.entries(CT).map(([k,v])=>`<button class="ev ${v[1]}" style="border:0;cursor:pointer;padding:5px 10px;border-radius:99px;font-size:12px;${u.cf.includes(k)?'opacity:.35;text-decoration:line-through':''}" data-a="cf" data-k="${k}">${v[0]}</button>`).join('')}</div>
 <div class="tw"><div class="cal" style="min-width:640px">${DN.map(d=>`<div class="ch0">${d}</div>`).join('')}${cells}</div></div>`};
A.cmo=el=>{const u=S.ui,v=+el.dataset.v;if(!v){u.cy=2026;u.cmo=9}else{u.cmo+=v;if(u.cmo>11){u.cmo=0;u.cy++}if(u.cmo<0){u.cmo=11;u.cy--}}render()};

A.evAdd=el=>modal({title:'Add event',body:`<div class="fg"><label class="f full">Title<input class="in" name="t" required></label><label class="f">Date<input class="in" type="date" name="d" required value="${(el&&el.dataset&&el.dataset.d)||TODAY}"></label><label class="f">Type<select class="in" name="k">${opts(Object.entries(CT).filter(x=>x[0]!=='test'&&x[0]!=='start').map(([k,v])=>[k,v[0]]),'evt')}</select></label></div>`,onOk:v=>{S.d.events.push({id:nid('V'),date:v.d,title:v.t,type:v.k});log('Event '+v.t);toast('Event added');render()}});

V.fee=()=>{const u=S.ui,t=T(),tab=u.ft||'v',vs=allowedV(),bil=vs.reduce((a,v)=>a+v.amt,0),col=vs.reduce((a,v)=>a+v.paid,0),ov=vs.filter(v=>vSt(v)==='Overdue');
 const q=(u.fq||'').toLowerCase(),list=vs.filter(v=>{const s=stu(v.sid);return s&&(!q||s.name.toLowerCase().includes(q)||v.id.toLowerCase().includes(q))&&(!u.fs||vSt(v)===u.fs)&&(!u.fn||s.node===+u.fn)});
 let body='';
 if(tab==='v')body=`<div class="tools"><input class="in srch" id="fq" data-i="fq" placeholder="Search ${esc(t.student.toLowerCase())} or voucher no." value="${esc(u.fq||'')}" aria-label="Search vouchers"><select class="in" data-i="fs" aria-label="Status"><option value="">All status</option>${['Paid','Partial','Unpaid','Overdue'].map(x=>`<option ${u.fs===x?'selected':''}>${x}</option>`).join('')}</select><select class="in" data-i="fnn" aria-label="${esc(LNAME())}"><option value="">All ${esc(pl(LNAME()).toLowerCase())}</option>${leafOpts(u.fn||'')}</select></div>
 <div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>Voucher</th><th>${esc(t.student)}</th><th>${esc(LNAME())}</th><th>Period</th><th class="r">Amount</th><th class="r">Paid</th><th class="r">Balance</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${list.map(v=>{const s=stu(v.sid);return `<tr><td>${v.id}</td><td><b>${esc(s.name)}</b></td><td>${esc(nodeBy(s.node).name)}</td><td>${esc(v.period)}</td><td class="r">${money(v.amt)}</td><td class="r">${money(v.paid)}</td><td class="r">${money(vBal(v))}</td><td>${fmtD(v.due)}</td><td>${vChip(v)}</td><td>${vBal(v)>0?`<button class="bt p s" data-a="collect" data-id="${v.id}">Collect</button>`:`<button class="bt g s" data-a="receipt" data-id="${v.id}">Receipt</button>`}</td></tr>`}).join('')||'<tr><td colspan="10" class="mut" style="padding:20px">No vouchers match.</td></tr>'}</tbody></table></div></div>`;
 else if(tab==='p')body=`<div class="grid g2"><div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>${esc(LNAME())}</th><th>Fee plan</th><th class="r">Enrolled</th><th></th></tr></thead><tbody>${leaves().map(n=>`<tr><td><b>${esc(n.name)}</b><div class="sm mut">${esc(pathOf(n))}</div></td><td>${esc(feeText(n))}</td><td class="r">${stuOf(n.id).length}</td><td><button class="bt g s" data-a="batEdit" data-id="${n.id}">Edit</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h3>Fee policy</h3><p class="sm mut">${esc(S.cfg.feeMode)} · preset for ${esc(PRESETS[S.preset].label)}</p><div class="fg"><label class="f">Late fee (PKR)<input class="in" type="number" id="lf" value="${S.cfg.late??500}" data-i="late" min="0"></label><label class="f">Grace days<input class="in" type="number" value="${S.cfg.grace??3}" data-i="grace" min="0"></label><label class="f">Sibling discount %<input class="in" type="number" value="${S.cfg.sib??10}" data-i="sib" min="0" max="100"></label><label class="f">Scholarship cap %<input class="in" type="number" value="${S.cfg.sch??50}" data-i="schol" min="0" max="100"></label></div><div class="row" style="margin-top:14px"><button class="bt p" data-a="lateApply">Apply late fee to overdue</button></div></div></div>`;
 else body=`<div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>Date</th><th>Receipt</th><th>${esc(t.student)}</th><th>Method</th><th class="r">Amount</th><th></th></tr></thead><tbody>${[...S.d.pay].filter(p=>stu(p.sid)&&myStudents().some(s=>s.id===p.sid)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(p=>`<tr><td>${fmtD(p.date)}</td><td>${p.id}</td><td>${esc(stu(p.sid).name)}</td><td>${esc(p.method)}</td><td class="r">${money(p.amt)}</td><td><button class="bt g s" data-a="receipt" data-id="${p.vid}" data-p="${p.id}">Receipt</button></td></tr>`).join('')}</tbody></table></div></div>`;
 return head('Fees',`${esc(t.fee)}s, instalments and collection · ${esc(S.cfg.feeMode)}`,`<button class="bt g" data-a="remind">Send reminders (${ov.length})</button><button class="bt p" data-a="genV">+ Generate vouchers</button>`)+
 `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi k1"><div class="lb">Billed</div><div class="v">${money(bil)}</div></div><div class="card kpi k2"><div class="lb">Collected</div><div class="v">${money(col)}</div><div class="d">${bil?Math.round(col/bil*100):0}% of billed</div></div><div class="card kpi k3"><div class="lb">Outstanding</div><div class="v">${money(bil-col)}</div></div><div class="card kpi k4"><div class="lb">Overdue</div><div class="v" style="color:var(--wt)">${ov.length}</div><div class="d">vouchers</div></div></div>
 <div class="tabs">${[['v','Vouchers'],['p','Fee plans & policy'],['c','Collections']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="ftab" data-v="${k}">${l}</button>`).join('')}</div>`+body};
A.ftab=el=>{S.ui.ft=el.dataset.v;render()};I.fq=el=>{S.ui.fq=el.value;render()};I.fs=el=>{S.ui.fs=el.value;render()};I.fnn=el=>{S.ui.fn=el.value;render()};
I.late=el=>{S.cfg.late=+el.value};I.grace=el=>{S.cfg.grace=+el.value};I.sib=el=>{S.cfg.sib=+el.value};I.schol=el=>{S.cfg.sch=+el.value};

 onOk:v=>{let c=0;S.d.students.filter(s=>s.status==='Active'&&(!v.n||s.node===+v.n)).forEach(s=>{if(S.d.vouchers.some(x=>x.sid===s.id&&x.period===v.p))return;S.d.vouchers.push({id:'V-'+(9000+S.d.vouchers.length),sid:s.id,period:v.p,amt:Math.round(nodeBy(s.node).fee.amt*(1-s.disc/100)),paid:0,due:v.d});c++});log('Generated '+c+' vouchers');toast(c+' vouchers generated for '+v.p);S.ui.ft='v';render()}})};
A.collect=el=>{const v=S.d.vouchers.find(x=>x.id===el.dataset.id),s=stu(v.sid);modal({title:'Collect payment',ok:'Record payment',body:`<div class="row"><b>${esc(s.name)}</b><span class="mut sm">${v.id} · ${esc(v.period)}</span></div><div class="fg"><label class="f">Amount (balance ${money(vBal(v))})<input class="in" type="number" name="a" min="1" max="${vBal(v)}" required value="${vBal(v)}"></label><label class="f">Method<select class="in" name="m"><option>Cash</option><option>Bank transfer</option><option>JazzCash</option><option>Easypaisa</option></select></label><label class="f">Date<input class="in" type="date" name="d" required value="${TODAY}"></label><label class="f">Reference<input class="in" name="r" placeholder="Txn / slip no."></label></div>`,
 onOk:x=>{const a=+x.a;if(a>vBal(v)){merr('Amount is more than the balance');return false}v.paid+=a;const p={id:nid('P'),vid:v.id,sid:s.id,amt:a,date:x.d,method:x.m,ref:x.r};S.d.pay.push(p);log(`Collected ${money(a)} from ${s.name}`);toast('Payment recorded · posted to Accounting');render();refreshDrawer();setTimeout(()=>rcpt(v,p),0)}})};

/* ---------- Tutor salaries ---------- */
function salCalc(t){const lv=leaves().filter(n=>n.tutor===t.id);let sessions=0;for(let i=0;i<=25;i++){const d=addD('2026-10-01',i);if(d>TODAY)break;lv.forEach(n=>n.sch.forEach(x=>{if(x.d===dow(d)&&(!n.start||d>=n.start)&&(d<TODAY||x.e<=NOW))sessions++}))}
 const fees=S.d.vouchers.filter(v=>{const s=stu(v.sid);return s&&lv.some(n=>n.id===s.node)}).reduce((a,v)=>a+v.paid,0);
 const base=t.model==='fixed'?t.rate:t.model==='session'?sessions*t.rate:Math.round(fees*t.rate/100),adj=S.d.sal.adj[t.id]||0;return{sessions,fees,base,adj,net:base+adj,lv}}
const MODEL={fixed:'Fixed monthly',session:'Per session',share:'Revenue share %'};
V.sal=()=>{const T_=T(),all=S.d.tutors.map(t=>({t,c:salCalc(t)})),tot=all.reduce((a,x)=>a+x.c.net,0),paid=all.filter(x=>S.d.sal.status[x.t.id]==='Paid').reduce((a,x)=>a+x.c.net,0);
 return head(T_.tutor+' Salaries','October 2026 payroll · sessions are counted from the timetable and attendance',`<button class="bt g" data-a="salAll">Approve all pending</button>`)+
 `<div class="grid g3" style="margin-bottom:14px"><div class="card kpi k1"><div class="lb">Payroll this month</div><div class="v">${money(tot)}</div></div><div class="card kpi k2"><div class="lb">Paid</div><div class="v">${money(paid)}</div></div><div class="card kpi k4"><div class="lb">Pending</div><div class="v">${money(tot-paid)}</div></div></div>
 <div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>${esc(T_.tutor)}</th><th>Pay model</th><th class="r">Sessions</th><th class="r">Base</th><th class="r">Adjust</th><th class="r">Net pay</th><th>Status</th><th></th></tr></thead><tbody>${all.map(({t,c})=>{const st=S.d.sal.status[t.id]||'Pending';return `<tr><td><b>${esc(t.name)}</b><div class="sm mut">${c.lv.length} ${esc(pl(LNAME().toLowerCase()))}</div></td><td>${MODEL[t.model]}<div class="sm mut">${t.model==='share'?t.rate+'%':money(t.rate)}</div></td><td class="r">${c.sessions}</td><td class="r">${money(c.base)}</td><td class="r">${c.adj?money(c.adj):'—'}</td><td class="r"><b>${money(c.net)}</b></td><td>${chip(st,{Pending:'gy',Approved:'wn',Paid:'ok'}[st])}</td><td class="row">${st==='Pending'?`<button class="bt g s" data-a="salAdj" data-id="${t.id}">Adjust</button><button class="bt p s" data-a="salApp" data-id="${t.id}">Approve</button>`:st==='Approved'?`<button class="bt p s" data-a="salPay" data-id="${t.id}">Pay</button>`:`<button class="bt g s" data-a="salSlip" data-id="${t.id}">Payslip</button>`}<button class="bt g s" data-a="salModel" data-id="${t.id}">Model</button></td></tr>`}).join('')}</tbody></table></div></div>`};
A.salAll=()=>{S.d.tutors.forEach(t=>{if(!S.d.sal.status[t.id])S.d.sal.status[t.id]='Approved'});log('Approved payroll');toast('All pending salaries approved');render()};
A.salApp=el=>{S.d.sal.status[el.dataset.id]='Approved';log('Approved salary '+el.dataset.id);render()};
A.salAdj=el=>{const t=tutorBy(el.dataset.id);modal({title:'Bonus / deduction – '+t.name,body:`<div class="fg"><label class="f">Amount (use − for deduction)<input class="in" type="number" name="a" required value="${S.d.sal.adj[t.id]||0}"></label><label class="f">Reason<input class="in" name="r" placeholder="e.g. extra weekend class"></label></div>`,onOk:v=>{S.d.sal.adj[t.id]=+v.a;log('Adjusted salary '+t.name);render()}})};

 :tab==='r'?`<div class="card" style="padding:0"><div class="tw"><table class="mtx"><thead><tr><th>Module</th>${Object.entries(ROLES).map(([k,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${PAGES.map(p=>`<tr><td>${PNAME[p]}</td>${Object.keys(ROLES).map(r=>`<td><input type="checkbox" class="tog" data-i="perm" data-r="${r}" data-p="${p}" ${S.perm[r].includes(p)?'checked':''} ${r==='owner'?'disabled':''} aria-label="${ROLES[r]} can open ${PNAME[p]}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div><p class="sm mut">Changes apply instantly — switch “Viewing as” to see the sidebar change. Tutors are always limited to their own ${esc(pl(LNAME().toLowerCase()))}.</p>`
 :`<div class="card" style="padding:0">${S.audit.map(a=>`<div class="row sb" style="padding:10px 16px;border-bottom:1px solid #EEF3FB"><span>${esc(a.m)}</span><span class="sm mut">${esc(a.who)} · ${esc(a.t)}</span></div>`).join('')||'<p class="mut" style="padding:16px">Actions you take in this demo are recorded here.</p>'}</div>`;
 return head('People & Access','Team, roles and an audit trail',`<button class="bt p" data-a="invite">+ Invite user</button>`)+`<div class="tabs">${[['t','Team'],['r','Roles & permissions'],['a','Audit log']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="ptab" data-v="${k}">${l}</button>`).join('')}</div>`+body};
A.ptab=el=>{S.ui.pt=el.dataset.v;render()};
I.srole=el=>{const s=S.d.staff.find(x=>x.id===el.dataset.id);s.role=el.value;log(s.name+' → '+ROLES[s.role]);toast(s.name+' is now '+ROLES[s.role])};
A.stToggle=el=>{const s=S.d.staff.find(x=>x.id===el.dataset.id);s.status=s.status==='Active'?'Suspended':'Active';log(s.name+' '+s.status);render()};
I.perm=el=>{const a=S.perm[el.dataset.r],p=el.dataset.p;const i=a.indexOf(p);if(el.checked&&i<0)a.push(p);if(!el.checked&&i>=0)a.splice(i,1);render()};
A.invite=()=>modal({title:'Invite user',ok:'Send invite',body:`<div class="fg"><label class="f">Name<input class="in" name="n" required></label><label class="f">Email<input class="in" type="email" name="e" required></label><label class="f full">Role<select class="in" name="r">${opts(Object.entries(ROLES).filter(x=>x[0]!=='owner'),'tutor')}</select></label></div>`,onOk:v=>{const id='u'+(20+S.d.staff.length);S.d.staff.push({id,name:v.n,email:v.e,role:v.r,status:'Invited'});if(v.r==='tutor')S.d.tutors.push({id:'t'+(S.d.tutors.length+1),name:v.n,model:'fixed',rate:0,phone:'—'});log('Invited '+v.e);toast('Invite sent to '+v.e);render()}});

/* ---------- Institute Setup ---------- */
const ACC={blue:['#2F5FD8','#3B9BF6'],violet:['#6D3FD1','#A78BFA'],teal:['#0E7490','#22D3EE'],rose:['#BE185D','#F472B6']};
function setAcc(k){S.cfg.accent=k;document.documentElement.style.setProperty('--g1',ACC[k][0]);document.documentElement.style.setProperty('--g2',ACC[k][1])}
const LEAFS=['Batch','Class','Section','Cohort','Group','Course'],TOPS=['Program','Course','Diploma','Department','Grade','Track'];
V.set=()=>{const c=S.cfg,t=c.terms;
 return head('Institute Setup','One core, many institutes — pick a preset, then bend it with labels, structure and switches',`<span class="ch vi">Reuses ILMA Organization &amp; People</span>`)+
 `<div class="grid g4" style="margin-bottom:16px">${Object.entries(PRESETS).map(([k,p])=>`<button class="pre ${k===S.preset?'on':''}" data-a="presetPick" data-k="${k}"><b>${p.label}</b><div class="sm mut" style="margin:4px 0 8px">${p.blurb}</div><div class="row wrap">${p.levels.map((l,i)=>`<span class="lv lv${i}">${l}</span>`).join('<span class="mut">→</span>')}</div></button>`).join('')}</div>
 <div class="grid g2"><div class="card"><h3>Terminology map</h3><p class="sm mut">Rename once — every screen, report and message follows.</p><div class="fg"><label class="f">Institute name<input class="in" id="s_org" data-i="sorg" value="${esc(c.org)}"></label><label class="f">“Student” is called<input class="in" id="s_stu" data-i="sterm" data-k="student" value="${esc(t.student)}"></label><label class="f">“Tutor” is called<input class="in" id="s_tut" data-i="sterm" data-k="tutor" value="${esc(t.tutor)}"></label><label class="f">Structure page title<input class="in" id="s_page" data-i="sterm" data-k="page" value="${esc(t.page)}"></label><label class="f">Fee voucher name<input class="in" id="s_fee" data-i="sterm" data-k="fee" value="${esc(t.fee)}"></label><label class="f">Assessment name<input class="in" id="s_test" data-i="sterm" data-k="test" value="${esc(t.test)}"></label></div></div>
 <div class="card"><h3>Hierarchy labels</h3><p class="sm mut">The last level is the enrolment unit — it carries the schedule, fees, ${esc(t.tutor.toLowerCase())} and capacity.</p>${c.levels.map((l,i)=>`<div style="margin-top:12px"><div class="row sb"><span class="lv lv${i}">Level ${i+1}${i===LL()?' · enrolment unit':''}</span></div><input class="in" style="margin-top:6px" id="s_lv${i}" data-i="slv" data-l="${i}" value="${esc(l)}" aria-label="Level ${i+1} label"><div class="row wrap" style="margin-top:6px">${(i===LL()?LEAFS:TOPS).map(o=>`<button class="ch ${l===o?'':'gy'}" style="border:0;cursor:pointer" data-a="lvPick" data-l="${i}" data-v="${o}">${o}</button>`).join('')}</div></div>`).join('')}</div>
 <div class="card"><h3>Modules</h3><p class="sm mut">Turn off what this institute doesn’t need.</p>${[['tt','Timetable'],['tst','Tests & Results'],['hw','Homework & Materials'],['sal',T().tutor+' Salaries'],['not','Noticeboard'],['cop','ILMA Copilot']].map(([k,l])=>`<label class="row sb" style="padding:9px 0;border-top:1px solid #EEF3FB"><span>${esc(l)}</span><input type="checkbox" class="tog" data-i="flag" data-k="${k}" ${c.flags[k]?'checked':''} aria-label="${esc(l)}"></label>`).join('')}<div class="sm mut" style="margin-top:8px">Core modules (People, Academic structure, Attendance, Fees, Accounting) stay on.</div></div>
 <div class="card"><h3>Academic &amp; fee configuration</h3><div class="fg"><label class="f">Grading scale<select class="in" data-i="grade">${opts([['percent','Percentage'],['letter','Letter grades (A–F)'],['gpa','GPA (4.0)'],['passfail','Pass / Fail']],c.grade)}</select></label><label class="f">Attendance mode<select class="in" data-i="attm">${opts(['Per session','Daily','Per subject'].map(x=>[x,x]),c.attMode)}</select></label><label class="f full">Fee model<select class="in" data-i="feem">${opts(['Monthly tuition','Course instalments','Semester instalments','Two instalments','One-time course fee'].map(x=>[x,x]),c.feeMode)}</select></label></div><div style="margin-top:16px"><div class="sm mut" style="font-weight:600">Brand accent</div><div class="row" style="margin-top:8px">${Object.entries(ACC).map(([k,v])=>`<button class="sw ${c.accent===k?'on':''}" style="background:linear-gradient(135deg,${v[0]},${v[1]})" data-a="acc" data-k="${k}" aria-label="${k} accent"></button>`).join('')}</div></div></div></div>`};
A.presetPick=el=>{apply(el.dataset.k,true);closeAll();render();toast('Applied '+PRESETS[el.dataset.k].label+' preset')};
I.sorg=el=>{S.cfg.org=el.value;side()};I.sterm=el=>{S.cfg.terms[el.dataset.k]=el.value;side();topbar()};I.slv=el=>{S.cfg.levels[+el.dataset.l]=el.value||'Level';side();topbar()};
A.lvPick=el=>{S.cfg.levels[+el.dataset.l]=el.dataset.v;render()};
I.flag=el=>{S.cfg.flags[el.dataset.k]=el.checked?1:0;render()};I.grade=el=>{S.cfg.grade=el.value;toast('Grades now show as '+el.options[el.selectedIndex].text)};I.attm=el=>{S.cfg.attMode=el.value};I.feem=el=>{S.cfg.feeMode=el.value};
A.acc=el=>{setAcc(el.dataset.k);render()};

/* ---------- ILMA Core Map ---------- */
const MAP=[['Organization & People','linear-gradient(135deg,#1E3A8A,#3B82F6)',[['Institute & branches','Single campus, optional branches'],['Staff & roles','Owner · Manager · '+'Tutor · Accountant · Front desk'],['Students & guardians','Called “'+'Student / Trainee / Learner” by preset'],['Admissions & enrolment','Quick add + CSV import, capacity check'],['Access control','Role matrix + audit log'],['Notices & messaging','WhatsApp / SMS / App / Email']]],
 ['Academic','linear-gradient(135deg,#0891B2,#22D3EE)',[['Class & Section','→ Flexible Program / Course / Batch tree (1–3 levels)'],['Timetable','Generated from batch schedule, clash-safe'],['Attendance','Per session, guardian alerts'],['Exams & Marks','Tests, ranks, grade scale per institute'],['Homework & LMS','Assignments + materials'],['Academic calendar','Auto-fills tests, starts, fee dates']]],
 ['Finance','linear-gradient(135deg,#6D28D9,#A78BFA)',[['Fee structures','Monthly or instalments, per batch'],['Vouchers & collection','Receipts, late fee, reminders'],['Payroll','Fixed · per session · revenue share'],['Accounting','Auto-posted ledger, accounts, P&L'],['Reports','Attendance, results, defaulters, load'],['Copilot (Insight & AI)','Role-aware answers on the same data']]]];
V.map=()=>head('ILMA Core Map','What Lite reuses from ILMA, and how each piece is configured',`<span class="ch vi">One codebase · profile-driven</span>`)+
 `<div class="map3">${MAP.map(([n,g,items])=>`<div class="col"><h3 style="background:${g}">${n}</h3><div style="border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden">${items.map(([a,b])=>`<div class="mapi"><b>${a}</b><span class="mut" style="text-align:right">${b}</span></div>`).join('')}</div></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h3>How a profile works</h3><ol style="line-height:1.9;padding-left:18px;margin:8px 0 0"><li><b>Terminology map</b> – labels live in data, never in code</li><li><b>Hierarchy</b> – 1 to 3 levels; the last level is the enrolment unit</li><li><b>Feature flags</b> – hide modules an institute doesn’t want</li><li><b>Policies</b> – fee model, grading scale, pay models</li><li><b>Roles</b> – permission matrix per module</li></ol></div>
 <div class="card"><h3>Stays in full ILMA (not in Lite)</h3><div class="row wrap" style="margin-top:10px">${['Transport','Hostel & mess','Library','Parent portal','Online admissions site','Admissions CRM','Insight dashboards','Multi-campus','Open API'].map(x=>chip(x,'gy')).join('')}</div><p class="sm mut" style="margin-top:12px">Upgrading a Lite institute keeps all data: the same batches, students and ledger simply unlock more modules.</p></div></div>`;

/* ---------- init ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){if(t.tagName!=='INPUT')e.preventDefault();f(t,e)}});
const TXT=['text','search','number','email','tel','date','time'];
document.addEventListener('input',e=>{const t=e.target.closest('[data-i]');if(t&&I[t.dataset.i]&&(TXT.includes(t.type)||t.tagName==='TEXTAREA'||t.type==='range'))I[t.dataset.i](t,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-i]');if(!t||!I[t.dataset.i])return;if((TXT.includes(t.type)&&t.type!=='date'&&t.type!=='time')||t.tagName==='TEXTAREA')return;I[t.dataset.i](t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.k==='ask'){e.preventDefault();A.ask()}if(e.key==='Escape')closeAll()});
apply('academy');setAcc('blue');render();
</script></body></html>
