<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ILMA Platform Admin Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f7f6;--panel:#fff;--ink:#0d2b29;--mut:#5d7673;--line:#dfe8e6;--pri:#0a4d48;--acc:#0b7a66;--soft:#e3f3ee;--side:#04403c;--ok:#0f8a66;--okb:#dff3ea;--warn:#a15c07;--warnb:#fdf0d6;--bad:#c0262d;--badb:#fde8ea;--info:#2b5fc4;--infob:#e6eefc;--inp:#fff;--hov:#f1f6f5;--shadow:0 1px 2px rgba(10,40,38,.05),0 6px 20px rgba(10,40,38,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a19;--panel:#102624;--ink:#e6f4f1;--mut:#8fb0ab;--line:#1f3d3a;--pri:#1aa88f;--acc:#3ed1b2;--soft:#12332f;--side:#061f1d;--ok:#5fd3a6;--okb:#12362b;--warn:#f1c05a;--warnb:#3b2d10;--bad:#ff8a93;--badb:#3d1a1f;--info:#9fb7ff;--infob:#1b2547;--inp:#0c1f1d;--hov:#143230;--shadow:none}}
:root[data-theme="dark"]{--bg:#0a1a19;--panel:#102624;--ink:#e6f4f1;--mut:#8fb0ab;--line:#1f3d3a;--pri:#1aa88f;--acc:#3ed1b2;--soft:#12332f;--side:#061f1d;--ok:#5fd3a6;--okb:#12362b;--warn:#f1c05a;--warnb:#3b2d10;--bad:#ff8a93;--badb:#3d1a1f;--info:#9fb7ff;--infob:#1b2547;--inp:#0c1f1d;--hov:#143230;--shadow:none}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:244px;background:var(--side);color:#bfe0da;padding:16px 12px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:800;padding:2px 8px 16px;font-size:15px}.brand i{width:34px;height:34px;border-radius:10px;background:#0b7a66;display:grid;place-items:center;font-style:normal}.brand small{display:block;font-weight:500;font-size:11px;color:#7fb5ab}
.side .grp{font-size:11px;letter-spacing:.08em;color:#6fa399;margin:14px 10px 6px;font-weight:700}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#cfe9e4;text-decoration:none;margin-bottom:2px;cursor:pointer;font-weight:600;font-size:13.5px}
.side a:hover{background:rgba(255,255,255,.07)}.side a.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 3px 0 0 #3ed1b2}
.side a .ic{width:20px;text-align:center;opacity:.9}.side a .ct{margin-left:auto;background:#e5484d;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.side a .ct.q{background:rgba(255,255,255,.14);color:#cfe9e4}
.me{margin-top:auto;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:#fff}.me small{display:block;color:#7fb5ab}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;padding:12px 28px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top .srch{flex:1;min-width:200px;display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.top .srch input{border:0;background:transparent;outline:0;width:100%}
.top select{background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:600;font-size:13px}
main{padding:24px 28px 70px;min-width:0}
@media(max-width:900px){.side{display:none}main{padding:16px}.top{padding:10px 16px}}
.pillh{display:inline-flex;gap:6px;align-items:center;background:var(--soft);color:var(--acc);font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:99px;margin-bottom:10px}
h1{margin:0;font-size:30px;letter-spacing:-.02em;line-height:1.15}h2{margin:0;font-size:18px}h3{margin:0;font-size:15px}
.sub{color:var(--mut);margin:4px 0 0;font-size:14px}.hd{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}.hd>div:first-child{flex:1;min-width:260px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:8px 14px;font-weight:600;font-size:13.5px;white-space:nowrap}.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.dan{color:var(--bad)}.btn.dan.solid{background:var(--bad);border-color:var(--bad);color:#fff}.btn.sm{padding:5px 10px;font-size:12.5px}.btn.warnb{background:#e8920c;border-color:#e8920c;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:14px}.g2{display:grid;grid-template-columns:2fr 1fr;gap:14px}.g2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
@media(max-width:1000px){.g2,.g2e{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center}.kpi .ki{width:38px;height:38px;border-radius:11px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:17px}
.kpi b{font-size:22px;display:block;line-height:1.1}.kpi small{color:var(--mut);font-size:12.5px}.kpi.w b{color:var(--warn)}.kpi.b b{color:var(--bad)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap;background:var(--panel)}td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr.cl{cursor:pointer}tbody tr.cl:hover td{background:var(--hov)}
.av{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}.org{display:flex;gap:12px;align-items:center}.org b{display:block;font-size:14px}.org span{font-size:12px;color:var(--mut)}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--hov);color:var(--mut);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.warn{background:var(--warnb);color:var(--warn)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.info{background:var(--infob);color:var(--info)}.pill.acc{background:var(--soft);color:var(--acc)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.fb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.fc{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--mut)}.fc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.in,select.in,textarea.in{background:var(--inp);border:1px solid var(--line);border-radius:11px;padding:9px 12px;width:100%;font-size:14px}textarea.in{min-height:84px;resize:vertical}
.fl{display:grid;gap:12px}.fl label,.lab{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--mut)}.fl label.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}.fl .h{font-size:12px;color:var(--mut);font-weight:400}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:4px 0 18px}.tab{padding:10px 14px;border:0;background:none;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}.tab.on{color:var(--acc);border-color:var(--acc)}
.bar{margin:9px 0}.bar .bt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.bar .bt span{color:var(--mut)}.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--acc);border-radius:99px}.fill.w{background:#e0a020}.fill.b{background:var(--bad)}
.msg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px}.msg.w{background:var(--warnb);color:var(--warn);border-color:transparent}.msg.ok{background:var(--okb);color:var(--ok);border-color:transparent}.msg.b{background:var(--badb);color:var(--bad);border-color:transparent}.msg.i{background:var(--infob);color:var(--info);border-color:transparent}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;word-break:break-all}
.cred{background:var(--bg);border:1px dashed var(--acc);border-radius:14px;padding:14px;display:grid;gap:8px}.cred div{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13.5px}.cred b{font-family:ui-monospace,Menlo,monospace}.cred span{color:var(--mut)}
.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}.steps div{flex:1;min-width:120px;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}.steps div.on{border-color:var(--acc);color:var(--acc);background:var(--soft)}.steps div.dn{color:var(--ok)}
.pc{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:var(--panel)}.pc.on{border-color:var(--acc);background:var(--soft)}.pc b{font-size:15px}.pc .pr{font-size:20px;font-weight:800;margin:4px 0}.pc ul{margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:13px}
.board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}.col{background:var(--hov);border-radius:14px;padding:10px;min-height:260px}.col h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.oc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}.oc b{display:block;cursor:pointer}.oc small{color:var(--mut)}
.scrim{position:fixed;inset:0;background:rgba(5,20,18,.5);z-index:40;display:none}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:0;width:min(600px,94vw);box-shadow:0 24px 70px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(5,20,18,.55)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);margin:0}.mh h3{font-size:17px}.mh .x{border:0;background:transparent;font-size:17px;color:var(--mut)}
.mb{padding:18px 20px;display:grid;gap:12px;max-height:70vh;overflow:auto}.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99;align-items:center}#toast div{background:#10302d;color:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);border-left:4px solid #3ed1b2}#toast div.bad{border-color:#ff8a93}
.wsh{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.wsh .av{width:54px;height:54px;font-size:18px;border-radius:14px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:10px}.crumb a{color:var(--acc);font-weight:700;cursor:pointer}
.tl{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:14px;display:grid;gap:12px}.tl div{position:relative;font-size:13.5px}.tl div:before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc)}.tl small{color:var(--mut);display:block}
.hub{width:100%;height:78vh;border:1px solid var(--line);border-radius:14px;background:#fff}
.hubwrap{position:relative}.hubwrap .ov{position:absolute;inset:0;background:rgba(244,247,246,.55);border-radius:14px;display:grid;place-items:start center;padding-top:30px;z-index:2}
#imp{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
.ibar{background:#e8920c;color:#2a1a00;display:flex;gap:14px;align-items:center;padding:9px 18px;font-weight:700;flex-wrap:wrap}.ibar .btn{background:#2a1a00;color:#fff;border-color:#2a1a00}.ibar code{background:rgba(0,0,0,.12);padding:2px 8px;border-radius:8px}
.ish{display:flex;flex:1;min-height:0}.ish .isd{width:200px;background:#1b1f45;color:#cfd3ff;padding:16px 12px;flex:none}.ish .isd a{display:block;padding:9px 10px;border-radius:9px;color:#cfd3ff;margin-bottom:2px;cursor:pointer;font-weight:600}.ish .isd a.on{background:rgba(255,255,255,.14);color:#fff}.ish .imain{flex:1;overflow:auto;padding:22px}
.sw{position:relative;width:40px;height:22px;flex:none;display:inline-block}.sw input{opacity:0;width:0;height:0;position:absolute}.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}.sw i:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:var(--acc)}.sw input:checked+i:before{transform:translateX(18px)}.sw input:disabled+i{opacity:.5}
.trow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.trow:last-child{border-bottom:0}.trow b{display:block}.trow span.d{font-size:12.5px;color:var(--mut)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.chk:last-child{border-bottom:0}.chk input{margin-top:3px;accent-color:var(--acc)}.chk.d span{text-decoration:line-through;color:var(--mut)}
.empty{padding:30px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.heat{font-size:26px;font-weight:800}
.kebab{position:relative}.menu{position:absolute;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:10;min-width:200px;padding:6px;text-align:left}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:600;font-size:13px}.menu button:hover{background:var(--hov)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.mt{margin-top:12px}
</style>
</head>

 <main id="main"></main>

</div>

/* ===== helpers ===== */
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Number(n).toLocaleString('en-PK');
const pill=(t,k='')=>`<span class="pill ${k}">${t}</span>`;
const btn=(t,a,k='',i='',j='',need='')=>`<button class="btn ${k}" data-a="${a}" data-i="${esc(i)}" data-j="${esc(j)}"${need?` data-need="${need}"`:''}>${t}</button>`;
const inp=(id,v='',ph='',type='text',x='')=>`<input class="in" id="${id}" type="${type}" value="${esc(v)}" placeholder="${esc(ph)}" ${x}>`;
const sel=(id,opts,v='',x='')=>`<select class="in" id="${id}" ${x}>${opts.map(o=>{const a=Array.isArray(o)?o:[o,o];return `<option value="${esc(a[0])}" ${String(a[0])===String(v)?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`;
const fld=(l,i,h='')=>`<label>${l}${i}${h?`<span class="h">${h}</span>`:''}</label>`;
const tog=(id,on,x='')=>`<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''} ${x}><i></i></label>`;
const trow=(t,d,id,on)=>`<div class="trow"><div><b>${t}</b><span class="d">${d||''}</span></div>${tog(id,on)}</div>`;
const val=(id,r=document)=>{const e=r.querySelector('#'+id);return e?(e.type==='checkbox'?e.checked:e.value):''};
const tbl=(h,rows,empty='Nothing here yet.',cl=false)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr ${cl&&r._c?`class="cl" data-a="${r._c[0]}" data-i="${r._c[1]}"`:''}>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" style="text-align:center;color:var(--mut);padding:26px">${empty}</td></tr>`}</tbody></table></div>`;
const kpi=(ic,v,l,k='')=>`<div class="kpi ${k}"><div class="ki">${ic}</div><div><b>${v}</b><small>${l}</small></div></div>`;
const bar=(l,u,t,unit='')=>{const p=Math.round(u/t*100),c=p>=100?'b':p>=80?'w':'';return `<div class="bar"><div class="bt"><b>${l}</b><span>${num(u)} of ${num(t)} ${unit} · ${p}%</span></div><div class="track"><div class="fill ${c}" style="width:${Math.min(p,100)}%"></div></div></div>`};
const ini=n=>n.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
function toast(m,k=''){const d=document.createElement('div');d.className=k;d.textContent=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),3400)}
function modal(o){const d=$('dlg');d.innerHTML=`<form method="dialog" class="mh"><h3>${o.title}</h3><button class="x" value="x" aria-label="Close">✕</button></form><div class="mb">${o.body}</div><div class="mf">${o.noCancel?'':'<button class="btn" id="mc">Cancel</button>'}${o.ok===false?'':`<button class="btn ${o.danger?'dan solid':o.warn?'warnb':'p'}" id="mo">${o.ok||'Save'}</button>`}</div>`;
 const mc=d.querySelector('#mc');if(mc)mc.onclick=()=>d.close();const mo=d.querySelector('#mo');if(mo)mo.onclick=()=>{if(!o.onOk||o.onOk(d)!==false)d.close()};if(!d.open)d.showModal();if(o.init)o.init(d)}
function copy(t,label='Copied'){const done=()=>toast('✓ '+label);try{navigator.clipboard.writeText(t).then(done,()=>{fb()})}catch(e){fb()}function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}}
const ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789',PW='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';

 return `${crumbs([['Organizations','mod','orgs'],['Add organization']])}<div class="hd"><div><h1>Add organization</h1><p class="sub">Four steps. Takes about 2 minutes.</p></div></div><div class="steps">${WS.map((x,i)=>`<div class="${w.s===i+1?'on':w.s>i+1?'dn':''}">${w.s>i+1?'✓':i+1}. ${x}</div>`).join('')}</div><div class="card">${b}<div class="row" style="margin-top:18px;justify-content:space-between">${btn(w.s===1?'Cancel':'← Back','wback')}${w.s<4?btn('Next →','wnext','p'):btn('Create organization','wcreate','p')}</div></div>`}
function wsave(){document.querySelectorAll('[id^="w_"]').forEach(e=>{const k=e.id.slice(2);W[k]=e.type==='checkbox'?e.checked:(k==='td'?+e.value:e.value)})}

 const sa={id:uid++,org:o.id,n:w.san.trim(),e:w.sae.trim(),ph:w.saph||'—',st:'Invited',last:'Never',mfa:0};SAS.push(sa);CHKS[o.id]=CHK.map(()=>0);let res={o,sa};
 if(w.method==='key'){const k={k:genKey(),org:o.id,e:sa.e,st:'Unused',exp:'28 Oct 2026',by:who(),on:'Oct 14',plan:p.id+(w.td?' trial':'')};KEYS.unshift(k);res.key=k;log(o.id,'Organization created','Plan '+w.plan+' · key '+k.k+' sent to '+sa.e)}

A.cpy=a=>copy(a.dataset.i,a.dataset.j||'Copied');A.mailto=a=>{log(null,'Credentials emailed',a.dataset.i);toast('✓ Email sent to '+a.dataset.i)};

 modal({title:'Copy credentials · '+esc(o.n),ok:'Create new password',body:`<p style="margin:0">This creates a <b>new temporary password</b> and signs that person out of every device.</p>${fld('Super Admin',sel('cs',L.map(x=>[x.id,x.n+' · '+x.e])))}${fld('Reason',inp('cr','','e.g. Locked out, asked by phone'))}`,onOk:d=>{const sa=SAS.find(x=>x.id==val('cs',d)),r=val('cr',d).trim();if(!r){toast('A reason is required','bad');return false}const pw=genPw();sa.last=sa.last;log(o.id,'Credentials regenerated',sa.e+' · '+r);setTimeout(()=>modal({title:'Credentials for '+esc(sa.n),noCancel:1,ok:'Done',body:credCard(o,sa,pw)}),60)}})};

A.sastate=a=>{const sa=SAS.find(x=>x.id===+a.dataset.i),to=a.dataset.j,o=org(sa.org);modal({title:(to==='Revoked'?'Revoke access':to==='Suspended'?'Suspend':'Restore')+' · '+esc(sa.n),danger:to==='Revoked',ok:to==='Active'?'Restore access':to==='Revoked'?'Revoke access':'Suspend',body:`<p style="margin:0">${to==='Revoked'?'Sign-in is blocked and active sessions end. Data stays in the institute. You can restore later with a new password.':to==='Suspended'?'Sign-in is blocked until you restore it.':'The account is restored and gets a new temporary password.'}</p>${fld('Reason',inp('rr','','Required'))}`,onOk:d=>{if(!val('rr',d).trim()){toast('A reason is required','bad');return false}sa.st=to;log(o.id,'Super Admin '+to.toLowerCase(),sa.e+' · '+val('rr',d));toast('✓ '+sa.n+' is now '+to);render();if(to==='Active')setTimeout(()=>modal({title:'New credentials for '+esc(sa.n),noCancel:1,ok:'Done',body:credCard(o,sa,genPw())}),80)}})};

 if(t==='access')b=`<div class="row" style="margin-bottom:12px"><p class="sub" style="margin:0">Super Admins can sign in and manage this institute. Everyone else is created from inside it.</p><span class="sp"></span>${btn('＋ Add Super Admin','addsa','p',o.id,'','creds')}</div>`+saTable(sas,false);
 if(t==='keys')b=`<div class="row" style="margin-bottom:12px"><span class="sp"></span>${btn('Generate key','genkey','p',o.id,'','keys')}</div>`+keyTable(KEYS.filter(k=>k.org===o.id));
 if(t==='setup'){const c=CHKS[o.id]||CHK.map(()=>0),dn=c.filter(Boolean).length;b=`<div class="g2"><div class="card"><div class="row"><h3>Onboarding checklist</h3><span class="sp"></span><span class="pill acc">${dn} of ${CHK.length}</span></div><div class="track" style="margin:10px 0"><div class="fill" style="width:${dn/CHK.length*100}%"></div></div>${CHK.map((x,i)=>`<label class="chk ${c[i]?'d':''}"><input type="checkbox" data-a="chk" data-i="${o.id}" data-j="${i}" ${c[i]?'checked':''}><span>${x}</span></label>`).join('')}</div><div class="card" style="margin-top:0"><div class="row"><h3>Data loads</h3><span class="sp"></span>${btn('＋ New load','newjob','p sm',o.id,'','data')}</div><div style="margin-top:10px">${jobTable(JOBS.filter(j=>j.org===o.id),false)}</div><p class="sub" style="margin-top:12px">We load, then the Super Admin signs off in writing before go-live.</p></div></div>`}
 if(t==='settings')b=!can('settings')?`<div class="msg w">Your ILMA role can view these settings but not change them.</div><div id="hubslot" class="hubwrap" style="margin-top:12px"></div>`:`<div id="hubslot" class="hubwrap"></div>`;
 if(t==='billing'){const iv=INV.filter(i=>i.org===o.id);b=`<div class="g2e"><div class="card"><h3>Subscription</h3><div class="fl" style="margin-top:10px">${fld('Plan',sel('bp',PLANS.map(p=>[p.id,p.id+' · Rs '+num(p.pr)]),o.plan))}${fld('Renewal',inp('br',o.ren))}${fld('Discount',sel('bd',['None','10%','20%','Rs 5,000 off']))}</div><div class="row" style="margin-top:12px">${btn('Save plan','saveplan','p',o.id,'','billing')}${btn('Extend trial 14 days','exttrial','',o.id,'','billing')}${o.st==='Past due'||o.st==='Suspended'?btn('Reinstate','restoreorg','',o.id,'','danger'):''}</div></div><div class="card" style="margin-top:0"><h3>Invoices</h3><div style="margin-top:10px">${invTable(iv)}</div><div class="row" style="margin-top:10px">${btn('Issue invoice','newinv','',o.id,'','billing')}</div></div></div>`}
 if(t==='modules'){const on=o.mods||pl.mods;b=`<div class="g2e"><div class="card"><h3>Modules</h3><p class="sub">Switch modules on or off for this institute.</p><div style="margin-top:8px">${MODS.map(m=>`<div class="trow"><div><b>${m}</b></div>${tog('mm_'+m.replace(/ /g,'_'),on.includes(m),`data-a="modt" data-i="${o.id}" data-j="${m}"`)}</div>`).join('')}</div></div><div class="card" style="margin-top:0"><h3>Limits</h3><p class="sub">Override the plan's limits for this institute.</p><div class="fl" style="margin-top:10px">${fld('Student seats',inp('lm1',pl.s,'','number'))}${fld('Teacher seats',inp('lm2',pl.t,'','number'))}${fld('Campuses',inp('lm3',pl.c,'','number'))}${fld('Storage (GB)',inp('lm4',pl.gb,'','number'))}${fld('AI credits',inp('lm5',pl.ai,'','number'))}</div><div class="row" style="margin-top:12px">${btn('Save limits','savelim','p',o.id,'','billing')}</div></div></div>`}
 if(t==='campuses')b=`<div class="row" style="margin-bottom:12px"><span class="sp"></span>${btn('＋ Add campus','addcamp','p',o.id,'','org')}</div>${tbl(['Campus','Code','Students','Principal',''],o.camp.map((c,i)=>[`<b>${esc(c)}</b>`,o.code+'-'+(i+1),Math.round(o.stu/o.camp.length),'—',btn('Remove','rmcamp','dan sm',o.id,i,'org')]))}`;
 if(t==='activity')b=actTable(ACTLOG.filter(l=>l.o===o.id));
 if(t==='notes'){const n=NOTES[o.id]||[];b=`<div class="g2e"><div class="card"><h3>Internal notes</h3><p class="sub">Never visible to the institute.</p><div class="fl" style="margin-top:10px"><textarea class="in" id="nt" placeholder="Add a note for the team…"></textarea>${btn('Add note','addnote','p',o.id)}</div></div><div class="card" style="margin-top:0"><h3>History</h3><div class="tl" style="margin-top:10px">${n.length?n.map(x=>`<div>${esc(x.t)}<small>${esc(x.w)} · ${x.d}</small></div>`).join(''):'<div style="color:var(--mut)">No notes yet.</div>'}</div></div></div>`}
 const r=`${crumbs([['Organizations','mod','orgs'],[esc(o.n)]])}<div class="wsh"><div class="av">${ini(o.n)}</div><div style="flex:1;min-width:220px"><h1 style="font-size:26px">${esc(o.n)}</h1><div class="row" style="margin-top:6px"><span class="pill">${o.code}</span>${typePill(o)}${pill(o.plan)}${stPill(o)}<span class="sub" style="margin:0">· ${esc(o.city)}</span></div></div><div class="row">${btn('Login as Super Admin','loginas','p',o.id,'','loginas')}${btn('Copy credentials','credfor','',o.id,'','creds')}<div class="kebab"><button class="btn" data-a="menu" data-i="${o.id}">⋯</button></div></div></div><div class="tabs">${WT.map(x=>`<button class="tab ${t===x[0]?'on':''}" data-a="tab" data-i="${x[0]}">${x[1]}</button>`).join('')}</div>${b}`;
 if(t==='settings')setTimeout(()=>{const s=$('hubslot');if(s)mountHub(s,o,!can('settings'))},0);return r}
A.chk=a=>{const c=CHKS[+a.dataset.i];c[+a.dataset.j]=a.checked?1:0;const o=org(+a.dataset.i);log(o.id,'Checklist updated',CHK[+a.dataset.j]+(a.checked?' ✓':' ✗'));if(c.every(Boolean)){o.stage=6;toast('🎉 All done. Stage set to Live')}render()};
A.saveplan=a=>{const o=org(+a.dataset.i),p=val('bp'),old=o.plan;o.plan=p;o.ren=val('br')||o.ren;log(o.id,'Plan changed',old+' → '+p);toast('✓ Plan saved');render()};
A.savelim=a=>{log(+a.dataset.i,'Limits overridden','Seats and storage');toast('✓ Limits saved')};
A.modt=a=>{const o=org(+a.dataset.i);o.mods=(o.mods||plan(o.plan).mods).slice();const m=a.dataset.j;o.mods=a.checked?o.mods.concat(m):o.mods.filter(x=>x!==m);log(o.id,'Module '+(a.checked?'on':'off'),m);toast(m+(a.checked?' on':' off'))};
A.addcamp=a=>modal({title:'Add campus',body:fld('Campus name',inp('cn','','e.g. Girls Campus')),onOk:d=>{if(!val('cn',d).trim())return false;const o=org(+a.dataset.i);o.camp.push(val('cn',d).trim());log(o.id,'Campus added',val('cn',d));render()}});
A.rmcamp=a=>{const o=org(+a.dataset.i);if(o.camp.length<2){toast('At least one campus is required','bad');return}o.camp.splice(+a.dataset.j,1);render()};
A.addnote=a=>{const v=val('nt').trim();if(!v)return;(NOTES[+a.dataset.i]=NOTES[+a.dataset.i]||[]).unshift({w:who(),t:v,d:'Today'});render()};
A.newinv=a=>modal({title:'Issue invoice',body:fld('Amount (Rs)',inp('ia',plan(org(+a.dataset.i).plan).pr,'','number'))+fld('Note',inp('in2','','Optional')),onOk:d=>{INV.unshift({no:'INV-'+(4421+INV.length),org:+a.dataset.i,d:'14 Oct 2026',amt:+val('ia',d),st:'Sent'});log(+a.dataset.i,'Invoice issued','Rs '+val('ia',d));render()}});
/* ===== shared tables ===== */
function saTable(L,showOrg=true){return tbl(['Name',...(showOrg?['Institute']:[]),'Email','Status','Last login','Two-step',''],L.map(x=>{const o=org(x.org);return [`<b>${esc(x.n)}</b>`,...(showOrg?[`<a style="color:var(--acc);cursor:pointer;font-weight:600" data-a="open" data-i="${o.id}">${esc(o.n)}</a>`]:[]),esc(x.e),pill(x.st,x.st==='Active'?'ok':x.st==='Invited'?'info':'bad'),x.last,x.mfa?pill('On','ok'):pill('Off','warn'),`<div class="row">${btn('Login as','loginas','sm',o.id,'','loginas')}${btn('Copy credentials','credfor','sm',o.id,'','creds')}${x.st==='Revoked'||x.st==='Suspended'?btn('Restore','sastate','sm',x.id,'Active','creds'):btn('Revoke','sastate','dan sm',x.id,'Revoked','creds')}${x.st==='Active'?btn('Suspend','sastate','sm',x.id,'Suspended','creds'):''}</div>`]}),'No Super Admin yet.')}
function keyTable(L){return tbl(['Key','Institute','Email','Plan','Status','Expires','Created by',''],L.map(k=>[`<b class="mono" style="padding:3px 8px">${k.k}</b>`,k.org?esc(org(k.org).n):esc(k.nm||'—')+' <span class="pill">new</span>',esc(k.e),k.plan,pill(k.st,k.st==='Unused'?'info':k.st==='Redeemed'?'ok':k.st==='Expired'?'warn':'bad'),k.exp,esc(k.by),`<div class="row">${btn('Copy','cpy','sm',k.k,'Key copied')}${k.st==='Unused'?btn('Resend','resendkey','sm',k.org||0,'','keys')+btn('Revoke','revkey','dan sm',k.k,'','keys'):''}${k.st==='Unused'||k.st==='Expired'?btn('Extend','extkey','sm',k.k,'','keys'):''}${k.st==='Expired'||k.st==='Revoked'?btn('Regenerate','regenkey','sm',k.k,'','keys'):''}</div>`]),'No keys yet.')}
function jobTable(L,showOrg=true){return tbl(['File',...(showOrg?['Institute']:[]),'Data','Rows','Errors','Status',''],L.map(j=>[`<b>${esc(j.f)}</b>`,...(showOrg?[esc(org(j.org).n)]:[]),j.ent,j.rows,j.err?pill(j.err,'bad'):'0',pill(j.st,j.st==='Signed off'?'ok':j.st==='Loaded'?'info':'warn'),(j.st==='Received'?btn('Start cleaning','jstep','sm',j.id,'Cleaning','data'):j.st==='Cleaning'?btn('Mark loaded','jstep','sm',j.id,'Loaded','data'):j.st==='Loaded'?btn('Request sign-off','jstep','sm',j.id,'Signed off','data'):'')+(j.err?btn('Error report','dl','sm',j.f):'')]),'No data loads.')}
function invTable(L){return tbl(['Invoice','Date','Amount','Status',''],L.map(i=>[`<b>${i.no}</b>`,i.d,'Rs '+num(i.amt),pill(i.st,i.st==='Paid'?'ok':i.st==='Overdue'?'bad':'info'),i.st!=='Paid'?btn('Mark paid','paid','sm',i.no,'','billing'):btn('PDF','dl','sm',i.no+'.pdf')]),'No invoices.')}
function actTable(L){return tbl(['When','Who','Institute','Action','Detail'],L.map(l=>[l.t,`<b>${esc(l.w)}</b>`,l.o?esc(org(l.o).n):'Platform',esc(l.a),`<span style="color:var(--mut)">${esc(l.d)}</span>`]),'No activity.')}
A.dl=a=>{log(null,'Downloaded',a.dataset.i);toast('⬇ '+a.dataset.i+' downloaded (sample)')};
A.jstep=a=>{const j=JOBS.find(x=>x.id===+a.dataset.i);j.st=a.dataset.j;log(j.org,'Data load '+j.st.toLowerCase(),j.f);if(j.st==='Loaded'&&org(j.org).stage<3)org(j.org).stage=3;toast('✓ '+j.f+' → '+j.st);render()};
A.paid=a=>{const i=INV.find(x=>x.no===a.dataset.i);i.st='Paid';const o=org(i.org);if(o.st==='Past due'&&!INV.some(x=>x.org===o.id&&x.st==='Overdue'))o.st='Active';log(o.id,'Invoice paid',i.no);toast('✓ '+i.no+' marked paid');render()};
A.newjob=a=>{const oid2=a&&a.dataset&&a.dataset.i?+a.dataset.i:null;modal({title:'New data load',ok:'Create job',body:`<div class="fl">${fld('Institute',sel('jo',ORGS.filter(o=>o.type!=='Test').map(o=>[o.id,o.n]),oid2||2))}${fld('Data',sel('je',['Students','Staff','Fees','Timetable','Results']))}${fld('File',inp('jf','','students.xlsx'),'Upload the file the institute sent us')}</div>`,onOk:d=>{if(!val('jf',d).trim()){toast('Add a file name','bad');return false}JOBS.unshift({id:uid++,org:+val('jo',d),ent:val('je',d),f:val('jf',d),rows:Math.round(40+Math.random()*300),err:Math.round(Math.random()*3),st:'Received'});log(+val('jo',d),'Data load received',val('jf',d));render()}})};
/* ===== hub embed ===== */
function mountHub(slot,o,ro){slot.innerHTML='';const dk=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
 let h=new TextDecoder().decode(Uint8Array.from(atob(HUB_B64),c=>c.charCodeAt(0)));
 h=h.split('ILMA Education Network').join(o.n).split('ilma-lahore').join(o.slug).split('ilma-edu.pk').join(o.dom).replace('inp("gs","ILMA")','inp("gs","'+o.code+'")');
 if(dk)h=h.replace('<html lang="en">','<html lang="en" data-theme="dark">');
 h=h.replace('<script>','<script>window.ORG='+JSON.stringify({id:o.id,n:o.n})+';');
 const f=document.createElement('iframe');f.className='hub';f.id='hubf';f.title='Settings for '+o.n;f.srcdoc=h;slot.appendChild(f);
 if(ro){const ov=document.createElement('div');ov.className='ov';ov.innerHTML='<div class="msg w">View only for your ILMA role</div>';slot.appendChild(ov)}}
window.addEventListener('message',e=>{const d=e.data;if(d&&d.t==='audit'){ACTLOG.unshift({t:'Just now',w:who(),o:d.org,a:'Settings changed on behalf',d:d.m+' · '+d.w});}});
/* ===== keys / access ===== */
function keysView(){const f=S.kf,L=KEYS.filter(k=>f==='all'||k.st===f);return `<div class="pillh"><span class="dot"></span>Access</div><div class="hd"><div><h1>Invite keys</h1><p class="sub">Single-use keys that let a Super Admin set up their institute themselves. Expire in 14 days by default.</p></div>${btn('＋ Generate key','genkey','p','','','keys')}</div><div class="kpis">${kpi('🔑',KEYS.filter(k=>k.st==='Unused').length,'Unused')}${kpi('✅',KEYS.filter(k=>k.st==='Redeemed').length,'Redeemed')}${kpi('⌛',KEYS.filter(k=>k.st==='Expired').length,'Expired')}${kpi('⛔',KEYS.filter(k=>k.st==='Revoked').length,'Revoked')}</div><div class="fb">${['all','Unused','Redeemed','Expired','Revoked'].map(x=>`<button class="fc ${f===x?'on':''}" data-a="kf" data-i="${x}">${x==='all'?'All':x}</button>`).join('')}</div>${keyTable(L)}<p class="sub" style="margin-top:10px">A key only works with the email it was issued to, and never shows which plan it carries until redeemed.</p>`}
A.kf=a=>{S.kf=a.dataset.i;render()};
function accessView(){const f=S.af,L=SAS.filter(x=>f==='all'||x.st===f);return `<div class="pillh"><span class="dot"></span>Access</div><div class="hd"><div><h1>Super Admin access</h1><p class="sub">Every Super Admin across all institutes. Copy credentials, log in as them, or revoke access.</p></div>${btn('＋ Add Super Admin','pickorg','p','','','creds')}</div><div class="kpis">${kpi('👤',SAS.filter(x=>x.st==='Active').length,'Active')}${kpi('📧',SAS.filter(x=>x.st==='Invited').length,'Invited, not signed in')}${kpi('⏸',SAS.filter(x=>x.st==='Suspended').length,'Suspended')}${kpi('🔓',SAS.filter(x=>!x.mfa&&x.st==='Active').length,'Without two-step','w')}</div><div class="fb">${['all','Active','Invited','Suspended','Revoked'].map(x=>`<button class="fc ${f===x?'on':''}" data-a="af" data-i="${x}">${x==='all'?'All':x}</button>`).join('')}</div>${saTable(L)}`}
A.af=a=>{S.af=a.dataset.i;render()};
A.pickorg=()=>modal({title:'Add Super Admin',ok:'Next',body:fld('Institute',sel('po',ORGS.filter(o=>o.type!=='Test'||true).map(o=>[o.id,o.n]),2)),onOk:d=>{const id=val('po',d);setTimeout(()=>A.addsa({dataset:{i:id}}),60)}});
/* ===== onboarding ===== */
function onbView(){const R=real();return `<div class="pillh"><span class="dot"></span>Operations</div><div class="hd"><div><h1>Onboarding pipeline</h1><p class="sub">Seven stages from created to live. Amber means more than 5 days in a stage.</p></div>${btn('Playbook','playbook')}</div><div class="board">${STAGES.map((s,i)=>`<div class="col"><h4>${i+1}. ${s}<span class="pill">${R.filter(o=>o.stage===i).length}</span></h4>${R.filter(o=>o.stage===i).map(o=>`<div class="oc"><b data-a="open" data-i="${o.id}">${esc(o.n)}</b><small>${o.owner} · ${o.since} days here</small><div class="row" style="margin-top:6px">${o.since>=5&&i<6?pill('Stuck','warn'):''}${i<6?btn('Next stage →','nextstage','sm',o.id,'','data'):pill('Live','ok')}</div></div>`).join('')||'<small style="color:var(--mut)">Empty</small>'}</div>`).join('')}</div>`}

/* ===== data desk ===== */

 <div class="tabs">${[['plans','Plans'],['subs','Subscriptions'],['inv','Invoices']].map(x=>`<button class="tab ${(S.bt||'plans')===x[0]?'on':''}" data-a="bt" data-i="${x[0]}">${x[1]}</button>`).join('')}</div>
 ${(S.bt||'plans')==='plans'?`<div class="g3">${PLANS.map(p=>`<div class="card" style="margin:0"><div class="row"><h3>${p.id}</h3><span class="sp"></span>${btn('Edit','editplan','sm',p.id,'','billing')}</div><div class="heat" style="margin:6px 0">Rs ${num(p.pr)}</div><p class="sub">${p.t} teachers · ${num(p.s)} students<br>${p.c} campus${p.c>1?'es':''} · ${p.gb} GB · ${num(p.ai)} AI credits</p><p class="sub" style="margin-top:8px">${p.mods.join(', ')}</p><p style="margin:10px 0 0"><b>${ORGS.filter(o=>o.plan===p.id&&o.type!=='Test').length}</b> institutes</p></div>`).join('')}</div>`:''}
 ${S.bt==='subs'?tbl(['Institute','Plan','Type','Renews','Monthly','Status',''],R.map(o=>{const r=[`<b>${esc(o.n)}</b>`,o.plan,typePill(o),o.ren,o.type==='Trial'?'Trial':'Rs '+num(plan(o.plan).pr),stPill(o),btn('Manage','openb','sm',o.id)];return r})):''}
 ${S.bt==='inv'?invTable(INV.map(i=>({...i}))).replace(/<td><b>(INV-\d+)<\/b><\/td>/g,(m,n)=>{const i=INV.find(x=>x.no===n);return `<td><b>${n}</b><br><span style="color:var(--mut);font-size:12px">${esc(org(i.org).n)}</span></td>`}):''}`}
A.bt=a=>{S.bt=a.dataset.i;render()};
A.editplan=a=>{const p=plan(a.dataset.i);modal({title:'Edit '+p.id+' plan',body:`<div class="fl"><div class="g2e">${fld('Price / month (Rs)',inp('ep1',p.pr,'','number'))}${fld('Teacher seats',inp('ep2',p.t,'','number'))}${fld('Student seats',inp('ep3',p.s,'','number'))}${fld('Campuses',inp('ep4',p.c,'','number'))}${fld('Storage (GB)',inp('ep5',p.gb,'','number'))}${fld('AI credits',inp('ep6',p.ai,'','number'))}</div><div class="msg i">New prices apply to new subscriptions and renewals, not to current invoices.</div></div>`,onOk:d=>{p.pr=+val('ep1',d);p.t=+val('ep2',d);p.s=+val('ep3',d);p.c=+val('ep4',d);p.gb=+val('ep5',d);p.ai=+val('ep6',d);log(null,'Plan edited',p.id);toast('✓ Plan updated');render()}})};
/* ===== support ===== */
function supView(){const f=S.tkf,L=TICKETS.filter(t=>f==='all'||t.st===f);return `<div class="pillh"><span class="dot"></span>Operations</div><div class="hd"><div><h1>Support</h1><p class="sub">Tickets from institutes. Open one to reply or start a tagged login-as session.</p></div></div><div class="kpis">${kpi('📬',TICKETS.filter(t=>t.st==='Open').length,'Open')}${kpi('⏱',TICKETS.filter(t=>t.st==='Open'&&t.sla.includes('2h')).length,'SLA at risk','w')}${kpi('✅',TICKETS.filter(t=>t.st==='Resolved').length,'Resolved')}${kpi('⏰','2.4 h','Avg first response')}</div><div class="fb">${['all','Open','Pending','Resolved'].map(x=>`<button class="fc ${f===x?'on':''}" data-a="tkf" data-i="${x}">${x==='all'?'All':x}</button>`).join('')}</div>${tbl(['Ticket','Institute','Priority','Status','Assignee','SLA'],L.map(t=>{const r=[`<b>${t.id}</b><br><span style="color:var(--mut)">${esc(t.s)}</span>`,esc(org(t.org).n),pill(t.p,t.p==='High'?'bad':''),pill(t.st,t.st==='Open'?'warn':t.st==='Resolved'?'ok':'info'),t.as,t.sla];r._c=['tk',t.id];return r}),'No tickets.',true)}`}
A.tkf=a=>{S.tkf=a.dataset.i;render()};
A.tk=a=>{const t=TICKETS.find(x=>x.id===a.dataset.i);modal({title:t.id+' · '+esc(t.s),noCancel:1,ok:t.st==='Resolved'?'Reopen':'Mark resolved',body:`<div class="row">${pill(t.p)}${pill(t.st,'info')}<span class="sub" style="margin:0">${esc(org(t.org).n)}</span></div><div class="msg">${esc(t.msg)}</div><div class="fl">${fld('Reply',`<textarea class="in" id="tr" placeholder="Write a reply…"></textarea>`)}</div><div class="row">${btn('Send reply','tkreply','p sm',t.id)}${btn('Login as for this ticket','loginas','sm',t.org,'','loginas')}</div>`,onOk:()=>{t.st=t.st==='Resolved'?'Open':'Resolved';log(t.org,'Ticket '+t.st.toLowerCase(),t.id);render()}})};
A.tkreply=a=>{if(!val('tr').trim()){toast('Write a reply first','bad');return}log(TICKETS.find(x=>x.id===a.dataset.i).org,'Ticket reply',a.dataset.i);toast('✓ Reply sent')};
/* ===== activity ===== */
function actView(){const L=ACTLOG.filter(l=>S.lf==='all'||(S.lf==='login'?l.a.startsWith('Login as'):S.lf==='keys'?/key/i.test(l.a):S.lf==='settings'?/Settings/.test(l.a):/suspend|reinstat|Plan|Invoice|Trial/i.test(l.a)));return `<div class="pillh"><span class="dot"></span>Platform</div><div class="hd"><div><h1>Activity log</h1><p class="sub">Every sensitive action by ILMA staff. Cannot be edited or deleted. Kept for 2 years.</p></div>${btn('Export CSV','dl','','activity-log.csv')}</div><div class="fb">${[['all','All'],['login','Login as'],['keys','Keys'],['settings','Settings on behalf'],['acct','Account and billing']].map(x=>`<button class="fc ${S.lf===x[0]?'on':''}" data-a="lf" data-i="${x[0]}">${x[1]}</button>`).join('')}</div>${actTable(L)}`}
A.lf=a=>{S.lf=a.dataset.i;render()};
/* ===== announcements ===== */
function annView(){return `<div class="pillh"><span class="dot"></span>Platform</div><div class="hd"><div><h1>Announcements</h1><p class="sub">Tell institutes about maintenance, new features and policy changes.</p></div></div><div class="g2e"><div class="card"><h3>Compose</h3><div class="fl" style="margin-top:10px" data-live="ann">${fld('Title',inp('at','','e.g. Scheduled maintenance'))}${fld('Message',`<textarea class="in" id="am2" placeholder="What should institutes know?"></textarea>`)}${fld('Audience',sel('aa',['All institutes','Growth and Pro plans','Trials only','Past due only','Pick institutes…']))}<div class="row"><label class="ck" style="display:flex;gap:8px;align-items:center">${tog('ab',true)} In-app banner</label><label class="ck" style="display:flex;gap:8px;align-items:center">${tog('ae2',true)} Email</label></div><div class="pv msg" id="apv"></div><div class="row">${btn('Send now','annsend','p','','','announce')}${btn('Schedule…','toast','','Scheduling opens here (sample)','','announce')}</div></div></div><div class="card" style="margin-top:0"><h3>History</h3><div style="margin-top:10px">${tbl(['Title','Audience','Channel','Sent'],ANN.map(a=>[`<b>${esc(a.t)}</b>`,a.aud,a.ch,a.d]))}</div></div></div>`}
A.toast=a=>toast(a.dataset.i);
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('[data-live="ann"]')){const p=$('apv');if(p)p.innerHTML='<b>Preview</b><br>'+(esc($('at').value)||'<span style="color:var(--mut)">Title…</span>')+'<br>'+(esc($('am2').value)||'')}});
A.annsend=()=>{const t=val('at').trim();if(!t){toast('Add a title','bad');return}const n=val('aa')==='All institutes'?ORGS.filter(o=>o.type!=='Test').length:3;ANN.unshift({t,aud:val('aa')+' ('+n+')',ch:[val('ab')?'Banner':'',val('ae2')?'Email':''].filter(Boolean).join(' + '),d:'Today'});log(null,'Announcement sent',t);toast('✓ Sent to '+n+' institutes');render()};
/* ===== platform settings ===== */
const PERM=[['View organizations and dashboards','1 1 1 1 1'],['Create and edit organizations','1 1 0 0 0'],['Generate, resend, revoke keys','1 1 0 0 0'],['Create credentials, add Super Admin','1 1 0 0 0'],['Login as Super Admin','1 1 1 0 0'],['Edit Settings on behalf','1 1 1 1 0'],['Change plans and invoices','1 0 0 1 0'],['Load and sign off data','1 1 0 0 0'],['Send announcements','1 1 1 0 0'],['Manage ILMA team','1 0 0 0 0'],['Archive or delete an institute','1 0 0 0 0']];
const DEF={trial:14,plan:'Growth',keyexp:14,reason:true,lim:'2 hours',idle:30};
function setView(){const t=S.pst;let b='';
 if(t==='team')b=`<div class="row" style="margin-bottom:12px"><span class="sp"></span>${btn('＋ Invite team member','addstaff','p','','','team')}</div>${tbl(['Name','Email','Role','Two-step','Last active'],TEAM.map(m=>[`<b>${m.n}</b>`,m.e,pill(m.r,'acc'),m.mfa?pill('On','ok'):pill('Off','warn'),m.l]))}`;
 if(t==='roles')b=`<p class="sub">What each ILMA role can do. Preview any role with the “ILMA role” menu at the top.</p>`+tbl(['Action','Owner','Onboarding','Support','Finance','Read only'],PERM.map(p=>[p[0],...p[1].split(' ').map(x=>x==='1'?'<span style="color:var(--ok)">✓</span>':'<span style="color:var(--mut)">–</span>')]));
 if(t==='security')b=`<div class="card">${trow('Require two-step for all ILMA staff','Enforced at sign-in','s1',1)}${trow('Login as needs a reason or ticket','Stored with the session','s2',DEF.reason)}${trow('Block payments and refunds in login-as','Done from Billing only','s3',1)}${trow('Block password and two-step changes in login-as','','s4',1)}${trow('Show a copy warning when sharing credentials in chat apps','','s5',1)}<div class="fl" style="margin-top:12px"><div class="g2e">${fld('Max login-as length',sel('s6',['1 hour','2 hours','4 hours'],DEF.lim))}${fld('Idle timeout (min)',sel('s7',[15,30,60],DEF.idle))}</div>${fld('IP allowlist for Owner and Finance',inp('s8','','e.g. 39.45.0.0/16, 103.18.9.77'),'Leave blank to allow any address')}</div>${btn('Save security settings',"savesettings","p",'Security settings saved')}</div>`;
 if(t==='templates')b=`<div class="g2e"><div class="card"><h3>Credentials message</h3><textarea class="in" id="tp1" style="min-height:200px;margin-top:10px">${esc(credMsg({n:'{institute}',slug:'{slug}',owner:'{specialist}'},{n:'{name}',e:'{email}'},'{password}'))}</textarea>${btn('Save','savesettings','p','Template saved')}</div><div class="card" style="margin-top:0"><h3>Invite key email</h3><textarea class="in" id="tp2" style="min-height:200px;margin-top:10px">${esc(keyMsg({n:'{institute}'},{k:'{key}',exp:'{expiry}'},{n:'{name}'}))}</textarea>${btn('Save',"savesettings","p",'Template saved')}</div></div><div class="card"><h3>Other templates</h3><div class="row" style="margin-top:8px">${['Welcome and data request','Not signed in (day 2)','Approve your data (day 5)','Training invite (day 8)','Go-live confirmation','Trial ending','Invoice due','Suspension notice'].map(x=>btn(x,'toast','sm','Template editor opens here (sample)')).join('')}</div></div>`;
 if(t==='defaults')b=`<div class="card"><div class="g2e fl">${fld('Default trial length (days)',sel('d1',[7,14,30],DEF.trial))}${fld('Default plan for new institutes',sel('d2',['Starter','Growth','Pro'],DEF.plan))}${fld('Invite key expiry (days)',sel('d3',[7,14,30],DEF.keyexp))}${fld('Default ILMA owner',sel('d4',['Sara Qureshi','Bilal Hanif']))}</div>${btn('Save defaults',"savesettings","p",'Defaults saved')}</div>`;
 return `<div class="pillh"><span class="dot"></span>Platform</div><div class="hd"><div><h1>Platform settings</h1><p class="sub">Your ILMA team, roles, security and defaults for new institutes.</p></div></div><div class="tabs">${[['team','ILMA team'],['roles','Roles'],['security','Security'],['templates','Email templates'],['defaults','Defaults']].map(x=>`<button class="tab ${t===x[0]?'on':''}" data-a="pst" data-i="${x[0]}">${x[1]}</button>`).join('')}</div>${b}`}
A.pst=a=>{S.pst=a.dataset.i;render()};A.savesettings=a=>{log(null,'Platform settings saved',a.dataset.i);toast('✓ '+a.dataset.i)};
A.addstaff=()=>modal({title:'Invite team member',body:fld('Name',inp('tn','',''))+fld('Email',inp('te','','','email'))+fld('Role',sel('tr2',['Onboarding specialist','Support agent','Finance','Read only'])),onOk:d=>{if(!val('tn',d).trim()||!/^\S+@\S+\.\S+$/.test(val('te',d))){toast('Name and email needed','bad');return false}TEAM.push({n:val('tn',d),e:val('te',d),r:val('tr2',d),l:'Invited',mfa:0});log(null,'Team member invited',val('te',d));render()}});
render();

</script></body></html>
