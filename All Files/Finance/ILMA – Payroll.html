<style>

:root[data-theme="dark"]{--bg:#0E1024;--card:#171A3A;--ink:#ECEEFA;--mute:#9EA4C8;--line:#2A2E5A;--line2:#353A6B;--head:#1B1F44;--hover:#1D2149;--acc:#8174F2;--seg:#1F2350;--good:#37C48B;--bad:#F0776B;--warn:#E3A24A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font-family:inherit;cursor:pointer;border:0;background:none;padding:0;color:inherit;text-align:left}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh}
nav{flex:0 0 232px;background:var(--side);color:#C9C6EE;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 14px;color:#fff;font-weight:800;font-size:16px}
.logo b{width:34px;height:34px;border-radius:10px;background:#5B4BD6;display:grid;place-items:center;flex:none}
.ni{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:500;width:100%}
.ni:hover{background:rgba(255,255,255,.07)}.ni.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.ng{font-size:11px;letter-spacing:.08em;font-weight:700;color:#8A8FAE;padding:14px 12px 4px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid rgba(255,255,255,.1);color:#fff;font-weight:700}

main{flex:1;min-width:0;padding:28px;display:flex;flex-direction:column;gap:18px}
header.pg{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}

h1{margin:4px 0 0;font-size:28px;font-weight:800;letter-spacing:-.4px}
.sub{margin-top:4px;color:var(--mute)}
.hb{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line2);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.stp{display:flex;gap:6px;align-items:center;padding:14px 18px;overflow-x:auto}
.stp li{list-style:none;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mute);white-space:nowrap}
.stp li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.stp li.done{color:var(--good)}.stp li.done i{background:var(--good);border-color:var(--good);color:#fff}
.stp li.cur{color:var(--ink);font-weight:800}.stp li.cur i{border-color:var(--acc);color:var(--acc)}
.stp li+li::before{content:"";width:28px;height:2px;background:var(--line2);margin-right:2px}
.stp ol{display:flex;gap:6px;margin:0;padding:0;align-items:center;flex:1}
.pd{margin-left:auto;color:var(--mute);white-space:nowrap;padding-left:14px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.tile{padding:16px 18px;text-align:left;display:block;width:100%}
.tile .l{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;display:block}
.tile b{display:block;font-size:22px;margin:6px 0 4px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}

.tr.g{color:var(--good);font-weight:700}.tr.b{color:var(--bad);font-weight:700}
.bar{height:7px;border-radius:4px;background:var(--seg);overflow:hidden;display:flex;margin:6px 0}.bar i{display:block;height:100%}
.leg{display:flex;gap:10px;font-size:11px;color:var(--mute);flex-wrap:wrap}.leg span::before{content:"●";margin-right:3px;color:var(--c)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.two .card{padding:16px 18px}
.two h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.att{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.att:first-of-type{border-top:0}
.att span{flex:1}.att em{font-style:normal;font-size:18px}
.ok{display:flex;gap:10px;align-items:center;color:var(--good);font-weight:700;padding:14px 0}
.cd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd div.k small{display:block;color:var(--mute);font-size:12px}.cd div.k b{font-size:18px;font-variant-numeric:tabular-nums}
.cd input{width:100%;font:inherit;font-weight:700;border:1px solid var(--line2);border-radius:8px;padding:5px 8px;background:var(--card);color:var(--ink)}
.dn{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.short{margin-top:10px;font-weight:700;padding:8px 12px;border-radius:10px}
.short.b{background:color-mix(in srgb,var(--bad) 13%,var(--card));color:var(--bad)}.short.g{background:color-mix(in srgb,var(--good) 13%,var(--card));color:var(--good)}
.hint{display:flex;gap:10px;align-items:center;background:#EAF1FD;border:1px solid #BCD4F5;color:#1A4F8F;border-radius:12px;padding:11px 16px}

.trow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;color:var(--mute);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,16,60,.12);font-weight:700}
.cnt{font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;background:var(--line);color:var(--mute)}
.fb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mn{display:flex;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:10px;height:40px}

.sr{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:0 12px;height:40px;flex:1 1 220px;max-width:380px;color:var(--mute)}

select{height:40px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:10px;padding:0 10px;font:inherit;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line2);background:var(--card);font-weight:600;display:flex;gap:6px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bulk{display:none;flex-wrap:wrap;align-items:center;gap:10px;background:var(--side);color:#fff;border-radius:12px;padding:10px 14px}.bulk.on{display:flex}
.bulk b{flex:1 1 140px}.bulk button{padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.14);font-weight:700;font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th{text-align:left;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px;background:var(--head);padding:14px 8px;font-weight:700}
td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;gap:12px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;color:color-mix(in srgb,var(--c) 78%,var(--ink));background:color-mix(in srgb,var(--c) 15%,var(--card));white-space:nowrap}
.key{font-size:10px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:5px;color:#fff;background:var(--c);margin-left:6px;vertical-align:1px}
.mini{font-size:11px;font-weight:700;color:var(--mute);background:var(--seg);border-radius:6px;padding:2px 7px;white-space:nowrap}
.dm{color:var(--mute)}.db{color:var(--bad);font-weight:700}
.ab{height:5px;border-radius:3px;background:var(--seg);width:90px;overflow:hidden;margin-top:4px}.ab i{display:block;height:100%;background:var(--good)}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}.ib:hover{background:var(--seg)}
.foot{padding:14px 18px;border-top:1px solid var(--line);color:var(--mute)}
.cards{display:none}
.ov{position:fixed;inset:0;background:rgba(20,16,60,.4);z-index:30;display:none}.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);z-index:31;display:none;flex-direction:column;box-shadow:-12px 0 40px rgba(20,16,60,.25)}.dr.on{display:flex}
.dr .hd{padding:20px 22px;display:flex;gap:14px;align-items:center}
.dr .bd{flex:1;overflow:auto;padding:4px 22px 22px;display:flex;flex-direction:column;gap:18px}
.dr h4{margin:0 0 8px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;gap:10px}
.li.t{font-weight:800;border:0;font-size:16px}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 12px}.tl li::before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tl small{display:block;color:var(--mute)}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ag .btn{justify-content:flex-start;padding:10px 12px}
.fm{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--head);border-radius:12px;border:1px solid var(--line)}
.fm input,.fm select{width:100%;font:inherit;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);height:auto}
.err{color:var(--bad);font-size:12px;font-weight:600;display:none}
.wz{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;z-index:32;padding:24px;display:none}.wz.on{display:block}
.wz h2{margin:0 0 6px}
.pv{padding:16px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,var(--card));text-align:center;margin:14px 0}
.pv b{font-size:22px;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--side);color:#fff;border-radius:14px;padding:12px 16px;display:none;gap:14px;align-items:center;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.35);max-width:94vw}
.toast.on{display:flex}.toast button{color:#C9C2FF;font-weight:700}
.menu{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,16,60,.2);padding:6px;z-index:40;display:none;min-width:210px}.menu.on{display:block}
.menu button,.menu div{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;border-radius:8px;font-weight:500}.menu button:hover{background:var(--seg)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.fab{display:none}
@media(max-width:1180px){.strip{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:820px){nav{display:none}main{padding:16px 16px 90px}.tw{display:none}.cards{display:flex;flex-direction:column}
.cards>div{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}.pd{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 case'ded':{const dd={Absence:0,Loan:0,Tax:0};S.forEach(x=>x.ded.forEach(d=>dd[d[2]==='abs'?'Absence':d[2]==='loan'?'Loan recovery':'Tax']+=d[1]));const m=$('menu'),r=t.getBoundingClientRect();m.innerHTML='<div><b>Deduction breakdown</b></div>'+Object.entries({'Absence':sum(S,x=>sum(x.ded.filter(d=>d[2]==='abs'),d=>d[1])),'Loan recovery':sum(S,x=>sum(x.ded.filter(d=>d[2]==='loan'),d=>d[1])),'Income tax':sum(S,x=>sum(x.ded.filter(d=>d[2]==='tax'),d=>d[1]))}).map(([n,v])=>`<div><span class="dm">${n}</span><b>${R(v)}</b></div>`).join('');m.style.top=r.bottom+4+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-230))+'px';m.classList.add('on');break}
 case'on':if(G<2){toast('Approve the payroll first.');break}if(s.st==='failed'||!s.acct){sendOnline(s);break}payAllModal([id]);break;
 case'payOk':{if($('otp').value!=='1234'){$('oe').style.display='block';return}const ids=t.dataset.ids.split(',').map(Number);closeAll();ids.forEach(i=>sendOnline(S.find(x=>x.id===i)));toast(`Sending ${ids.length} transfers…`);break}
 case'cash':if(G<2){toast('Approve the payroll first.');break}cashModal([id]);break;
 case'cashOk':{const u=snap(),ids=t.dataset.ids.split(',').map(Number),by=$('hb').value,cf=$('hc').value;ids.forEach(i=>{const x=S.find(y=>y.id===i);x.st='paid';x.by=by;x.conf=cf});if(G<3)G=3;closeAll();toast(`${ids.length} cash payment${ids.length>1?'s':''} recorded`,u);chkDone();break}
 case'hold':{const u=snap();s.st='hold';render();toast(s.n+' placed on hold',u);break}
 case'rel':s.st='pending';render();toast(s.n+' released');break;
 case'slip':case'pdf':toast('Payslip PDF ready for '+s.n);break;case'wa':toast('Payslip sent to '+s.n+' on WhatsApp');break;
 case'adj':F.form='adj';render();break;case'formX':F.form=null;render();break;
 case'adjOk':{const l=$('al').value.trim(),v=+$('aa').value;if(!l||v<=0){$('ae').style.display='block';return}const u=snap();$('at').value==='b'?s.earn.push([l,v]):s.ded.push([l,v,'oth']);F.form=null;render();toast('Added '+l,u);break}
 case'menu':{const m=$('menu'),r=t.getBoundingClientRect();m.innerHTML=`<button data-a="open" data-id="${id}">${ic('doc')}View payslip</button><button data-a="wa" data-id="${id}">${ic('send')}WhatsApp payslip</button><button data-a="hold" data-id="${id}">${ic('pause')}Hold payment</button>`;m.style.top=Math.min(r.bottom+4,innerHeight-170)+'px';m.style.left=Math.max(8,r.right-210)+'px';m.classList.add('on');break}
 case'fixAtt':S.forEach(x=>{if(!x.att)x.att=[22,22]});render();toast('Attendance marked present for 22 days');break;
 case'addAcct':s.acct=(s.m==='bank'?'HBL':'Account')+' ••3571';render();toast('Bank details added for '+s.n);break;
 case'focusCash':$('coh').focus();$('coh').select();break;
 case'env':toast('Printing '+S.filter(x=>x.m==='cash'&&x.st!=='paid').length+' pay envelopes (demo)');break;
 case'bOn':payAllModal(sel);break;case'bCash':cashModal(sel);break;
 case'bHold':{const u=snap();sel.forEach(i=>{const x=S.find(y=>y.id===i);if(x.st==='pending')x.st='hold'});F.chk.clear();render();toast('Selected staff placed on hold',u);break}
 case'bSlip':toast('Printing '+sel.length+' payslips');break;case'bWa':toast('Payslips sent to '+sel.length+' staff on WhatsApp');break;case'bClr':F.chk.clear();render();break}});
$('q').oninput=e=>{F.q=e.target.value;render()};$('fm').onchange=e=>{F.meth=e.target.value;render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$('theme').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
render();
</script>
</body>
</html>
