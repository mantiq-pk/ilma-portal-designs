<style>
:root{--navy:#1E3A8A;--blue:#3B82F6;--cyan:#22D3EE;--sky:#38BDF8;--violet:#8B5CF6;--gold:#F59E0B;
--bg:#F5F9FF;--ink:#0F1E3D;--mut:#5B6B8C;--line:#E3EBF8;--soft:#EEF4FF;--g1:#0B6E5C;--g2:#14B8A6;--em:#0B6E5C;--gold2:#D4A017;--ok:#0E9F6E;--okb:#E3F8EE;--wb:#FEF3C7;--wt:#92400E;--bd:#DC2626;--bdb:#FEE4E2}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 Inter,system-ui,Arial,sans-serif;color:var(--ink);background:radial-gradient(900px 520px at 88% -8%,rgba(139,92,246,.13),transparent 62%),radial-gradient(760px 520px at 8% -4%,rgba(34,211,238,.16),transparent 62%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:24px;margin:0;letter-spacing:-.02em}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.app>*{min-width:0}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:16px 12px 20px;display:flex;flex-direction:column;gap:2px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px}
.logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line),0 6px 22px rgba(59,130,246,.28);position:relative;animation:glow 4.5s ease-in-out infinite}
.logo img{width:36px;height:36px;object-fit:contain}
@keyframes glow{50%{box-shadow:0 0 0 1px var(--line),0 6px 30px rgba(139,92,246,.4)}}
.bn{font-weight:800;font-size:19px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--navy),var(--blue) 60%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.bn small{font-weight:600;background:none;color:var(--gold);-webkit-text-fill-color:var(--gold);font-size:19px}
.org{font-size:12px;color:var(--mut)}
.nh{font-size:10.5px;letter-spacing:.09em;color:#8A99B8;padding:14px 12px 4px;font-weight:700}
.nv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#3A4A6B;cursor:pointer;border:0;background:none;text-align:left;width:100%;min-height:40px;transition:.18s}
.nv svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nv:hover{background:var(--soft)}
.nv.on{background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(139,92,246,.14));color:var(--navy);font-weight:700;box-shadow:inset 0 0 0 1px rgba(59,130,246,.22)}
.nv.on svg{stroke:var(--g1);opacity:1}
.nv .sp{margin-left:auto;color:var(--gold);font-size:12px}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--mut)}
main{padding:0 28px 40px;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 0;margin:0 -28px;padding-inline:28px;background:rgba(245,249,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid transparent;flex-wrap:wrap}

'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY='2026-10-28',NOW=9*60+30,DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dt=s=>new Date(s+'T00:00:00');
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return ds(d)};
const dow=s=>(dt(s).getDay()+6)%7;
const fmtD=s=>dt(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtDY=s=>dt(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const tm=m=>{const h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+(mm?':'+String(mm).padStart(2,'0'):'')+(h<12?' am':' pm')};
const tmin=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const tstr=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const money=n=>'PKR '+Math.round(n).toLocaleString('en-US');
const mshort=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?Math.round(n/1e3)+'K':String(Math.round(n));
const pl=w=>/(s|x|ch|sh)$/i.test(w)?w+'es':/[^aeiou]y$/i.test(w)?w.slice(0,-1)+'ies':w+'s';
const chip=(t,c='')=>`<span class="ch ${c}">${esc(t)}</span>`;

  const s={id:'T-'+(1000+S.d.students.length+1+Math.floor(Math.random()*40)),name:v.name.trim(),father:v.f,g:v.g,track:h.type,h:h.id,route:h.type==='hifz'?v.r:'fwd',skill:.6,pa:.9,target:7,res:v.res,spon:v.sp,phone:v.p,joined:TODAY,status:'Active',fee:'Unpaid',st:{}};
  if(h.type==='hifz'){s.pos=Math.round(PL()*(+v.pre||0));doneParas(s).forEach(p=>s.st[p]={q:3,last:addD(TODAY,-10)})}else if(h.type==='nazra')s.pos=0;else{s.ql=1;s.qp=1}
  S.d.students.unshift(s);log('Admitted '+s.name);toast(s.name+' admitted to '+h.name+' · fee voucher created');render()}})};

/* ---------- Daily Diary (Roznamcha) ---------- */
const sugPara=s=>[...doneParas(s)].sort((a,b)=>{const x=strOf(s,a),y=strOf(s,b);return (x?x.last:'0')<(y?y.last:'0')?-1:1});
function defDraft(s,date){const old=entry(s.id,date);
 if(s.track==='hifz'){const sp=sugPara(s);if(old)return{att:old.att,ng:old.sab.nagha,lines:old.sab.lines||s.target,sq:old.sab.q,pages:old.sbq.pages||3,bq:old.sbq.q,para:old.mnz.para||sp[0]||0,mq:old.mnz.q,err:old.err,rem:old.rem||''};
  return{att:onLeave(s.id,date)?'V':'P',ng:onLeave(s.id,date),lines:s.target,sq:4,pages:3,bq:4,para:sp[0]||0,mq:4,err:0,rem:''}}
 if(s.track==='nazra'){if(old)return{att:old.att,ng:old.att==='A'||old.att==='V',pages:old.nz.pages||2,q:old.nz.q,taj:old.nz.taj||'',err:old.err,rem:old.rem||''};return{att:onLeave(s.id,date)?'V':'P',ng:false,pages:2,q:4,taj:'',err:0,rem:''}}
 if(old)return{att:old.att,ng:false,lesson:old.qd.lesson,page:old.qd.page,q:old.qd.q,err:0,rem:old.rem||''};return{att:onLeave(s.id,date)?'V':'P',ng:false,lesson:s.ql,page:s.qp,q:4,err:0,rem:''}}
function sabqiHint(s,date){const e=S.d.en.filter(x=>x.sid===s.id&&x.sab&&x.date<date&&x.date>=addD(date,-7)&&x.sab.lines>0);if(!e.length)return 'No recent sabaq';const f=e.reduce((a,b)=>a.sab.from<b.sab.from?a:b),l=e.reduce((a,b)=>a.sab.to>b.sab.to?a:b);return `Last 7 days: ${posText(s,f.sab.from).replace(' · Line',' L')} → ${posText(s,l.sab.to).replace(' · Line',' L')} (≈ ${Math.max(1,Math.round(e.reduce((a,x)=>a+x.sab.lines,0)/S.cfg.lpp))} pp)`}
V.dia=()=>{if(S.role==='guardian')return gDiary();const u=S.ui,hs=visH();if(!hs.length)return head('Daily Diary','')+'<div class="card">No halaqat assigned.</div>';
 if(!u.dh||!hs.find(h=>h.id===u.dh))u.dh=hs[0].id;u.dd=u.dd||TODAY;const h=hal(u.dh),key=u.dh+'|'+u.dd,ss=S.d.students.filter(s=>s.h===h.id&&s.status==='Active');
 if(u.dk!==key){u.dr={};ss.forEach(s=>u.dr[s.id]=defDraft(s,u.dd));u.dk=key}
 const sb=S.d.sub[key],off=dow(u.dd)===S.cfg.off;const cnt={P:0,A:0,L:0,V:0};ss.forEach(s=>cnt[u.dr[s.id].att]++);
 return head('Daily Diary · Roznamcha',`Record Sabaq (new lesson), Sabqi (recent revision) and Manzil (old revision) for every talib`,`<button class="bt g" data-a="dall">All present</button><button class="bt p" data-a="dsave">Save &amp; submit diary</button>`)+
 `<div class="tools"><select class="in" data-i="dh" aria-label="Halaqah">${opts(hs.map(x=>[x.id,x.name]),u.dh)}</select><input class="in" type="date" data-i="dd" value="${u.dd}" max="${TODAY}" aria-label="Date"><span class="ch gd">${esc(hij(u.dd))}</span>${chip(sb?'Submitted':'Not submitted',sb?'ok':'wn')}${off?chip('Weekly off · '+DN[S.cfg.off],'gy'):''}<label class="row sm"><input type="checkbox" class="tog" data-i="dnot" ${u.dnot?'checked':''}> Send daily report to guardians</label></div>
 <div class="row wrap sm" style="margin-bottom:12px">${h.sess.map(x=>`<span class="sess">${SLOTS[x.slot]} ${tm(x.s)}–${tm(x.e)} · ${x.label}</span>`).join('')}<span style="flex:1"></span><span class="ch ok">${cnt.P} present</span><span class="ch wn">${cnt.L} late</span><span class="ch bd">${cnt.A} absent</span><span class="ch gy">${cnt.V} leave</span></div>`+
 ss.map(s=>diaCard(s,u.dr[s.id],u.dd)).join('')||'<div class="card">No talaba in this halaqah.</div>'};
function diaCard(s,r,date){const away=r.att==='A'||r.att==='V',id=s.id;
 const seg=`<div class="seg" role="group" aria-label="Attendance of ${esc(s.name)}">${[['P','Present'],['L','Late'],['A','Absent'],['V','Leave']].map(([k,l])=>`<button class="${r.att===k?'on '+(k==='V'?'L':k):''}" data-a="dseg" data-s="${id}" data-v="${k}" aria-label="${l}" title="${l}">${k}</button>`).join('')}</div>`;
 const f=(k,t='number',x='')=>`id="d_${id}_${k}" data-i="dd" data-s="${id}" data-f="${k}" ${x}`;
 let body='';
 if(away)body=`<p class="mut" style="margin:10px 0 0">${r.att==='V'?'On approved leave (Rukhsat)':'Absent'} — no lesson recorded.</p>`;
 else if(s.track==='hifz'){const to=Math.min(TL(),s.pos+(r.ng?0:r.lines));
  body=`<div class="dsec"><div><h4>Sabaq · سبق <label class="row sm" style="text-transform:none;letter-spacing:0"><input type="checkbox" ${f('ng','checkbox')} ${r.ng?'checked':''}> Nagha</label></h4>${r.ng?'<p class="mut sm" style="margin:6px 0">No new lesson today.</p>':`<label class="f">Lines<input class="in" type="number" min="1" max="${S.cfg.lpp*S.cfg.ppp}" ${f('lines')} value="${r.lines}"></label><div class="sm mut" style="margin:6px 0">${esc(posText(s))} → <b>${esc(posText(s,to))}</b></div><label class="f">Quality<select class="in" ${f('sq','select')}>${qopts(r.sq)}</select></label>`}</div>
  <div><h4>Sabqi · سبقی</h4><label class="f">Pages revised<input class="in" type="number" min="0" max="20" ${f('pages')} value="${r.pages}"></label><div class="sm mut" style="margin:6px 0">${esc(sabqiHint(s,date))}</div><label class="f">Quality<select class="in" ${f('bq','select')}>${qopts(r.bq)}</select></label></div>
  <div><h4>Manzil · منزل</h4>${doneParas(s).length?`<label class="f">Para revised<select class="in" ${f('para','select')}>${doneParas(s).map(p=>`<option value="${p}" ${r.para===p?'selected':''}>Para ${p}${strOf(s,p)?' · '+ageOf(strOf(s,p).last)+'d ago':''}${isOver(s,p)?' ⚠':''}</option>`).join('')}</select></label><div class="sm mut" style="margin:6px 0">Suggested: Para ${sugPara(s).slice(0,S.cfg.mpd).join(', ')}</div><label class="f">Quality<select class="in" ${f('mq','select')}>${qopts(r.mq)}</select></label>`:'<p class="mut sm" style="margin:6px 0">No completed para yet.</p>'}</div></div>
  <div class="row sb wrap" style="margin-top:10px"><span class="row sm">Mistakes (ghalti): <span class="step"><button data-a="dstep" data-s="${id}" data-d="-1" aria-label="Less">−</button><b>${r.err}</b><button data-a="dstep" data-s="${id}" data-d="1" aria-label="More">+</button></span></span><input class="in" style="flex:1;min-width:160px" placeholder="Remark for guardian (optional)" ${f('rem','text')} value="${esc(r.rem)}"></div>`}
 else if(s.track==='nazra')body=`<div class="dsec" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><h4>Reading · today</h4><label class="f">Pages read<input class="in" type="number" min="0" max="20" ${f('pages')} value="${r.pages}"></label><div class="sm mut" style="margin-top:6px">${esc(posText(s))} → <b>${esc(posText(s,Math.min(TP(),s.pos+r.pages)))}</b></div></div><div><h4>Quality</h4><label class="f">Fluency &amp; accuracy<select class="in" ${f('q','select')}>${qopts(r.q)}</select></label></div><div><h4>Tajweed note</h4><label class="f">Focus<input class="in" ${f('taj','text')} value="${esc(r.taj)}" placeholder="e.g. Madd, Ghunna"></label></div></div><div class="row sm" style="margin-top:10px">Mistakes: <span class="step"><button data-a="dstep" data-s="${id}" data-d="-1" aria-label="Less">−</button><b>${r.err}</b><button data-a="dstep" data-s="${id}" data-d="1" aria-label="More">+</button></span></div>`;
 else body=`<div class="dsec" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><h4>Noorani Qaida lesson</h4><label class="f">Lesson (1–${QLESSONS})<input class="in" type="number" min="1" max="${QLESSONS+1}" ${f('lesson')} value="${r.lesson}"></label></div><div><h4>Page</h4><label class="f">Page in lesson<input class="in" type="number" min="1" max="${QPAGES}" ${f('page')} value="${r.page}"></label></div><div><h4>Quality</h4><label class="f">Pronunciation<select class="in" ${f('q','select')}>${qopts(r.q)}</select></label></div></div>`;
 return `<div class="dcard ${away?'off':''}"><div class="row sb wrap"><span class="row">${avatar(s.name,40)}<span><b>${esc(s.name)}</b><div class="sm mut">${s.id} · ${esc(posText(s))}${s.track==='hifz'?` · ${doneParas(s).length} paras`:''}</div></span></span>${seg}</div>${body}</div>`}
I.dh=el=>{S.ui.dh=+el.value;S.ui.dk=null;render()};I.dd=el=>{if(!el.dataset.f){if(el.value){S.ui.dd=el.value;S.ui.dk=null;render()}return}const r=S.ui.dr[el.dataset.s],f=el.dataset.f;let v=el.type==='checkbox'?el.checked:el.value;if(['lines','pages','sq','bq','mq','q','lesson','page','para'].includes(f))v=+v||0;r[f]=v;render()};
I.dnot=el=>{S.ui.dnot=el.checked};
A.dseg=el=>{const r=S.ui.dr[el.dataset.s];r.att=el.dataset.v;if(r.att==='A'||r.att==='V')r.ng=true;else if(r.ng&&S.d.students&&stu(el.dataset.s).track==='hifz')r.ng=false;render()};
A.dstep=el=>{const r=S.ui.dr[el.dataset.s];r.err=Math.max(0,r.err+ +el.dataset.d);render()};
A.dall=()=>{Object.values(S.ui.dr).forEach(r=>{if(r.att!=='V'){r.att='P';r.ng=false}});render()};
function saveOne(s,r,date){const old=entry(s.id,date),ok=r.att==='P'||r.att==='L';let e={id:old?old.id:nid('E'),date,sid:s.id,att:r.att,err:ok?(r.err||0):0,rem:r.rem||''};const before=s.pos;
 if(s.track==='hifz'){let pos=s.pos-(old&&old.sab?old.sab.lines:0);const lines=ok&&!r.ng?Math.max(0,Math.min(r.lines,TL()-pos)):0;e.sab={lines,from:pos,to:pos+lines,q:r.sq,nagha:!lines};e.sbq={pages:ok?r.pages:0,q:r.bq};e.mnz={para:ok?r.para:0,q:r.mq};s.pos=pos+lines;
  if(Math.floor(s.pos/PL())>Math.floor(before/PL())&&!old)S.d.ms.push({id:nid('M'),sid:s.id,type:'para',para:paraAt(s.route,Math.floor(before/PL())),date});
  if(ok&&r.para&&doneParas(s).includes(r.para))s.st[r.para]={q:r.mq,last:date}}
 else if(s.track==='nazra'){let pos=s.pos-(old&&old.nz?old.nz.pages:0);const pg=ok?Math.max(0,Math.min(r.pages,TP()-pos)):0;e.nz={from:pos,to:pos+pg,pages:pg,q:r.q,taj:r.taj};s.pos=pos+pg;if(Math.floor(s.pos/S.cfg.ppp)>Math.floor(before/S.cfg.ppp)&&!old)S.d.ms.push({id:nid('M'),sid:s.id,type:'para',para:Math.floor(before/S.cfg.ppp)+1,date})}
 else{e.qd={lesson:r.lesson,page:r.page,q:r.q,nagha:!ok};if(ok){s.ql=Math.min(QLESSONS,r.lesson);s.qp=r.page;if(r.lesson>QLESSONS&&!old)S.d.ms.push({id:nid('M'),sid:s.id,type:'qaida',date})}}
 if(old)S.d.en[S.d.en.indexOf(old)]=e;else S.d.en.push(e)}
A.dsave=()=>{const u=S.ui,ss=S.d.students.filter(s=>s.h===u.dh&&s.status==='Active');const n0=S.d.ms.length;ss.forEach(s=>saveOne(s,u.dr[s.id],u.dd));S.d.sub[u.dh+'|'+u.dd]=true;u.dk=null;log('Diary submitted: '+hal(u.dh).name+' '+u.dd);
 const nm=S.d.ms.length-n0;toast(`Diary saved for ${ss.length} talaba${u.dnot?' · WhatsApp reports queued':''}${nm?` · ${nm} milestone${nm>1?'s':''} reached 🎉`:''}`);if(u.dnot)S.d.msgs.push({t:u.dd,k:'daily report',n:ss.length});render()};
function gDiary(){const s=stu(S.child),ev=entsOf(s.id,14);return head(S.child?esc(s.name)+' · diary':'Diary','Last 14 days of Sabaq, Sabqi and Manzil, as recorded by Ustaz')+`<div class="card">${ev.map(e=>diaLine(s,e)).join('')||'<p class="mut">No entries yet.</p>'}</div>`}

V.rev=()=>{if(S.role==='guardian'){const s=stu(S.child);return head('Para strength · '+esc(s.name),'How firmly each memorised para is held, and when it was last revised')+`<div class="card">${s.track==='hifz'?paraGrid(s,false)+legend():'<p class="mut">Para strength starts once Hifz begins.</p>'}</div>`}
 const u=S.ui,L=visS().filter(s=>s.track==='hifz'&&doneParas(s).length).sort((a,b)=>overdueParas(b).length-overdueParas(a).length);if(!L.length)return head('Revision Planner','')+'<div class="card">No hifz talaba with completed paras.</div>';
 if(!u.rs||!L.find(s=>s.id===u.rs))u.rs=L[0].id;const s=stu(u.rs),sp=sugPara(s),od=overdueParas(s);
 const plan=Array.from({length:7},(_,i)=>({d:addD(TODAY,i),p:sp.slice(i*S.cfg.mpd,(i+1)*S.cfg.mpd)})).filter(x=>dow(x.d)!==S.cfg.off);

function repData(k){const u=S.ui,ss=visS(),hs=visH();
 if(k==='stu'){const s=stu(u.rps)||ss[0];if(!s)return{cols:['Info'],rows:[['No talib']]};const ev=entsOf(s.id,14).reverse();return{title:`${s.name} · ${hal(s.h).name} · ${posText(s)}`,pick:true,s,cols:['Date','Attendance','Sabaq (lines)','Sabaq quality','Sabqi (pp)','Manzil','Mistakes'],rows:ev.map(e=>[fmtD(e.date),{P:'Present',L:'Late',A:'Absent',V:'Leave'}[e.att],e.sab?e.sab.lines:e.nz?e.nz.pages+' pp':'—',e.sab&&e.sab.lines?QL[e.sab.q][0]:e.nz?QL[e.nz.q][0]:e.qd?QL[e.qd.q][0]:'—',e.sbq?e.sbq.pages:'—',e.mnz&&e.mnz.para?'Para '+e.mnz.para:'—',e.err||0])}}
 if(k==='hal')return{cols:['Halaqah','Qari','Talaba','Attendance %','Avg quality','Sabaq lines (14d)','Revision overdue'],rows:hs.map(h=>{const st=S.d.students.filter(s=>s.h===h.id&&s.status==='Active'),at=st.map(s=>attPct(s.id)).filter(x=>x!==null),qs=st.map(s=>avgQ(s.id,14)).filter(Boolean);return[h.name,qari(h.q).name,st.length,at.length?Math.round(at.reduce((a,b)=>a+b,0)/at.length)+'%':'—',qs.length?(qs.reduce((a,b)=>a+b,0)/qs.length).toFixed(1):'—',S.d.en.filter(e=>e.sab&&st.some(s=>s.id===e.sid)).reduce((a,e)=>a+e.sab.lines,0),st.reduce((a,s)=>a+overdueParas(s).length,0)]})};

 if(k==='rev')return{cols:['Talib','Halaqah','Overdue paras','Count','Oldest revision'],rows:ss.filter(s=>overdueParas(s).length).sort((a,b)=>overdueParas(b).length-overdueParas(a).length).map(s=>{const o=overdueParas(s);return[s.name,hal(s.h).name,o.map(p=>'P'+p).join(', '),o.length,Math.max(...o.map(p=>strOf(s,p)?ageOf(strOf(s,p).last):99))+' days']})};
 if(k==='ng')return{cols:['Talib','Halaqah','Nagha days (14d)','Current streak','Attendance'],rows:ss.map(s=>[s,entsOf(s.id,14).filter(e=>(e.sab&&e.sab.nagha)||(e.qd&&e.qd.nagha)).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(([s,n])=>[s.name,hal(s.h).name,n,nagha(s.id),(attPct(s.id)??'—')+'%'])};
 if(k==='exm'){const x=S.d.exams.filter(e=>e.status==='Published'&&e.hids.some(h=>hs.some(z=>z.id===h))).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!x)return{cols:['Info'],rows:[['No published exams']]};return{title:x.title+' · '+fmtDY(x.date),cols:['Talib','Ghalti','Atkan','Lahn','Marks','Grade','Result'],rows:xStu(x).filter(s=>ss.includes(s)&&x.res[s.id]).map(s=>{const r=x.res[s.id],m=marksOf(r);return[s.name,r.gh,r.at,r.lh,m,QL[gradeQ(m)][0],m>=S.cfg.pass?'Pass':'Repeat']})}}
 return{cols:['Date','Talib','Milestone'],rows:S.d.ms.filter(m=>ss.some(s=>s.id===m.sid)).sort((a,b)=>b.date.localeCompare(a.date)).map(m=>[fmtD(m.date),stu(m.sid).name,MST[m.type](m)])}}

 `<div class="split l250"><div class="card" style="padding:8px">${REPS.map(r=>`<button class="nv ${r[0]===k?'on':''}" data-a="rp" data-k="${r[0]}"><span>${r[1]}</span></button>`).join('')}</div><div><div class="tools">${d.pick?`<select class="in" data-i="rps" aria-label="Talib">${opts(visS().map(s=>[s.id,s.name+' · '+hal(s.h).name]),(d.s||{}).id)}</select>`:''}</div>
 <div class="card" style="padding:0"><div style="padding:14px 16px;border-bottom:1px solid var(--line)"><b>${esc(REPS.find(r=>r[0]===k)[1])}</b>${d.title?`<div class="sm mut">${esc(d.title)}</div>`:''}<div class="sm mut">${esc(S.cfg.org)} · ${fmtDY(TODAY)} · ${esc(hij(TODAY))}</div></div>${d.s&&d.s.track==='hifz'?`<div style="padding:12px 16px;border-bottom:1px solid var(--line)"><div class="stat"><div><span class="mut sm">Paras memorised</span><b>${doneParas(d.s).length}</b></div><div><span class="mut sm">Attendance</span><b>${attPct(d.s.id)??'—'}%</b></div><div><span class="mut sm">Avg quality</span><b>${avgQ(d.s.id,14)??'—'}/5</b></div><div><span class="mut sm">Overdue paras</span><b>${overdueParas(d.s).length}</b></div></div></div>`:''}<div class="tw"><table><thead><tr>${d.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td class="mut" style="padding:18px">Nothing to report.</td></tr>'}</tbody></table></div></div></div></div>`};

/* ---------- Settings ---------- */
const MUSH={m15:['Madani 15-line (604 pages)',15],i16:['Indo-Pak 16-line',16],i13:['Indo-Pak 13-line',13]};
V.set=()=>{const c=S.cfg;return head('Settings','Configure the module for your school — mushaf, marking rules, weekly off and revision pace')+
 `<div class="grid g2"><div class="card"><h3>Mushaf &amp; progress</h3><p class="sm mut">Hifz progress is counted in lines; ${c.ppp} pages per para.</p><div class="fg"><label class="f full">Mushaf<select class="in" data-i="mush">${opts(Object.entries(MUSH).map(([k,v])=>[k,v[0]]),Object.keys(MUSH).find(k=>MUSH[k][1]===c.lpp)||'m15')}</select></label><label class="f">Weekly off day<select class="in" data-i="off">${opts(DN.map((d,i)=>[i,d]),c.off)}</select></label><label class="f">Manzil paras per day<input class="in" type="number" min="1" max="5" data-i="mpd" value="${c.mpd}"></label></div><p class="sm mut" style="margin-top:10px">Changing the mushaf remaps every talib’s position proportionally.</p></div>
 <div class="card"><h3>Exam marking</h3><div class="fg"><label class="f">Deduction per ghalti<input class="in" type="number" min="0" data-i="gh" value="${c.gh}"></label><label class="f">Deduction per atkan<input class="in" type="number" min="0" data-i="at" value="${c.at}"></label><label class="f">Deduction per lahn<input class="in" type="number" min="0" data-i="lh" value="${c.lh}"></label><label class="f">Pass mark<input class="in" type="number" min="0" max="100" data-i="pass" value="${c.pass}"></label></div></div>
 <div class="card"><h3>Quality scale</h3>${[5,4,3,2,1].map(q=>`<div class="row sb" style="padding:8px 0;border-top:1px solid #EEF3FB"><span class="row">${qchip(q)}<span class="ar" style="font-size:16px">${QL[q][1]}</span></span><span class="sm mut">grade ≥ ${[0,0,60,70,80,90][q]||'<60'}</span></div>`).join('')}</div>
 <div class="card"><h3>Institution</h3><div class="fg"><label class="f full">School name<input class="in" id="s_org" data-i="org" value="${esc(c.org)}"></label></div><div class="sm mut" style="margin-top:12px;font-weight:600">Accent</div><div class="row" style="margin-top:8px">${Object.entries(ACC).map(([k,v])=>`<button class="sw ${c.accent===k?'on':''}" style="background:linear-gradient(135deg,${v[0]},${v[1]})" data-a="acc" data-k="${k}" aria-label="${k}"></button>`).join('')}</div></div></div>`};

['gh','at','lh','pass','mpd'].forEach(k=>I[k]=el=>{S.cfg[k]=Math.max(0,+el.value||0)});I.org=el=>{S.cfg.org=el.value;side()};I.off=el=>{S.cfg.off=+el.value;toast('Weekly off set to '+DN[+el.value])};

const EVENTS=['hifz.diary.submitted','hifz.sabaq.recorded','hifz.para.completed','hifz.hifz.completed','nazra.stage.changed','hifz.revision.overdue','hifz.exam.published','hifz.leave.approved'];
V.int=()=>{const u=S.ui;u.lk=u.lk||LINKS.map(()=>true);u.ev=u.ev||[];const ev=EVENTS.includes(u.evs)?u.evs:EVENTS[0],s=S.d.students.find(x=>x.track==='hifz'&&x.h===1);
 const pay={event:ev,occurred_at:TODAY+'T09:30:00+05:00',tenant:'dar-ul-huda',talib:{ilma_student_id:s.id,name:s.name},halaqah:{ilma_batch_id:'HLQ-'+s.h,name:hal(s.h).name},data:ev.includes('para')?{para:paraAt(s.route,Math.floor(s.pos/PL())-1),completed_paras:doneParas(s).length}:ev.includes('exam')?{exam:'Monthly Para Test',marks:88,grade:'Jayyid Jiddan'}:ev.includes('sabaq')?{lines:8,from:'Para '+paraAt(s.route,Math.floor(s.pos/PL()))+' p'+(Math.floor((s.pos%PL())/S.cfg.lpp)+1),quality:'Mumtaz'}:{}};
 return head('ILMA Integration','How the Hifz &amp; Nazra module plugs into ILMA ERP — shared records, emitted events and API',`<span class="ch vi">Module key: hifz_nazra</span>`)+
 `<div class="card" style="padding:0;margin-bottom:16px"><div class="b" style="padding:12px 16px">Data links</div>${LINKS.map(([n,d,dir],i)=>`<div class="row sb wrap" style="padding:11px 16px;border-top:1px solid #EEF3FB"><span><b>${n}</b><div class="sm mut">${d}</div></span><span class="row">${chip(dir==='in'?'← reads from ILMA':dir==='out'?'→ writes to ILMA':'⇄ two-way',dir==='two'?'vi':'cy')}<input type="checkbox" class="tog" data-i="lk" data-n="${i}" ${u.lk[i]?'checked':''} aria-label="Sync ${n}"></span></div>`).join('')}</div>
 <div class="grid g2"><div class="card"><div class="row sb wrap"><h3>Event webhook</h3><select class="in" style="width:auto" data-i="evs" aria-label="Event">${opts(EVENTS.map(e=>[e,e]),ev)}</select></div><pre style="background:#0F1E3D;color:#CFE3FF;border-radius:12px;padding:14px;overflow:auto;font-size:12px;margin:12px 0">${esc(JSON.stringify(pay,null,2))}</pre><button class="bt p" data-a="evSend">Send test event to ILMA</button></div>
 <div class="card"><h3>New tables</h3><div class="sm mut" style="margin:6px 0 10px">Everything else reuses ILMA tables.</div>${[['hifz_diary','talib, date, attendance, sabaq(from,to,lines,quality), sabqi, manzil, mistakes'],['hifz_para_strength','talib, para, quality, last_revised'],['hifz_exam / hifz_exam_result','ghalti, atkan, lahn, marks, examiner'],['hifz_milestone','talib, type, para, date'],['hifz_ceremony','title, date, venue, talaba[]']].map(([a,b])=>`<div style="padding:8px 0;border-top:1px solid #EEF3FB"><code>${a}</code><div class="sm mut">${b}</div></div>`).join('')}<div class="sm mut" style="margin-top:10px">REST: <code>/api/hifz/diary</code> · <code>/api/hifz/students/{id}/strength</code> · <code>/api/hifz/exams</code></div></div></div>
 <div class="card" style="margin-top:16px"><h3>Event log</h3>${u.ev.map(e=>`<div class="row sb" style="padding:7px 0;border-top:1px solid #EEF3FB"><code>${esc(e.n)}</code><span class="row">${chip('200 OK','ok')}<span class="sm mut">${esc(e.t)}</span></span></div>`).join('')||'<p class="mut sm">No events sent in this session.</p>'}</div>`};
