function qr(t){const h=[...t].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);let s=h,g='';const r=()=>(s=(s*1103515245+12345)>>>0)/4294967296;for(let y=0;y<21;y++)for(let x=0;x<21;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(r()>.5)g+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;return`<svg viewBox="-1 -1 23 23" width="78" height="78" shape-rendering="crispEdges"><g fill="#111">${f(0,0)}${f(14,0)}${f(0,14)}${g}</g></svg>`}

 rcard:()=>{const r=resData(),k=cur();const h=`<div class="rc"><h4>ILMA Education</h4><small>Report Card · ${r.T.l}</small><hr style="border:0;border-top:2px solid #4a2fc0;margin:10px 0"><table><tr><td><b>Student</b></td><td>${k.name}</td><td><b>Class</b></td><td>${k.cls}</td></tr><tr><td><b>Roll no.</b></td><td>${k.roll}</td><td><b>Session</b></td><td>2026–27</td></tr></table><table style="margin-top:12px"><thead><tr><th>Subject</th><th>Marks</th><th>Grade</th></tr></thead><tbody>${r.names.map(n=>`<tr><td>${n}</td><td>${r.T.m[n]} / ${r.T.max}</td><td>${GR(Math.round(r.T.m[n]/r.T.max*100))}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td>${r.ob} / ${r.tot} (${r.pc}%)</td><td>${GR(r.pc)}</td></tr></tbody></table><p style="margin-top:30px"><small>Class teacher: ${k.ct}</small></p></div>`;dlg('Report card · '+k.first,h,`<button class="btn" data-a="mclose">Close</button><button class="btn p" data-a="prth">🖨 Print / Save as PDF</button>`,true);S.rcH=h},prth:()=>printHtml(S.rcH,'Report card')});

function copilot(q){q=(q||'').toLowerCase();const k=cur(),s=attStats(S.kid);if(/fee|pay|voucher/.test(q))return famDue()?`PKR ${fmt(famDue())} is due by 30 October across ${unpaid().length} vouchers. You can pay them together under Fees.`:'All fees are paid. You can download receipts under Fees.';if(/leave|absent|sick/.test(q))return 'Use Apply for Leave. Sick leave over 2 school days needs a doctor’s note. You can see approvals under My requests.';if(/exam|date/.test(q))return `${k.first}’s Mid-Term starts Monday 2 November. See Academics, then Exams.`;if(/attend/.test(q))return `${k.first}’s attendance this month is ${s.pct}% (${s.p} present, ${s.a} absent, ${s.l} on leave).`;if(/home|work/.test(q))return `${k.first} has ${hwPend(S.kid)} homework item${hwPend(S.kid)===1?'':'s'} to do.`;if(/result|marks|grade/.test(q)){const r=resData();return `${k.first} scored ${r.pc}% in ${r.T.l}, grade ${GR(r.pc)}.`}return 'I can help with fees, leave, exams, homework, attendance and results. Try one of those.'}
