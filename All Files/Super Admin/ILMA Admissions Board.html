 /* saved views */

 saveview:()=>{const n=(S.m.vn||'').trim();if(!n){flash('Name the view first');return}S.saved.push({name:n,owner:S.role,shared:!!S.m.vs&&S.role==='super',f:{grades:S.grades.slice(),section:S.section,campus:S.campus,cat:S.cat,stage:S.stage,owner:S.owner,docsF:S.docsF,daysF:S.daysF,appliedF:S.appliedF,search:S.search}});S.m.vn='';S.pop=null;flash('View saved')},
 applyview:e=>{const v=S.saved[+e.dataset.i];A.clear();Object.assign(S,v.f,{grades:(v.f.grades||[]).slice()});if(S.campus!=='All'&&!allowed(S.campus))S.campus='All';S.pop=null;refilter();render()},
 delview:e=>{S.saved.splice(+e.dataset.i,1);render()},
 /* settings */
 stab:e=>{S.setTab=e.dataset.i;render()},
 cap:e=>{if(S.role!=='super')return;const p=e.dataset.i.split('|'),old=CAP[p[0]][p[1]];CAP[p[0]][p[1]]=Math.max(0,Math.round(+e.value||0));log('Settings','-',gl(p[0])+' section '+p[1]+' capacity '+old+' to '+CAP[p[0]][p[1]]);flash('Capacity saved. Seats left updated everywhere.');},
 catname:e=>{const c=CATS[+e.dataset.i];if(e.value.trim().length<2){render();return}c.name=e.value.trim();log('Settings','-','Category renamed to '+c.name);flash('Category renamed')},
 catdisc:e=>{const c=CATS[+e.dataset.i];c.disc=Math.max(0,Math.min(100,+e.value||0));log('Settings','-',c.name+' discount '+c.disc+'%');flash('Fee rule saved')},
 catdoc:e=>{const c=CATS[+e.dataset.i];c.docs=e.value.trim()?[e.value.trim()]:[];flash('Required document saved. Checklists changed for this category.')},
 caton:e=>{const c=CATS[+e.dataset.i];c.on=e.checked;log('Settings','-',c.name+(c.on?' switched on':' switched off'));flash(c.on?'Category is active':'Category switched off. Old records keep it.');render()},
 catmv:e=>{const p=e.dataset.i.split('|'),i=+p[0],j=i+ +p[1];if(j<0||j>=CATS.length)return;const t=CATS[i];CATS[i]=CATS[j];CATS[j]=t;render()},
 catdel:e=>{const c=CATS[+e.dataset.i];if(S.cards.some(x=>x.cat===c.id)){flash('A category in use cannot be deleted. Switch it off instead.');return}CATS.splice(+e.dataset.i,1);render()},
 catadd:()=>{const n=(S.m.nc||'').trim();if(n.length<2){flash('Type a category name');return}CATS.push({id:'x'+Date.now(),name:n,on:true,disc:0,docs:[],quota:{}});S.m.nc='';log('Settings','-','Category added: '+n);render()},
 quota:e=>{const c=catOf(e.dataset.i),v=Math.round(+e.value);if(v>0)c.quota[S.setGrade]=v;else delete c.quota[S.setGrade];log('Settings','-',c.name+' quota in '+gl(S.setGrade)+': '+(v>0?v:'none'));render()},
 perm:e=>{PERM.admin[e.dataset.i]=e.checked;log('Settings','-','Admin permission '+e.dataset.i+' '+(e.checked?'on':'off'));flash('Permission saved. Buttons update for Admin straight away.')},
 testlock:()=>flash('Refused (403): North is outside this Admin’s branches, even when the request is edited.')
});
/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;if(el.tagName==='INPUT'&&el.type!=='checkbox')return;const f=A[el.dataset.a];if(f)f(el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){closeM();render()}else if(S.sel&&S.page==='adm'){S.sel=null;render()}}
 if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.a){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const el=e.target,p=el.dataset&&el.dataset.s;if(!p||el.tagName==='SELECT')return;let v=el.value;setv(p,v);if(el.dataset.rr)render()});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset)return;
 if(el.dataset.a&&(el.tagName==='SELECT'||el.type==='number'||el.type==='text')){const f=A[el.dataset.a];if(f)f(el,e);return}
 if(el.dataset.s&&el.tagName==='SELECT'){setv(el.dataset.s,el.dataset.n?+el.value:el.value);if(el.dataset.s==='section'||el.dataset.s==='stage'||el.dataset.s==='cat'||el.dataset.r)refilter();if(el.dataset.r)render()}});
render();
</script>

</body></html>
