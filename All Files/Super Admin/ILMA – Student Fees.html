<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ILMA – Student Fees</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5FB;--card:#fff;--ink:#1B1D3A;--mute:#4A4F6E;--line:#E3E5F2;--line2:#D5D8EA;--head:#F8F8FC;--hover:#F8F8FD;--acc:#5B4BD6;--side:#1B1740;--seg:#E8EAF4;--good:#1F8F5F;--bad:#B02A1F;--warn:#B4701A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1024;--card:#171A3A;--ink:#ECEEFA;--mute:#9EA4C8;--line:#2A2E5A;--line2:#353A6B;--head:#1B1F44;--hover:#1D2149;--acc:#8174F2;--seg:#1F2350;--good:#37C48B;--bad:#F0776B;--warn:#E3A24A}}
:root[data-theme="dark"]{--bg:#0E1024;--card:#171A3A;--ink:#ECEEFA;--mute:#9EA4C8;--line:#2A2E5A;--line2:#353A6B;--head:#1B1F44;--hover:#1D2149;--acc:#8174F2;--seg:#1F2350;--good:#37C48B;--bad:#F0776B;--warn:#E3A24A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font-family:inherit;cursor:pointer;border:0;background:none;padding:0;color:inherit;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh}
nav{flex:0 0 232px;background:var(--side);color:#C9C6EE;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px;color:#fff;font-weight:800;font-size:18px}
.logo b{width:34px;height:34px;border-radius:10px;background:#5B4BD6;display:grid;place-items:center}
.ni{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-weight:500;width:100%}
.ni:hover{background:rgba(255,255,255,.07)}.ni.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.ng{font-size:11px;letter-spacing:.08em;font-weight:700;color:#8A8FAE;padding:14px 12px 4px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid rgba(255,255,255,.1);color:#fff;font-weight:700}
.me small{display:block;font-weight:400;color:#A9A4D8;font-size:12px}
main{flex:1;min-width:0;padding:28px;display:flex;flex-direction:column;gap:18px}
header.pg{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.crumb{font-size:13px;color:var(--mute);font-weight:500}
h1{margin:4px 0 0;font-size:28px;font-weight:800;letter-spacing:-.4px}
.sub{margin-top:4px;color:var(--mute)}
.hb{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line2);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.d{color:var(--bad)}
.today{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:color-mix(in srgb,var(--good) 14%,var(--card));color:var(--good);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(4,1fr) 1.25fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.tile{padding:16px 18px}
.tile span.l{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.tile b{display:block;font-size:24px;margin:6px 0 2px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tr{font-size:12px;font-weight:700}.tr.g{color:var(--good)}.tr.b{color:var(--bad)}.tr i{font-style:normal;color:var(--mute);font-weight:500}
.ringc{padding:14px 18px;display:flex;gap:14px;align-items:center}
.ringc b{font-size:14px;display:block}.ringc small{color:var(--mute)}
.an{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.an .card{padding:16px 18px}
.an h3{margin:0 0 12px;font-size:14px;display:flex;justify-content:space-between}
.an h3 small{font-weight:500;color:var(--mute)}
.age{display:flex;height:34px;border-radius:9px;overflow:hidden;gap:2px}
.age button{display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;min-width:0;transition:.15s}
.age button:hover,.age button.on{filter:brightness(1.15);box-shadow:inset 0 0 0 2px #fff}
.agel{display:flex;gap:10px;margin-top:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}.agel b{color:var(--ink);font-variant-numeric:tabular-nums}
.cw{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}
.cw button{display:grid;grid-template-columns:62px 1fr 36px;gap:8px;align-items:center;font-size:12px;font-weight:600;border-radius:6px;padding:2px}
.cw button.on{background:var(--seg)}
.bar{height:7px;border-radius:4px;background:var(--seg);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.warn{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#FDF3DC;border:1px solid #F0D79A;border-radius:12px;padding:12px 16px;color:#5A3A00}
.warn span{flex:1 1 240px}
.warn .btn{border-color:#E5C47A;background:#fff;color:#5A3A00}
.trow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;color:var(--mute);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,16,60,.12);font-weight:700}
.cnt{font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;background:var(--line);color:var(--mute)}
.cnt.a{background:#F4B73F;color:#4A2E00}
.fb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mn{display:flex;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:10px;height:40px}
.mn button{width:34px;height:38px;display:grid;place-items:center}.mn span{padding:0 6px;font-weight:700;min-width:118px;text-align:center}
.sr{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:0 12px;height:40px;flex:1 1 240px;max-width:420px;color:var(--mute)}
.sr input{border:0;outline:0;background:none;font:inherit;flex:1;min-width:0;color:var(--ink)}
select{height:40px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:10px;padding:0 10px;font:inherit;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line2);background:var(--card);font-weight:600;display:flex;gap:6px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bulk{display:none;flex-wrap:wrap;align-items:center;gap:10px;background:var(--side);color:#fff;border-radius:12px;padding:10px 14px}.bulk.on{display:flex}
.bulk b{flex:1 1 140px}.bulk button{padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.14);font-weight:700;font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1020px}
th{text-align:left;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px;background:var(--head);padding:14px 8px;font-weight:700}
td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;gap:12px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.who b{display:block}.who small{color:var(--mute);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;color:color-mix(in srgb,var(--c) 78%,var(--ink));background:color-mix(in srgb,var(--c) 15%,var(--card));white-space:nowrap}
.mini{font-size:11px;font-weight:700;color:var(--mute);background:var(--seg);border-radius:6px;padding:2px 7px}
.vw{font-size:11px;font-weight:700;color:var(--acc);margin-left:6px}
.pb{height:5px;border-radius:3px;background:var(--seg);margin:5px 0 2px;width:110px;margin-left:auto;overflow:hidden}.pb i{display:block;height:100%;background:var(--warn)}
.dm{color:var(--mute)}.db{color:var(--bad);font-weight:700}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}.ib:hover{background:var(--seg)}
.foot{padding:14px 18px;border-top:1px solid var(--line);color:var(--mute)}
.cards{display:none}
.rv{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
.rvc{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.proof{border-radius:10px;background:var(--head);border:1px dashed var(--line2);padding:12px;font-size:11px;color:var(--mute);line-height:1.6;display:flex;flex-direction:column;gap:4px}
.proof b{color:var(--good);font-size:13px}
.proof i{height:6px;background:var(--seg);border-radius:3px;display:block}
.rvc textarea,.fm input,.fm select{width:100%;font:inherit;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink)}
.err{color:var(--bad);font-size:12px;font-weight:600;margin-top:4px}
.ov{position:fixed;inset:0;background:rgba(20,16,60,.4);z-index:30;display:none}.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);z-index:31;display:none;flex-direction:column;box-shadow:-12px 0 40px rgba(20,16,60,.25)}.dr.on{display:flex}
.dr .hd{padding:20px 22px;display:flex;gap:14px;align-items:center}
.dr .bd{flex:1;overflow:auto;padding:4px 22px 22px;display:flex;flex-direction:column;gap:18px}
.dr h4{margin:0 0 8px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.li.t{font-weight:800;border:0;font-size:16px}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 12px}.tl li::before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.tl small{display:block;color:var(--mute)}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ag .btn{justify-content:flex-start;padding:10px 12px}
.fm{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--head);border-radius:12px;border:1px solid var(--line)}
.sib{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.wz{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;z-index:32;padding:24px;display:none}.wz.on{display:block}
.stp{display:flex;gap:6px;margin:14px 0}.stp i{flex:1;height:5px;border-radius:3px;background:var(--line)}.stp i.on{background:var(--acc)}
.pv{padding:16px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,var(--card));text-align:center;margin-top:12px}
.pv b{font-size:22px;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--side);color:#fff;border-radius:14px;padding:12px 16px;display:none;gap:14px;align-items:center;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.35);max-width:94vw}
.toast.on{display:flex}.toast button{color:#C9C2FF;font-weight:700}
.menu{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,16,60,.2);padding:6px;z-index:40;display:none;min-width:190px}.menu.on{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:8px;font-weight:500}.menu button:hover{background:var(--seg)}
.fab{display:none}
@media(max-width:1180px){.strip{grid-template-columns:repeat(2,1fr)}.ringc{grid-column:1/-1}.an,.rv{grid-template-columns:1fr}}
@media(max-width:820px){nav{display:none}main{padding:16px 16px 90px}.tw{display:none}.cards{display:flex;flex-direction:column}
.cards>div{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.fab{display:flex;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));justify-content:center;z-index:25;box-shadow:0 8px 24px rgba(91,75,214,.45)}
.toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}.hb .btn.p{display:none}.rvc{grid-template-columns:1fr}.cw{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<nav aria-label="Main">
 <div class="logo"><b>I</b>ILMA</div>
 <button class="ni" data-ic="grid">Dashboard</button>

<main>
 <header class="pg">
  <div><div class="crumb">Super Admin / Finance / Student Fees</div><h1>Student Fees</h1><div class="sub">Invoices, payments and collection across all campuses</div></div>

</main>
</div>

<script>

 case'bExp':case'export':toast(a==='export'?'Exporting invoices to Excel…':`Exporting ${F.chk.size} invoices…`);break;
 case'bPrint':toast(`Printing ${F.chk.size} vouchers…`);break;case'bClr':F.chk.clear();render();break;
 case'adm':toast('No admission fees yet. They will appear here when applicants pay.');break;
 case'wiz':W.step=1;openW();break;case'wzX':closeAll();break;
 case'wc':W.cls.has(k)?W.cls.delete(k):W.cls.add(k);openW();break;case'wp':W.plan=+k;openW();break;
 case'wn':W.step++;openW();break;case'wb':W.step--;openW();break;
 case'wg':{const n=CLS.filter(c=>W.cls.has(c[0])).reduce((x,c)=>x+c[1],0);closeAll();toast(`${n} invoices created for November. Guardians will be notified on WhatsApp.`);break}
 }});
$('q').oninput=e=>{F.q=e.target.value;render()};$('fc').onchange=e=>{F.cls=e.target.value;render()};$('fs').onchange=e=>{F.sec=e.target.value;render()};$('fp').onchange=e=>{F.camp=e.target.value;render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$('theme').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
render();
</script>
</body>
</html>
