function analytics(){const c=Object.entries(CATS).map(([k,v])=>[k,v,T.filter(t=>t.c===k).length+({fees:9,academic:12,transport:8,tech:7,facilities:5,discipline:3,staff:2,safety:1,hr:2}[k]||0)]);const mx=Math.max(...c.map(x=>x[2]));
 return `<div class="hd"><div><h1>Analytics</h1><p class="sub">See what parents and students complain about, and how fast the school responds.</p></div><select id="rng"><option>Last 30 days</option><option>This term</option><option>This year</option></select></div>
 <div class="kpis"><div class="kpi"><span>Tickets (30 days)</span><b>78</b><em style="color:var(--mut)">+12% vs last month</em></div><div class="kpi"><span>Avg first reply</span><b>3.2h</b><em style="color:var(--ok)">target 4h</em></div><div class="kpi"><span>Avg resolution</span><b>1.9d</b><em style="color:var(--ok)">target 3d</em></div><div class="kpi"><span>SLA met</span><b>91%</b><em style="color:var(--warn)">target 95%</em></div><div class="kpi"><span>Reopen rate</span><b>6%</b><em style="color:var(--ok)">healthy</em></div><div class="kpi"><span>Satisfaction</span><b>4.4 ★</b><em style="color:var(--ok)">38 ratings</em></div></div>
 <div class="g2"><div class="card"><h3>Tickets by category</h3><div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">${c.sort((a,b)=>b[2]-a[2]).map(x=>`<div><div class="row" style="justify-content:space-between;font-size:13.5px"><span>${x[1].i} ${x[1].n}</span><b>${x[2]}</b></div><div class="bar"><i style="width:${x[2]/mx*100}%"></i></div></div>`).join('')}</div></div>
 <div class="card"><h3>Volume, last 7 days</h3><div class="vol">${[['Mon',9],['Tue',14],['Wed',11],['Thu',17],['Fri',13],['Sat',4],['Sun',2]].map(d=>`<div><b style="color:var(--ink)">${d[1]}</b><i style="height:${d[1]*5}px"></i>${d[0]}</div>`).join('')}</div>
  <h3 style="margin-top:16px">By channel</h3><div class="row" style="margin-top:8px">${pill('Parent app 52%','acc')}${pill('Student app 21%','blue')}${pill('Staff app 15%','')}${pill('Web form 8%','')}${pill('Walk-in 4%','')}</div></div></div>
 <div class="g2" style="margin-top:16px"><div class="card"><h3>SLA by category</h3><table><tr><th>Category</th><th>Target</th><th>Met</th></tr>${[['fees',94],['transport',96],['academic',89],['tech',98],['facilities',78],['safety',100]].map(r=>`<tr><td>${CATS[r[0]].i} ${CATS[r[0]].n}</td><td>${CATS[r[0]].rs>=24?CATS[r[0]].rs/24+'d':CATS[r[0]].rs+'h'}</td><td>${pill(r[1]+'%',r[1]>=95?'ok':r[1]>=85?'warn':'bad')}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Repeat issues to fix at the root</h3><p class="sub">Same cause raised by several families.</p><div style="margin-top:10px">${[['Bus 12 late (Gulberg route)','5 families','transport'],['Voucher ignores sibling discount','4 families','fees'],['Homework tab empty after term change','3 students','tech'],['Block C washrooms','3 students','facilities']].map(r=>`<div class="trow"><div><b>${r[0]}</b><small>${r[1]}</small></div>${pill(CATS[r[2]].n)}<button class="btn sm" data-a="toast" data-i="Filtered inbox opens here">View</button></div>`).join('')}</div></div></div>`}
function routing(){return `<div class="hd"><div><h1>Routing & SLA</h1><p class="sub">Decide who receives each kind of complaint and how fast they must respond.</p></div><button class="btn p" data-a="savecfg" data-i="Routing saved">Save changes</button></div>
 <div class="card" style="overflow:auto"><table><tr><th>Category</th><th>Default owner</th><th>First reply (h)</th><th>Resolve (h)</th><th>Escalate to</th><th>Confidential</th></tr>${Object.entries(CATS).map(([k,v])=>`<tr><td><b>${v.i} ${v.n}</b><div style="color:var(--mut);font-size:12.5px">${v.d}</div></td><td><select data-a="cfgown" data-i="${k}">${TEAM.map(x=>`<option value="${x}" ${v.own===x?'selected':''}>${P[x].n}</option>`).join('')}</select></td><td><input class="in" type="number" min="1" value="${v.fr}" style="width:80px" data-a="cfgfr" data-i="${k}"></td><td><input class="in" type="number" min="1" value="${v.rs}" style="width:90px" data-a="cfgrs" data-i="${k}"></td><td><select><option>Principal</option><option>Vice Principal</option></select></td><td><label class="sw"><input type="checkbox" ${v.conf?'checked':''} data-a="cfgconf" data-i="${k}"><i></i></label></td></tr>`).join('')}</table></div>
 <div class="g2" style="margin-top:16px"><div class="card"><h3>Automation</h3>${[['Auto-escalate when SLA is missed','Notify the Principal and bump priority',1],['Auto-close resolved tickets after 3 days','Requester can still reopen for 7 days',1],['Send daily digest of overdue tickets','Emailed at 8:00 am to the owners',1],['Allow anonymous complaints from students','Identity visible only to the Principal, logged',1],['Allow walk-in tickets logged by staff','Front desk can log on behalf',1]].map(r=>`<div class="trow"><div><b>${r[0]}</b><small>${r[1]}</small></div><label class="sw"><input type="checkbox" ${r[2]?'checked':''} data-a="swt" data-i="${r[0]}"><i></i></label></div>`).join('')}</div>
 <div class="card"><h3>Working hours for SLA</h3><p class="sub">The SLA clock only runs during these hours.</p><div class="row" style="margin:12px 0"><select><option>Mon – Fri</option><option>Mon – Sat</option></select><select><option>8:00 am</option></select><span>to</span><select><option>3:00 pm</option></select></div>${pill('Safety tickets ignore working hours, 24×7','bad')}<div class="info" style="margin-top:14px">Waiting on requester pauses the SLA clock automatically.</div></div></div>`}
function canned(){return `<div class="hd"><div><h1>Canned replies</h1><p class="sub">Ready-made answers that save time. Staff insert them from any ticket.</p></div><button class="btn p" data-a="newcan">➕ New reply</button></div><div class="card">${CANNED.map((c,i)=>`<div class="trow"><div><b>${esc(c[0])}</b><small>${esc(c[1])}</small></div><button class="btn sm" data-a="editcan" data-i="${i}">Edit</button><button class="btn sm bad" data-a="delcan" data-i="${i}">Delete</button></div>`).join('')}</div>`}
function help(){const k=FOR[S.role];return `<div class="hd"><div><h1>Before you raise a complaint</h1><p class="sub">Many questions have a quick answer. If not, we are here.</p></div><button class="btn p" data-a="raise">➕ Raise a complaint</button></div>
 <div class="g2"><div class="card"><h3>Quick answers</h3>${k.flatMap(c=>(FAQ[c]||[]).map(q=>`<div class="trow"><div><b>${q}</b><small>${CATS[c].n}</small></div><button class="btn sm" data-a="toast" data-i="Opens the answer article">Read</button></div>`)).join('')}</div>
 <div class="card"><h3>What happens next</h3><div class="steps" style="margin:16px 0 26px">${['You submit','We route it','We reply','It is resolved'].map(x=>`<div class="d">${x}</div>`).join('')}</div><div class="trow"><div><b>Replies within hours, not days</b><small>Most categories get a first reply within 4 to 8 hours on school days.</small></div></div><div class="trow"><div><b>Your privacy matters</b><small>${S.role==='student'?'You can raise a complaint anonymously. Only the Principal can see who you are, and it is logged.':'Sensitive complaints are visible only to the Principal and the people named on the ticket.'}</small></div></div><div class="trow"><div><b>Emergency?</b><small>Call the school office directly: 042-111-ILMA-00.</small></div></div></div></div>`}
function raiseView(){return `<div class="hd"><div><h1>${staff()?'Log a complaint on behalf':'Raise a complaint'}</h1><p class="sub">Four short steps.</p></div></div><div class="card empty"><button class="btn p" data-a="raise">Start</button></div>`}
function render(){side();$('#bn').textContent=NOTIF[S.role].length;const m=$('#main');
 const v=S.view;
 m.innerHTML=v==='inbox'?listView('Help Desk inbox','Every complaint from parents, students and staff, in one place.'):v==='mine'?listView('Assigned to me','Tickets you are responsible for.'):v==='my'?listView(S.role==='teacher'?'My requests':'My complaints','Track every complaint you have raised.'):v==='analytics'?analytics():v==='routing'?routing():v==='canned'?canned():v==='help'?help():v==='raise'?raiseView():'';}
/* ---------- dialogs ---------- */
function modal(t,b,f){const d=$('#dlg');d.innerHTML=`<div class="dh"><h3>${t}</h3><button data-a="close" aria-label="Close">✕</button></div><div class="db">${b}</div><div class="df">${f||''}</div>`;if(!d.open)d.showModal()}
const close=()=>$('#dlg').open&&$('#dlg').close();
let W=null;
function wiz(){const st=W.step,cats=FOR[S.role];const d=['Category','Details','Privacy & files','Review'];
 let b=`<div class="wz">${d.map((x,i)=>`<i class="${i<=st?'d':''}"></i>`).join('')}</div>`,f='';
 if(st===0){b+=`<p class="sub" style="margin-bottom:10px">What is your complaint about?</p><div class="tiles">${cats.map(k=>`<button class="tile ${W.c===k?'on':''}" data-a="wcat" data-i="${k}"><b>${CATS[k].i} ${CATS[k].n}</b><small>${CATS[k].d}</small></button>`).join('')}</div>`;f=`<button class="btn" data-a="close">Cancel</button><button class="btn p" data-a="wn" ${W.c?'':'disabled'}>Next</button>`}
 if(st===1){const c=CATS[W.c],fq=FAQ[W.c]||[];b+=`<div class="info">${c.i} <b>${c.n}</b> goes to <b>${esc(P[c.own].n)}</b>. First reply within <b>${c.fr} hours</b>.</div>
  ${staff()?`<div class="fld">Requester<select id="wr"><option value="saima">Mrs. Saima Noor · parent (walk-in)</option><option value="kamran">Mr. Kamran Ali · parent</option><option value="tariq">Mr. Tariq Mehmood · parent</option><option value="hina">Ms. Hina Raza · teacher</option></select></div>`:''}
  ${S.role==='parent'?`<div class="fld">Which child?<select id="wk"><option>Zain Kamran · 7-B</option><option>Areeba Kamran · 4-A</option></select></div>`:''}
  <div class="fld">Subject<input class="in" id="ws" value="${esc(W.s)}" placeholder="One line that sums it up"></div>
  <div class="fld">What happened?<textarea class="in" id="wd" placeholder="Give dates, names and anything that helps us understand.">${esc(W.d)}</textarea></div>
  <div class="fld">How urgent is it?<select id="wp"><option value="normal">Normal</option><option value="high" ${W.p==='high'?'selected':''}>Urgent, needs attention soon</option></select></div>
  ${fq.length?`<div class="box"><h4>Maybe this helps</h4>${fq.map(q=>`<div style="padding:4px 0">📄 ${q}</div>`).join('')}</div>`:''}`;f=`<button class="btn" data-a="wb">Back</button><button class="btn p" data-a="wn">Next</button>`}
 if(st===2){const forced=CATS[W.c].conf;b+=`<div class="trow"><div><b>Keep this confidential</b><small>${forced?'This category is always confidential.':'Only the Principal and the person handling it can see this ticket.'}</small></div><label class="sw"><input type="checkbox" id="wc" ${forced||W.conf?'checked':''} ${forced?'disabled':''}><i></i></label></div>
  ${S.role==='student'||S.role==='parent'?`<div class="trow"><div><b>Hide my name from staff</b><small>Only the Principal can reveal your identity, and every reveal is logged. We cannot reply by phone if you hide your name.</small></div><label class="sw"><input type="checkbox" id="wa" ${W.anon?'checked':''}><i></i></label></div>`:''}
  <h4 style="margin:16px 0 8px;color:var(--mut);font-size:12px;letter-spacing:.06em">ATTACHMENTS</h4><div class="row">${W.files.map(x=>`<span class="file">📎 ${x}</span>`).join('')}<button class="btn sm" data-a="wfile">➕ Add photo or file</button></div>`;f=`<button class="btn" data-a="wb">Back</button><button class="btn p" data-a="wn">Review</button>`}
 if(st===3){const c=CATS[W.c];b+=`<div class="card" style="background:var(--hov)"><div class="ch" style="margin:0 0 6px">${c.i} <b>${c.n}</b>${W.p==='high'?pill('Urgent','warn'):''}${W.conf||c.conf?pill('🔒 Confidential','bad'):''}${W.anon?pill('Anonymous','acc'):''}</div><h3>${esc(W.s)||'(No subject)'}</h3><p style="white-space:pre-wrap">${esc(W.d)||'(No details)'}</p>${W.files.length?`<div class="row">${W.files.map(x=>`<span class="file">📎 ${x}</span>`).join('')}</div>`:''}</div><div class="info">Goes to <b>${esc(P[c.own].n)}</b> · first reply within <b>${c.fr}h</b>.</div>`;f=`<button class="btn" data-a="wb">Back</button><button class="btn p" data-a="wsub">Submit complaint</button>`}
 modal(staff()?'Log a complaint on behalf':'New complaint',b,f)}
/* ---------- actions ---------- */
function sysLog(t,x,pub){t.th.push({k:'sys',t:0,x,pub:pub?1:0})}
function msg(t,k,x){t.th.push({k:k,by:me(),t:0,x})}
const A={
 nav:a=>{S.view=a.dataset.i;S.sel=null;S.f='all';S.cat='';S.q='';S.det=0;if(S.view==='raise'){S.view=staff()?'inbox':'my';render();A.raise();return}render()},
 toast:a=>toast(a.dataset.i),close,
 f:a=>{S.f=a.dataset.i;render()},
 sel:a=>{S.sel=a.dataset.i;S.det=1;S.tab='reply';const t=byId(S.sel);if(staff()&&t)t.un=0;render()},
 unsel:()=>{S.det=0;S.sel=null;render()},
 ctab:a=>{S.tab=a.dataset.i;const v=$('#ctext')?.value;render();if(v)$('#ctext').value=v},
 setst:a=>{const t=byId(a.dataset.i);t.st=a.value;sysLog(t,'Status changed to '+ST[a.value][0]+' by '+P[me()].n,1);if(a.value==='waiting')t.due=null;toast('Status: '+ST[a.value][0]);render()},
 setpri:a=>{const t=byId(a.dataset.i);t.p=a.value;sysLog(t,'Priority set to '+PRI[a.value][0],0);toast('Priority updated');render()},
 setas:a=>{const t=byId(a.dataset.i);t.as=a.value||null;if(t.as&&t.st==='new')t.st='assigned';sysLog(t,t.as?'Assigned to '+P[t.as].n:'Unassigned',t.as?1:0);toast(t.as?'Assigned to '+P[t.as].n:'Unassigned');render()},
 setcat:a=>{const t=byId(a.dataset.i);t.c=a.value;t.as=CATS[a.value].own;if(CATS[a.value].conf)t.conf=1;sysLog(t,'Category changed to '+CATS[a.value].n+' · re-routed to '+P[t.as].n,1);toast('Re-routed to '+P[t.as].n);render()},
 escalate:a=>{const t=byId(a.dataset.i);t.as='ayesha';t.p='high';sysLog(t,'Escalated to the Principal by '+P[me()].n,0);toast('Escalated to the Principal');render()},
 reveal:a=>{const t=byId(a.dataset.i);t.rev=1;sysLog(t,'Identity revealed by '+P[me()].n+' (logged)',0);toast('Identity revealed and logged');render()},
 resolve:a=>{const t=byId(a.dataset.i);t.st='resolved';t.due=null;sysLog(t,'Marked Resolved by '+P[me()].n,1);toast('✓ Resolved. The requester was asked to confirm.');render()},
 closeT:a=>{const t=byId(a.dataset.i);t.st='closed';sysLog(t,'Closed by '+P[me()].n,1);toast('Ticket closed');render()},
 reopen:a=>{const t=byId(a.dataset.i);t.st='reopened';t.due=CATS[t.c].fr;sysLog(t,'Reopened by '+P[me()].n,1);toast('Ticket reopened');render()},
 solved:a=>{const t=byId(a.dataset.i);t.st='resolved';t.due=null;sysLog(t,'Requester confirmed it is solved',1);toast('Glad it is solved!');render()},
 rate:a=>{const t=byId(a.dataset.i);t.rate=+a.dataset.n;toast('Thanks for rating');render()},
 send:a=>{const t=byId(a.dataset.i),v=$('#ctext').value.trim();if(!v){toast('Write something first');return}
  const k=a.dataset.k;if(k==='note'){msg(t,'note',v);toast('Internal note saved')}else{msg(t,'msg',v);toast('Reply sent');
   if(staff()||S.role==='teacher'){if(k==='waiting'){t.st='waiting';sysLog(t,'Status changed to Waiting on requester',1)}else if(t.st==='new'||t.st==='assigned'){t.st='progress'}}else if(t.st==='waiting'){t.st='progress';t.due=CATS[t.c].fr}}
  render()},
 attach:()=>toast('📎 Attachment added (demo)'),
 msgreq:a=>{S.tab='reply';render();$('#ctext')?.focus()},
 mkappr:a=>{const t=byId(a.dataset.i);modal('Create approval request',`<p class="sub" style="margin-bottom:12px">Turn this complaint into a decision for the Principal. It appears in Approval Requests and stays linked to this ticket.</p><div class="fld">Type<select id="at"><option>Fee concession</option><option>Fee waiver</option><option>Late fine waiver</option><option>Transfer / route change</option><option>Other</option></select></div><div class="fld">Amount (optional)<input class="in" id="aa" placeholder="Rs"></div><div class="fld">Note for the approver<textarea class="in" id="an">${esc(t.s)}</textarea></div>`,`<button class="btn" data-a="close">Cancel</button><button class="btn p" data-a="doappr" data-i="${t.id}">Send for approval</button>`)},
 doappr:a=>{const t=byId(a.dataset.i),ty=$('#at').value;const no='AR-'+(319+Math.floor(Math.random()*40));t.link=no+' · '+ty+' · Pending Principal';sysLog(t,'Approval request '+no+' created: '+ty,1);close();toast('✅ Sent to Approval Requests as '+no);render()},
 newcan:()=>A.editcan({dataset:{i:-1}}),
 editcan:a=>{const i=+a.dataset.i,c=CANNED[i]||['',''];modal(i<0?'New canned reply':'Edit canned reply',`<div class="fld">Title<input class="in" id="ct" value="${esc(c[0])}"></div><div class="fld">Message<textarea class="in" id="cm">${esc(c[1])}</textarea></div><p class="sub">Use {sla} to insert the response time.</p>`,`<button class="btn" data-a="close">Cancel</button><button class="btn p" data-a="savecan" data-i="${i}">Save</button>`)},
 savecan:a=>{const i=+a.dataset.i,v=[$('#ct').value.trim(),$('#cm').value.trim()];if(!v[0]||!v[1]){toast('Add a title and message');return}if(i<0)CANNED.push(v);else CANNED[i]=v;close();toast('Saved');render()},
 delcan:a=>{CANNED.splice(+a.dataset.i,1);toast('Deleted');render()},
 savecfg:a=>toast('✓ '+a.dataset.i),swt:a=>toast((a.checked?'On: ':'Off: ')+a.dataset.i),
 cfgown:a=>{CATS[a.dataset.i].own=a.value;toast('Owner updated')},cfgfr:a=>{CATS[a.dataset.i].fr=+a.value},cfgrs:a=>{CATS[a.dataset.i].rs=+a.value},cfgconf:a=>{CATS[a.dataset.i].conf=a.checked?1:0;toast('Confidential rule updated')},
 raise:()=>{W={step:0,c:'',s:'',d:'',p:'normal',conf:0,anon:0,files:[]};wiz()},
 wcat:a=>{W.c=a.dataset.i;wiz()},wfile:()=>{W.files.push(['photo.jpg','letter.pdf','receipt.png'][W.files.length%3]);wiz()},
 wn:()=>{if(W.step===1){W.s=$('#ws').value;W.d=$('#wd').value;W.p=$('#wp').value;if($('#wr'))W.onb=$('#wr').value;if(!W.s.trim()){toast('Please add a subject');return}}
  if(W.step===2){W.conf=$('#wc').checked?1:0;const x=$('#wa');W.anon=x?x.checked?1:0:0}W.step++;wiz()},
 wb:()=>{if(W.step===1){W.s=$('#ws').value;W.d=$('#wd').value}W.step--;wiz()},
 wsub:()=>{const c=CATS[W.c];const id='HD-'+(++N);const by=staff()?(W.onb||'saima'):me();
  const t={id,s:W.s,c:W.c,p:W.p,st:'assigned',by,kid:S.role==='parent'?'Zain Kamran · 7-B':S.role==='student'?'7-B':'—',as:c.own,ch:staff()?'Walk-in':S.role==='parent'?'Parent app':S.role==='student'?'Student app':'Staff app',age:0,due:c.fr,un:1,conf:(W.conf||c.conf)?1:0,anon:W.anon,th:[{k:'msg',by,t:0,x:W.d||W.s},{k:'sys',t:0,x:'Auto-routed to '+c.n+' · assigned to '+P[c.own].n,pub:1}],link:null};
  T.unshift(t);S.sel=id;S.det=1;if(!staff())S.view='my';else S.view='inbox';
  modal('Complaint submitted ✓',`<div style="text-align:center;padding:10px 0"><div style="font-size:44px">✅</div><h2>${id}</h2><p>${esc(P[c.own].n)} will reply within <b>${c.fr} hours</b>.</p>${t.conf?'<div class="lock" style="text-align:left">🔒 This complaint is confidential.</div>':''}<p class="sub">You will get a notification when someone replies.</p></div>`,`<button class="btn p" data-a="close">View my complaint</button>`);render()}
};
/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;const f=A[el.dataset.a];if(f)f(el)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='canned'){const c=CANNED[+el.value];if(c){$('#ctext').value=c[1].replace('{sla}',CATS[byId(S.sel).c].fr+' hours')}return}
 if(el.id==='catf'){S.cat=el.value;render();return}if(el.dataset.a&&A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
$('#role').onchange=e=>{S.role=e.target.value;S.view=NAV[S.role][0][0];S.sel=null;S.f='all';S.cat='';S.q='';S.det=0;$('#pop').hidden=true;render()};
$('#theme').onclick=()=>{const d=document.documentElement;const dk=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';d.dataset.theme=dk?'light':'dark'};
$('#bell').onclick=()=>{const p=$('#pop');p.hidden=!p.hidden;p.innerHTML=`<h4>Notifications</h4>`+NOTIF[S.role].map(n=>`<button class="ni" data-a="gon" data-i="${n[0]}"><b>${esc(n[1])}</b><small>${n[0]} · ${n[2]}</small></button>`).join('')};
A.gon=a=>{$('#pop').hidden=true;S.view=staff()?'inbox':'my';S.sel=a.dataset.i;S.det=1;S.f='all';render()};
S.view=NAV[S.role][0][0];render();
</script>
</body></html>
