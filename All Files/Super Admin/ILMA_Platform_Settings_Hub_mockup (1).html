<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ILMA Super Admin — Platform and Settings hub</title>
<style>
:root{--bg:#f4f5fa;--panel:#fff;--text:#171a2b;--sub:#646b86;--line:#e3e5f0;--accent:#7c3aed;--soft:#f0ebff;--ok:#12805c;--okb:#e3f6ee;--warn:#a15c07;--warnb:#fdf1dc;--todo:#4b5cc4;--todob:#e8ebfb;--bad:#c0262d;--badb:#fde8ea;--inp:#fff;--side:#181c27;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1019;--panel:#161a29;--text:#eef0fa;--sub:#98a0bd;--line:#262c42;--accent:#a78bfa;--soft:#221d3a;--ok:#5fd3a6;--okb:#12362b;--warn:#f1c05a;--warnb:#3b2d10;--todo:#9fb0ff;--todob:#1f2547;--bad:#ff8a93;--badb:#3d1a1f;--inp:#10131f;--side:#10131d}}
:root[data-theme="dark"]{--bg:#0e1019;--panel:#161a29;--text:#eef0fa;--sub:#98a0bd;--line:#262c42;--accent:#a78bfa;--soft:#221d3a;--ok:#5fd3a6;--okb:#12362b;--warn:#f1c05a;--warnb:#3b2d10;--todo:#9fb0ff;--todob:#1f2547;--bad:#ff8a93;--badb:#3d1a1f;--inp:#10131f;--side:#10131d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
.side{width:270px;background:var(--side);color:#c9d1e3;padding:18px 14px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:15px;color:#fff;padding:2px 8px 16px}.brand small{display:block;font-weight:500;font-size:11px;color:#7f8aa6;margin-top:2px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:8px;color:#7f8aa6;font-size:11px;letter-spacing:.09em;font-weight:700;cursor:pointer;user-select:none}
.sec .chev{transition:transform .2s}.sec.closed .chev{transform:rotate(180deg)}.glist.closed{display:none}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;color:#dfe5f3;font-weight:600;font-size:13.5px;margin:2px 0}
.nav:hover{background:#212737}.nav.on{background:#2b3142;box-shadow:inset 3px 0 0 #8b5cf6;color:#fff}
.nav .ic{width:20px;height:20px;border:1.5px solid #8893b0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#c3cbe0;flex-shrink:0}
.nav .lb{flex:1}.nav .ct{font-size:10.5px;background:#2c3346;color:#aab3cc;border-radius:999px;padding:2px 8px;font-weight:700}
.more{margin-top:8px;border-top:1px solid #262c3d;padding-top:8px}
.sfoot{margin-top:auto;padding-top:14px}.sfoot button{width:100%;background:#212737;color:#c9d1e3;border:0;border-radius:10px;padding:9px;cursor:pointer;font-weight:600;font-size:12.5px}
main{flex:1;padding:26px 32px;max-width:1120px;min-width:0}
.navrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}.navrow .crumb{flex:1;min-width:0}.navrow .btn{padding:6px 12px;font-size:12.5px;white-space:nowrap}
.crumb{color:var(--sub);font-size:12.5px;margin-bottom:8px}.crumb a{color:var(--accent);cursor:pointer;font-weight:600}
h1{margin:0 0 4px;font-size:25px}.lede{color:var(--sub);margin:0 0 18px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.search{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.search input{border:0;outline:0;background:transparent;color:var(--text);font-size:14px;width:100%;font-family:inherit}
.search kbd{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--sub)}
.roles{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.roles b{font-size:12px;color:var(--sub);margin-right:2px}
.rbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 13px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
.rbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.attn{background:var(--warnb);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.attn b{color:var(--warn);font-size:12.5px;margin-right:4px}.attn button{border:0;background:var(--panel);color:var(--text);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--line)}
.gtitle{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}.gtitle h2{margin:0;font-size:15px}.gtitle span{color:var(--sub);font-size:12px}
.pin{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--soft);padding:2px 8px;border-radius:999px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:128px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}.tile .top{display:flex;align-items:center;justify-content:space-between}
.ti{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px}
.acc{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.tile h3{margin:0;font-size:14px}.tile p{margin:0;color:var(--sub);font-size:12.5px;line-height:1.45;flex:1}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;align-self:flex-start}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-todo{background:var(--todob);color:var(--todo)}
.empty{padding:40px;text-align:center;color:var(--sub);background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 14px;cursor:pointer;color:var(--sub);font-weight:600;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}.tab.on{color:var(--accent);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.phead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:6px}
.phead h2{margin:0 0 4px;font-size:19px}.phead .d{color:var(--sub);line-height:1.5;max-width:640px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}.chip b{color:var(--text)}
.ro-banner{background:var(--todob);color:var(--todo);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;margin:12px 0}
.body{margin-top:14px;display:flex;flex-direction:column;gap:16px}
.sec2{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg)}
.sec2 .sh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.sec2 h3{margin:0 0 3px;font-size:14.5px}.sec2 .sh p{margin:0;color:var(--sub);font-size:12.5px;max-width:560px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi small{color:var(--sub);font-size:11.5px;display:block}.kpi b{font-size:21px;display:block;margin:2px 0}.kpi span{font-size:11.5px;color:var(--sub)}
.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}.kpi.bad b{color:var(--bad)}
.bar{margin:9px 0}.bar .bt{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}.bar .bt span{color:var(--sub)}
.track{height:9px;background:var(--line);border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--ok);border-radius:999px;transition:width .4s}.fill.warn{background:#e0a020}.fill.bad{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.dan{color:var(--bad)}.btn.dan.solid{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--sub);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.warn{background:var(--warnb);color:var(--warn)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.todo{background:var(--todob);color:var(--todo)}.pill.acc{background:var(--soft);color:var(--accent)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tr.hl td{background:var(--badb)}td .btn{margin-right:4px}
.field{display:flex;flex-direction:column;gap:5px;margin:0}.field>label{font-size:12px;font-weight:700;color:var(--sub)}.field .h{font-size:11.5px;color:var(--sub)}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{background:var(--inp);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}textarea{min-height:90px;resize:vertical}
input[type=color]{width:46px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--inp)}input[type=range]{width:100%;accent-color:var(--accent)}
.trow{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.trow:last-child{border-bottom:0}.trow b{font-size:13.5px;display:block}.trow span.d{font-size:12px;color:var(--sub)}
.sw{position:relative;width:40px;height:22px;flex-shrink:0;display:inline-block}.sw input{opacity:0;width:0;height:0;position:absolute}.sw i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;cursor:pointer}.sw i:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:var(--accent)}.sw input:checked+i:before{transform:translateX(18px)}.sw input:disabled+i{opacity:.5;cursor:not-allowed}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.split.l{grid-template-columns:230px minmax(0,1fr)}
@media(max-width:900px){.split,.split.l{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px}.li{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}.li.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.cardx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}.cardx h4{margin:0;font-size:14px}.cardx p{margin:0;color:var(--sub);font-size:12.5px;line-height:1.45}.cardx .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cardx.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.pv{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:14px}.pvh{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--sub);background:var(--panel)}
.dayc{display:flex;gap:6px;flex-wrap:wrap}.dayc label{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--panel)}.dayc input{display:none}.dayc input:checked+span{color:var(--accent)}.dayc label:has(input:checked){background:var(--soft);border-color:var(--accent);color:var(--accent)}
.savebar{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
.chatbox{border:1px solid var(--line);border-radius:10px;height:230px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}.msg{max-width:80%;padding:7px 10px;border-radius:12px;font-size:13px}.msg.me{align-self:flex-end;background:var(--accent);color:#fff}.msg.bot{background:var(--panel);border:1px solid var(--line)}
.phone{width:210px;border:6px solid #222;border-radius:28px;background:#fff;color:#111;overflow:hidden;margin:auto}.phone .ph{padding:14px;color:#fff;font-weight:700}.phone .pb{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px}.phone .pb div{background:#f3f4f8;border-radius:10px;padding:12px 6px;text-align:center}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(10,12,25,.55)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);margin:0}.mh h3{margin:0;font-size:16px}.mh .x{border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:16px}
.mb{padding:18px 20px;display:flex;flex-direction:column;gap:12px;max-height:68vh;overflow:auto}.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99;align-items:center}#toast div{background:#1e2233;color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);border-left:4px solid #6ee7b7;animation:tin .25s}#toast div.warn{border-color:#f1c05a}#toast div.bad{border-color:#ff8a93}@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@media(max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static}main{padding:18px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">ILMA CMS<small>Super Admin Portal</small></div>
    <div class="sec" id="secHead"><span>PLATFORM</span><span class="chev">&#9650;</span></div>
    <div class="glist" id="glist"></div>
    <div class="sfoot"><button id="themeBtn">Toggle light / dark</button></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
const NAV = [
 {g:"Subscription & Billing", i:"▭", pin:1, items:[
  ["Plan & usage","Current plan and live usage: admins, teachers, students, branches, storage and AI credits against your limits.",1,0],
  ["Invoices & payments","ILMA invoices, receipts and payment history with PDF download.",0,1],
  ["Payment methods","Card or bank details used for renewals, with renewal reminders.",0,0],
  ["Billing details & tax","Legal name, address, tax ID and billing contacts.",0,1],
  ["Add-ons & upgrades","Request more seats, branches, storage, AI credits or modules and see the price impact first.",0,0]]},
 {g:"Configuration", i:"⚙︎", pin:1, items:[
  ["General settings","Institute profile, time zone, currency, language, date and number formats.",1,0],
  ["Academic setup","Academic years, terms, grading scales, working days (Mon–Sat) and holidays.",2,0],
  ["Numbering & formats","Patterns for admission, roll, invoice and receipt numbers.",0,1],
  ["Custom fields & forms","Extra fields on student, staff and admission forms.",2,0],
  ["Approvals & policies","Who can delete, which actions need approval (such as undo), edit-lock after publishing.",0,0],
  ["Modules & features","Switch modules on or off and opt in to beta features.",0,0]]},
 {g:"Access & Security", i:"◈", pin:1, items:[
  ["Roles & permissions","Super Admin, Admin, Finance Manager, Teacher, Parent, Student and custom roles; module visibility.",0,0],
  ["Admin accounts","Invite, suspend or remove admins and finance managers.",0,0],
  ["Sign-in & MFA policy","Password rules, two-step verification and session timeout.",0,0],
  ["Sessions & devices","Active sessions, trusted devices and sign out everywhere.",1,0],
  ["Login logs","Who signed in, when and from where, including failed attempts.",0,0],
  ["Audit log","Every change with who, when and before/after values; searchable and exportable.",1,0]]},
 {g:"Data & Backup", i:"▤", pin:1, items:[
  ["Import centre","Bulk import students, staff, fees, results and timetables from Excel, with an error preview before saving.",2,0],
  ["Exports & downloads","Download reports and records as Excel, CSV or PDF.",2,1],
  ["Backups & restore","Daily backups, Backup now and guarded restore.",0,0],
  ["Recycle bin & restore requests","Deleted records are kept for 30 days. Admins request a restore; the Super Admin approves.",1,0],
  ["Data retention & privacy","Archive rules, retention periods and student data requests.",0,0]]},
 {g:"Branding & Website", i:"◐", items:[
  ["Logo & colours","Logo, colours and favicon used across the app.",0,0],
  ["Login page","Message, background and announcements shown on the sign-in screen.",0,0],
  ["Domain & subdomain","yourschool.ilma.app or your own domain, with verification status.",0,0],
  ["Public website","Admission page, notices and events shown on your public site.",2,0],
  ["Email & receipt branding","Headers and footers on emails, report cards, fee receipts and ID cards.",0,0],
  ["Mobile app branding","Your name and logo inside the parent and student app.",0,0]]},
 {g:"Communication setup", i:"✉︎", items:[
  ["Channels","WhatsApp Business, SMS gateway, email sender and push notifications.",0,0],
  ["Message templates","Fee reminders, absence alerts and notices in Urdu and English.",2,0],
  ["Notification rules","When to alert (for example 3 consecutive absences): free push first, WhatsApp for escalations.",1,0],
  ["Quiet hours & limits","No sends at night and daily caps per channel to control cost.",0,0]]},
 {g:"Integrations", i:"⇄", items:[
  ["Payment gateways","1BILL, Raast, bank transfer and card gateways for fee collection.",0,2],
  ["Attendance devices","Biometric, QR and RFID readers.",2,0],
  ["Google Calendar & Workspace","Sync the academic calendar and timetables to Google Calendar.",1,0],
  ["Accounting export","Export to accounting software or Excel.",0,1],
  ["API keys & webhooks","Keys, scopes and webhooks for your own systems.",0,0],
  ["Connected apps","Review and remove apps connected to your institute.",0,0]]},
 {g:"ILMA AI control", i:"✦", items:[
  ["AI Copilot access","Which roles can use the Copilot and which data it may read.",0,0],
  ["AI credits & usage","Credits used by the Copilot, paper generator and reports, with caps per role or branch.",1,0],
  ["Paper generator defaults","Default paper format, marking scheme and language.",2,0],
  ["AI review rules","AI drafts must be reviewed by a person before they reach parents.",0,0]]},
 {g:"Help & support", i:"?", items:[
  ["What's new","Release notes and announcements from ILMA.",1,1],
  ["Help & training","Video tutorials, guides and staff training sessions.",1,1],
  ["Contact support","Raise a ticket or chat with the ILMA team.",2,2],
  ["Support access","Give ILMA support time-limited access to your account; every session is visible to you.",0,0],
  ["Feature requests","Suggest and vote on improvements.",1,0]]}
];
const ROLES={s:"Super Admin",a:"Admin",f:"Finance Manager"};
const ACC=["Hidden","View only","Full access"];
let role="s",view={hub:true,g:0,ix:0,from:"hub"},query="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lvl=it=>role==="s"?2:(role==="a"?it[2]:it[3]);
const vis=g=>g.items.map((it,ix)=>({it,ix})).filter(o=>lvl(o.it)>0);
const pinned=()=>NAV.map((g,gi)=>({g,gi})).filter(o=>o.g.pin&&vis(o.g).length);
const ACT={},LIVE={},PAGES={};
const num=n=>Number(n).toLocaleString("en-PK");
const val=(id,root=document)=>{const e=root.querySelector("#"+id);return e?(e.type==="checkbox"?e.checked:e.value):""};
/* ---------- UI helpers ---------- */
const pill=(t,k="")=>`<span class="pill ${k}">${t}</span>`;
const btn=(t,a,k="",i="",j="")=>`<button class="btn ${k}" data-a="${a}" data-i="${esc(i)}" data-j="${esc(j)}"${k.includes("safe")?" data-safe":""}>${t}</button>`;

function go(gi,ix,from){HIST.push({...view});if(HIST.length>30)HIST.shift();view={hub:false,g:gi,ix,from};render();window.scrollTo(0,0)}
function openHub(){if(!view.hub)HIST.push({...view});view={hub:true,g:0,ix:0,from:"hub"};render();window.scrollTo(0,0)}
function goBack(){let p=HIST.pop();while(p&&!p.hub&&(firstIx(p.g)<0||lvl(NAV[p.g].items[p.ix])===0))p=HIST.pop();view=p||{hub:true,g:0,ix:0,from:"hub"};render();window.scrollTo(0,0)}

D.news=[{t:"Approval Requests module",tag:"New",d:"12 Oct 2026",b:"One inbox for leave, CR nominations, results and more with routing rules.",un:1},{t:"Urdu translation in Messages",tag:"New",d:"02 Oct 2026",b:"Translate any chat message to Urdu in one tap.",un:1},{t:"Faster report cards",tag:"Improved",d:"20 Sep 2026",b:"Generating 1,000 report cards now takes under a minute.",un:0},{t:"Fee voucher fix",tag:"Fix",d:"05 Sep 2026",b:"Late fee no longer double-counts on part payments.",un:0}];D.nwF="All";
PAGES["What's new"]=()=>`${sec("Release notes","",`<div class="btnrow" style="margin-bottom:10px">${["All","New","Improved","Fix"].map(x=>`<button class="rbtn ${D.nwF===x?"on":""}" data-a="nwf" data-safe data-i="${x}">${x}</button>`).join("")}${btn("Mark all read","nwread","safe")}</div><div class="list">${D.news.filter(n=>D.nwF==="All"||n.tag===D.nwF).map(n=>`<div class="cardx"><div class="row"><h4>${n.t} ${n.un?pill("Unread","acc"):""}</h4>${pill(n.tag,n.tag==="Fix"?"warn":"ok")}</div><p>${n.b}</p><span class="h">${n.d}</span></div>`).join("")}</div>`)}`;
ACT.nwf=a=>{D.nwF=a.dataset.i;rerender()};ACT.nwread=()=>{D.news.forEach(n=>n.un=0);rerender()};
D.hl=[["Video","Set up your first academic year","6 min"],["Guide","Importing students from Excel","Guide"],["Video","Taking attendance with QR","4 min"],["Guide","Fee vouchers and concessions","Guide"],["Video","Publishing results safely","8 min"],["Guide","Roles and permissions explained","Guide"]];D.ts=[["Training session: Admin basics","Thu 22 Oct, 11:00",0],["Training session: Finance manager","Tue 27 Oct, 15:00",0]];D.hlF="All";D.hq="";
PAGES["Help & training"]=()=>`${sec("Tutorials and guides","",`<div class="btnrow" style="margin-bottom:10px"><div style="flex:1;min-width:200px">${inp("hq",D.hq,"Search help","text","data-safe")}</div>${["All","Video","Guide"].map(x=>`<button class="rbtn ${D.hlF===x?"on":""}" data-safe data-a="hlf" data-i="${x}">${x}</button>`).join("")}</div><div class="grid3">${D.hl.filter(h=>(D.hlF==="All"||h[0]===D.hlF)&&h[1].toLowerCase().includes(D.hq.toLowerCase())).map(h=>`<div class="cardx"><div class="row">${pill(h[0],h[0]==="Video"?"acc":"todo")}<span class="h">${h[2]}</span></div><h4>${h[1]}</h4>${btn(h[0]==="Video"?"▶ Watch":"Read","dl","sm safe",h[1])}</div>`).join("")||'<div class="empty">Nothing found</div>'}</div>`)}
 ${sec("Live training","Free for all staff.",tbl(["Session","When",""],D.ts.map((t,i)=>[t[0],t[1],t[2]?pill("Registered","ok")+" "+btn("Cancel","tsc","sm safe",i):btn("Register","tsr","pri sm safe",i)])))}`;
ACT.hlf=a=>{D.hlF=a.dataset.i;rerender()};ACT.tsr=a=>{D.ts[+a.dataset.i][2]=1;toast("✓ Registered. Calendar invite sent");rerender()};ACT.tsc=a=>{D.ts[+a.dataset.i][2]=0;rerender()};
document.addEventListener("input",e=>{if(e.target.id==="hq"){D.hq=e.target.value;const p=e.target.selectionStart;rerender();const n=$("hq");n.focus();n.setSelectionRange(p,p)}});
D.tk=[{id:"TCK-2041",s:"Result import shows wrong class",st:"Open",p:"Normal",d:"11 Oct"},{id:"TCK-2018",s:"Need extra branch added",st:"Resolved",p:"Low",d:"28 Sep"}];
PAGES["Contact support"]=()=>`<div class="split">${sec("Raise a ticket","We reply within 4 working hours (Mon–Sat, 9 to 6).",fld("Subject",inp("ts1","","What do you need help with?"))+'<div style="height:10px"></div>'+`<div class="grid2">${fld("Category",sel("tc",["Billing","Fees","Results","Attendance","Import","Other"]))}${fld("Priority",sel("tp",["Low","Normal","High","Urgent"],"Normal"))}</div><div style="height:10px"></div>`+fld("Details",`<textarea id="td" placeholder="Steps, screenshots and what you expected"></textarea>`)+`<div class="savebar">${btn("Send ticket","tsend","pri safe")}</div>`)}
 <div>${sec("Chat with ILMA","Typically replies in 2 minutes.",`<div class="chatbox" id="chat"><div class="msg bot">Hi! I'm the ILMA support assistant. How can I help?</div></div><div class="btnrow" style="margin-top:8px"><div style="flex:1">${inp("cm","","Type a message","text","data-safe")}</div>${btn("Send","chat","pri safe")}</div>`)}</div></div>
 ${sec("Your tickets","",tbl(["Ticket","Subject","Priority","Status","Opened"],D.tk.map(t=>[t.id,t.s,t.p,pill(t.st,t.st==="Open"?"warn":"ok"),t.d])))}`;
ACT.tsend=()=>{if(!val("ts1")){toast("Add a subject","bad");return}D.tk.unshift({id:"TCK-"+(2042+D.tk.length),s:val("ts1"),st:"Open",p:val("tp"),d:"14 Oct"});toast("✓ Ticket sent. Confirmation emailed");rerender()};
ACT.chat=()=>{const v=val("cm");if(!v)return;const c=$("chat");c.insertAdjacentHTML("beforeend",`<div class="msg me">${esc(v)}</div>`);$("cm").value="";setTimeout(()=>{c.insertAdjacentHTML("beforeend",`<div class="msg bot">Thanks! An agent will join shortly. Meanwhile, see Help &amp; training for “${esc(v.slice(0,30))}”.</div>`);c.scrollTop=c.scrollHeight},500);c.scrollTop=c.scrollHeight};
D.sa={on:0,until:null,log:[["28 Sep 11:02","Ali (ILMA support)","1 hour","Import issue"],["03 Aug 15:40","Maria (ILMA support)","4 hours","Billing correction"]]};
PAGES["Support access"]=()=>`${sec("Time-limited access for ILMA support","Support sees only what you allow, can't change billing, and every action is logged here.",D.sa.on?`<div class="kpis">${kpis([["Status","Access granted","Ends in "+D.sa.until,"warn"]])}</div><div class="btnrow" style="margin-top:10px">${btn("Revoke now","sarev","dan")}</div>`:`<div class="empty"><p>No active access</p>${btn("Grant access","sagrant","pri")}</div>`)}
 ${sec("Past sessions","",tbl(["When","Who","Length","Reason"],D.sa.log))}`;
ACT.sagrant=()=>modal({title:"Grant support access",ok:"Grant access",body:fld("Duration",sel("sd2",["1 hour","4 hours","24 hours"]))+fld("Scope",sel("ss",["Read only","Read and fix data (no billing)"]))+fld("Reason",inp("sr","","e.g. Help with import")),onOk:d=>{D.sa.on=1;D.sa.until=val("sd2",d).replace(" hours"," h").replace(" hour"," h");log("Support access","Granted "+val("sd2",d));toast("✓ Access granted for "+val("sd2",d));rerender()}});
ACT.sarev=()=>{D.sa.on=0;log("Support access","Revoked");toast("Access revoked");rerender()};
D.fr=[{t:"Bulk SMS cost estimator",v:42,my:0,st:"Planned"},{t:"Parent-teacher meeting booking",v:37,my:1,st:"In progress"},{t:"Bus attendance with QR",v:29,my:0,st:"Open"},{t:"Dark mode for parent app",v:18,my:0,st:"Open"}];D.frS="votes";
PAGES["Feature requests"]=()=>`${sec("Vote on what we build next","You have 3 votes per month.",`<div class="btnrow" style="margin-bottom:10px">${[["votes","Most votes"],["new","Newest"]].map(x=>`<button class="rbtn ${D.frS===x[0]?"on":""}" data-safe data-a="frs" data-i="${x[0]}">${x[1]}</button>`).join("")}${btn("＋ Suggest a feature","frnew","pri")}</div><div class="list">${[...D.fr].sort((a,b)=>D.frS==="votes"?b.v-a.v:0).map((f,i)=>`<div class="cardx"><div class="row"><div><h4>${f.t}</h4><span class="h">${f.st}</span></div><button class="btn ${f.my?"pri":""}" data-safe data-a="vote" data-i="${D.fr.indexOf(f)}">▲ ${f.v}</button></div></div>`).join("")}</div>`)}`;
ACT.frs=a=>{D.frS=a.dataset.i;rerender()};
ACT.vote=a=>{const f=D.fr[+a.dataset.i];f.my=f.my?0:1;f.v+=f.my?1:-1;rerender()};
ACT.frnew=()=>modal({title:"Suggest a feature",ok:"Submit",body:fld("Title",inp("ft1","","Short and clear"))+fld("Why it helps",`<textarea id="fw"></textarea>`),onOk:d=>{if(!val("ft1",d)){toast("Add a title","bad");return false}D.fr.unshift({t:val("ft1",d),v:1,my:1,st:"Open"});toast("✓ Thanks! Added for voting");rerender()}});
render();
</script>
</body>
</html>
