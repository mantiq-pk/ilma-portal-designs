<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ILMA Report Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B2D;--mut:#5B6779;--ln:#E1E7EF;--pu:#5B3DF5;--put:#EEEAFE}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F1F3F8;color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:#fff;border-right:1px solid var(--ln);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side h2{font-size:16px;margin:4px 8px 10px}.gp{font-size:12px;color:var(--mut);font-weight:600;padding:12px 8px 4px}
.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font:500 14px Inter,sans-serif;color:var(--ink);min-height:40px;cursor:pointer}
.side button[aria-current="true"]{background:var(--put);color:#3F25C9;font-weight:700}
button:focus-visible{outline:3px solid #9B87FF;outline-offset:2px}
.main{flex:1;min-width:0;padding:20px}
.bar{max-width:920px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.bt{background:var(--pu);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 14px Inter,sans-serif;min-height:44px;cursor:pointer}
.chips span{display:inline-block;background:#fff;border:1px solid var(--ln);border-radius:99px;padding:5px 12px;margin-right:6px;font-size:13px}
.paper{max-width:920px;margin:0 auto;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:32px}
.hd{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
.lg{display:flex;gap:12px;align-items:center}.lg i{width:44px;height:44px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.lg b{font-size:18px}.lg small,.gen{color:var(--mut);font-size:12px}.gen{text-align:right}
h1{font-size:24px;margin:0 0 2px}.ds{color:var(--mut);margin:0 0 16px}
.mt{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px;margin-bottom:16px;font-size:13px}.mt span{color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kp div{border:1px solid var(--ln);border-radius:10px;padding:12px}.kp small{color:var(--mut);font-size:12px}.kp b{display:block;font-size:22px;margin:2px 0}
.ch{border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:18px}.ch h3{margin:0 0 10px;font-size:14px}
.bar-r{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.bar-r i{display:block;height:14px;border-radius:4px;background:var(--pu)}.bar-r span:last-child{text-align:right;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{background:#F5F6FA;text-align:left;padding:9px 10px;font-weight:600;color:#34425A;border-bottom:1px solid var(--ln)}
td{padding:9px 10px;border-bottom:1px solid var(--ln)}.r{text-align:right}.c{text-align:center}tr.t td{font-weight:700;background:#F5F6FA}
.pl{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.g{background:#E3F5EC;color:#0A5F3A}.rd{background:#FDE8E8;color:#9B1C1C}.am{background:#FEF3C7;color:#8A3B0B}.gy{background:#EEF1F5;color:#334155}
.nt{margin-top:14px;color:var(--mut);font-size:13px}
.sg{display:flex;gap:30px;margin-top:44px}.sg div{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--mut)}
.ft{margin-top:22px;padding-top:10px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
@media(max-width:800px){.app{flex-direction:column}.side{width:100%;height:auto;position:static}.paper{padding:18px}}
@media print{.side,.bar{display:none}body{background:#fff}.main{padding:0}.paper{border:0;max-width:none;padding:0}}
</style></head><body>
