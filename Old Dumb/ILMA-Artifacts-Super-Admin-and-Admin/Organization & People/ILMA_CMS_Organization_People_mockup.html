<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ILMA CMS · Organization & People</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

:root{--bg:#f5f6fb;--card:#fff;--ink:#14162b;--mut:#646a8c;--line:#e8eaf3;--hov:#f7f7fd;--acc:#6c4cf1;--accs:#efeaff;--ok:#0f8a66;--oks:#e3f7ef;--warn:#a85a05;--warns:#fff3dc;--bad:#d9362b;--bads:#fdebec;--blue:#2a63d4;--blues:#e6efff;
--shadow:0 1px 2px rgba(20,22,43,.05),0 8px 24px rgba(20,22,43,.06);--glow:radial-gradient(900px 300px at 20% -10%,rgba(108,76,241,.10),transparent),radial-gradient(700px 260px at 100% 0,rgba(255,140,120,.08),transparent)}
:root[data-theme=dark]{--bg:#0d1022;--card:#161a35;--ink:#eceefc;--mut:#9ba1c8;--line:#262b4d;--hov:#1b2040;--accs:#2a2458;--ok:#4fd1a5;--oks:#0f3a2e;--warn:#f4b25c;--warns:#3d2e10;--bad:#ff8a80;--bads:#41191c;--blue:#8ab4ff;--blues:#1a2b52;--glow:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1022;--card:#161a35;--ink:#eceefc;--mut:#9ba1c8;--line:#262b4d;--hov:#1b2040;--accs:#2a2458;--ok:#4fd1a5;--oks:#0f3a2e;--warn:#f4b25c;--warns:#3d2e10;--bad:#ff8a80;--bads:#41191c;--blue:#8ab4ff;--blues:#1a2b52;--glow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:none;position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#1a2152,#12172f 60%);color:#c9cdf0;padding:16px 14px;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;color:#fff;font-weight:800;padding:4px 6px 16px}
.brand i{width:38px;height:38px;border-radius:11px;background:#0b0f26;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal}
.brand small{display:block;font-weight:500;font-size:11.5px;color:#8c91c4}
.nv{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:3px;border-radius:12px;color:#c9cdf0;font-weight:600;cursor:pointer}
.nv:hover{background:rgba(255,255,255,.07)}.nv.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.nv b{margin-left:auto;background:#e5484d;color:#fff;font-size:11px;border-radius:99px;padding:0 7px}
.nv .ch{margin-left:auto;font-size:11px;opacity:.7}
.sub1{padding-left:18px;margin-bottom:6px}.sub1 .nv{font-size:13.5px;padding:7px 12px;font-weight:500}.sub1 .nv.on{box-shadow:none;background:rgba(108,76,241,.35)}
.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:14px 4px 4px;display:flex;gap:10px;align-items:center;color:#fff;font-size:13.5px;font-weight:700}
.me small{display:block;color:#8c91c4;font-weight:500}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none;background:hsl(var(--h,260) 52% 46%)}
.av.s{width:26px;height:26px;font-size:10px}
.col{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--mut)}
select,.in{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 12px;min-width:0}
.in{width:100%}textarea.in{min-height:84px;resize:vertical}
.sp{flex:1}
.bell{position:relative;border:0;border-radius:14px;height:42px;width:42px;color:#fff;background:linear-gradient(135deg,#ffb020,#ff5e7a);box-shadow:0 8px 20px rgba(255,110,100,.35);font-size:18px}
.bell b{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;font-size:10.5px;border-radius:99px;padding:1px 6px;border:2px solid var(--card)}
main{padding:24px 28px 60px;background:var(--glow);min-height:calc(100vh - 66px)}
.hd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.hd>div:first-child{flex:1;min-width:240px;border-left:3px solid var(--acc);padding-left:16px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}h2{margin:0;font-size:20px}h3{margin:0;font-size:16px}
.sub{margin:2px 0 0;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center;transition:transform .15s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,#6c4cf1,#5b43d6);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(108,76,241,.3)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{color:var(--bad)}.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 16px;box-shadow:var(--shadow);text-align:left;width:100%}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em}.kpi span{color:var(--mut);font-size:13px}
button.kpi:hover{border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:6px;min-height:168px}
.tile:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 14px 34px rgba(108,76,241,.18)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:hsl(var(--h) 80% 94%)}
:root[data-theme=dark] .tile .ic{background:hsl(var(--h) 40% 22%)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tile .ic{background:hsl(var(--h) 40% 22%)}}
.tile h3{margin-top:6px}.tile p{margin:0;color:var(--mut);font-size:13.5px;flex:1}
.tile .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile .n{position:absolute;top:16px;right:16px;background:#e5484d;color:#fff;font-weight:800;font-size:12px;border-radius:99px;padding:1px 9px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--hov);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warns);color:var(--warn);border-color:transparent}.pill.bad{background:var(--bads);color:var(--bad);border-color:transparent}.pill.acc{background:var(--accs);color:var(--acc);border-color:transparent}.pill.blue{background:var(--blues);color:var(--blue);border-color:transparent}
.att{display:flex;flex-direction:column;gap:2px}
.att button{display:flex;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:10px 8px;border-radius:12px;border-bottom:1px solid var(--line)}
.att button:hover{background:var(--hov)}.att span{flex:1}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.45);z-index:40;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:75vw;min-width:min(760px,100vw);background:var(--bg);z-index:41;box-shadow:-24px 0 60px rgba(10,12,30,.35);display:flex;flex-direction:column;animation:slide .25s ease;border-left:1px solid var(--line)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}}
.dhd{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dhd h2{flex:1;display:flex;gap:10px;align-items:center}
.dbd{padding:20px 24px 60px;overflow:auto;flex:1}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--accs);color:var(--acc)}.tabs button i{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:700;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--hov);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--hov)}
tr.grp td{background:var(--hov);font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
td.done .tt{text-decoration:line-through;color:var(--mut)}
td small{display:block;color:var(--mut);font-size:12.5px}
td .tt{font-weight:700}
.cb{width:20px;height:20px;accent-color:var(--acc);cursor:pointer}
.ra{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
td select{padding:5px 8px;font-size:13px;border-radius:8px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--mut)}
.fld select,.fld .in{font-weight:500;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.trow:last-child{border-bottom:0}.trow>div:first-child{flex:1}.trow small{display:block;color:var(--mut)}
.sw{position:relative;width:42px;height:24px;flex:none;display:inline-block}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:var(--acc)}.sw input:checked+i::after{left:21px}
.qa{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px;align-items:center}
.qa .in{flex:1;min-width:180px}
.prog{height:8px;background:var(--hov);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:80px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#6c4cf1,#8b6cff)}
.bal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.bal div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.bal b{font-size:22px}.bal span{display:block;color:var(--mut);font-size:13px}
.info{background:var(--blues);color:var(--blue);border-radius:12px;padding:10px 14px;font-size:13.5px;margin:0 0 12px}
.thr{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{display:flex;gap:10px}.msg .bd{background:var(--hov);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px}.msg .hh{font-size:12px;color:var(--mut);font-weight:700}
.msg.me{flex-direction:row-reverse}.msg.me .bd{background:var(--accs);border-color:transparent;border-radius:14px 4px 14px 14px}
.an{border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.an.urgent{border-left-color:var(--bad);background:linear-gradient(90deg,var(--bads),var(--card) 40%)}
.an h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.an p{margin:6px 0 10px;white-space:pre-wrap}
.un{font-weight:800}.unread td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
dialog{border:0;border-radius:22px;padding:0;width:min(620px,94vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(10,12,30,.4)}
dialog::backdrop{background:rgba(10,12,30,.55)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}.mh h3{flex:1}.mh button{border:0;background:var(--hov);width:34px;height:34px;border-radius:10px}
.mb{padding:18px 22px;max-height:66vh;overflow:auto}.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;pointer-events:none}
#toast div{background:#12172f;color:#fff;padding:11px 18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-weight:600;font-size:14px;animation:slide .2s}
.pop{position:absolute;right:28px;top:60px;width:380px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(20,22,43,.25);padding:10px;z-index:30}
.pop h4{margin:6px 8px 8px}.pop button.ni{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:12px}.pop button.ni:hover{background:var(--hov)}.pop small{display:block;color:var(--mut)}
@media(max-width:1100px){.drawer{width:92vw}}
@media(max-width:900px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;align-items:center}.me,.sub1,.brand small{display:none}.brand{padding:0 8px 0 4px}.nv{width:auto;white-space:nowrap;margin:0}
.top{padding:10px 14px}main{padding:18px 14px 60px}.drawer{width:100vw;min-width:0}.dbd{padding:14px 12px 60px}.g2,.g3{grid-template-columns:1fr}.pop{right:10px}}

.cat{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;margin:6px 0 12px}
.cat i{font-style:normal;color:#2a63d4}
.tile{min-height:150px}
.tile .ic{background:hsl(var(--h) 80% 94%)}
.sg{display:inline-flex;gap:3px}.sg button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:12px;color:var(--mut)}
.sg button.on.P{background:var(--oks);color:var(--ok);border-color:transparent}.sg button.on.A{background:var(--bads);color:var(--bad);border-color:transparent}.sg button.on.L{background:var(--warns);color:var(--warn);border-color:transparent}.sg button.on.V{background:var(--blues);color:var(--blue);border-color:transparent}.sg button.on.H{background:var(--accs);color:var(--acc);border-color:transparent}
.reg{border-collapse:separate;border-spacing:2px;font-size:12px}.reg th{padding:4px 2px;text-align:center;background:none;border:0;min-width:26px}.reg td{padding:0;border:0;text-align:center}.reg td.n{text-align:left;padding:4px 10px 4px 4px;white-space:nowrap;font-weight:700;font-size:13px;position:sticky;left:0;background:var(--card)}
.reg .c{display:block;width:26px;height:26px;line-height:26px;border-radius:6px;font-weight:800;font-size:11px;cursor:pointer}
.reg .c.P{background:var(--oks);color:var(--ok)}.reg .c.A{background:var(--bads);color:var(--bad)}.reg .c.L{background:var(--warns);color:var(--warn)}.reg .c.V{background:var(--blues);color:var(--blue)}.reg .c.H{background:var(--accs);color:var(--acc)}.reg .c.W{background:var(--hov);color:var(--mut);cursor:default}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:10px 0}
.tree ul{list-style:none;margin:0;padding-left:26px;position:relative}.tree>ul{padding-left:0}.tree li{position:relative;padding:6px 0 6px 18px}
.tree li::before{content:"";position:absolute;left:-8px;top:0;bottom:0;border-left:2px solid var(--line)}.tree li::after{content:"";position:absolute;left:-8px;top:26px;width:18px;border-top:2px solid var(--line)}.tree>ul>li{padding-left:0}.tree>ul>li::before,.tree>ul>li::after{display:none}.tree li:last-child::before{bottom:auto;height:27px}
.node{display:inline-flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px;box-shadow:var(--shadow);cursor:pointer}.node:hover{border-color:var(--acc)}.node small{display:block;color:var(--mut)}
.bigav{width:64px;height:64px;font-size:22px}
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.frm .full{grid-column:1/-1}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:18px}.tl>div{position:relative;padding-bottom:14px}.tl>div::before{content:"";position:absolute;left:-26px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.dchk{display:flex;gap:10px;flex-wrap:wrap}.dchk label{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--ink);font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.emb{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#faf9f5}.emb iframe{display:block;width:100%;height:calc(100vh - 190px);min-height:560px;border:0}
@media(max-width:900px){.frm{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div class="col">
 <div class="top">
  <label>View as<select id="role"><option value="super">Super Admin · all branches</option><option value="admin">Admin · single branch</option></select></label>
  <label id="abl" hidden>Admin of<select id="abr"></select></label>
  <div class="sp"></div>
  <button class="btn sm" id="theme">◐ Light / Dark</button>
 </div>
 <main id="main"></main>
</div>
</div>
<div id="layer"></div>
<dialog id="dlg"></dialog>

function lateRows(){const days=Array.from({length:15},(_,i)=>`${MON}-${String(i+1).padStart(2,'0')}`);return vis().filter(s=>s.st!=='resigned').map(s=>{const sh=SH.find(x=>x.id===s.sh);const ls=days.map(d=>({d,o:getAt(s.id,d)})).filter(x=>x.o.s==='L');return{s,n:ls.length,avg:ls.length?Math.max(1,Math.round(ls.reduce((a,x)=>a+Math.max(1,tm(x.o.t)-tm(sh.s)),0)/ls.length)):0,last:ls.length?ls[ls.length-1].d:null}}).filter(x=>x.n).sort((a,b)=>b.n-a.n)}
