<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ILMA – Academic calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a13;--panel:#0f1320;--panel2:#141a2b;--line:#232a40;--text:#f3f5fb;--sub:#8991ab;--accent:#1862fe;--accent2:#3b82f6;--soft:rgba(24,98,254,.14);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6fb;--panel:#fff;--panel2:#f7f9fd;--line:#e2e6f0;--text:#0b0e17;--sub:#5b6377;--soft:rgba(24,98,254,.08)}}
:root[data-theme="light"]{--bg:#f4f6fb;--panel:#fff;--panel2:#f7f9fd;--line:#e2e6f0;--text:#0b0e17;--sub:#5b6377;--soft:rgba(24,98,254,.08)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Plus Jakarta Sans",-apple-system,Helvetica,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:26px}.brand b{font-weight:800;font-size:18px}
.brand span{color:var(--sub);border-left:1px solid var(--line);padding-left:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent2)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
main{max-width:1320px;margin:0 auto;padding:20px 24px 40px}
.r1{display:grid;grid-template-columns:1fr 230px;gap:14px;margin-bottom:18px}
.next{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.nc{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.nc:hover{border-color:var(--cc)}
.nc small{color:var(--sub);font-size:12px}.nc strong{font-size:14px;line-height:1.3}.nc .cd{color:var(--accent2);font-weight:700;font-size:13px}
.stats{display:grid;gap:8px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.st small{color:var(--sub);font-size:12px;display:block}.st b{font-size:18px;font-weight:800}
.prog{height:5px;border-radius:5px;background:var(--line);margin-top:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent2)}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.mo{display:flex;align-items:center;gap:8px}.mo h2{margin:0 6px;font-size:20px;font-weight:800;min-width:150px}
.sq{width:34px;height:34px;padding:0;font-size:18px}
.tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--sub)}
.tabs button.on{background:var(--accent);color:#fff}.tabs button[disabled]{opacity:.4;cursor:not-allowed}
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.fc i{font-style:normal;color:var(--cc)}.fc em{font-style:normal;background:var(--panel2);border-radius:999px;padding:0 7px;font-size:12px;color:var(--sub)}
.fc[aria-pressed=true]{background:color-mix(in srgb,var(--cc) 18%,var(--panel));border-color:var(--cc)}
.fc[aria-pressed=false]{opacity:.55}
.filt select{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.body{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hd,.wk>.cells{display:grid;grid-template-columns:repeat(7,1fr)}
.hd div{padding:9px 8px;font-size:12px;font-weight:700;color:var(--sub);border-bottom:1px solid var(--line)}
.wk{position:relative;border-bottom:1px solid var(--line)}.wk:last-child{border:0}
.cell{position:relative;min-height:96px;padding:30px 5px 5px;border-right:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:nth-child(7){border-right:0}
.wk.noev .cell{min-height:46px}
.cell.band{background:color-mix(in srgb,var(--band) 10%,var(--panel))}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent2)}
.cell.out .num{opacity:.4}.cell.past>*{opacity:.55}
.num{position:absolute;top:5px;left:6px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:12.5px;font-weight:700}
.num.today{background:var(--accent);color:#fff}
.lane{flex:none}
.chip,.bk{display:flex;align-items:center;gap:5px;width:100%;border:0;text-align:left;font-size:12px;line-height:1.2;padding:3px 6px;border-radius:6px;background:color-mix(in srgb,var(--cc) 20%,transparent);border-left:3px solid var(--cc);overflow:hidden;white-space:nowrap}
.chip .tx,.bk .tx{overflow:hidden;text-overflow:ellipsis;flex:1}
.chip:hover,.bk:hover{background:color-mix(in srgb,var(--cc) 34%,transparent)}
.ic{color:var(--cc);font-size:12px}.br{font-size:11px;color:var(--sub);font-weight:700}
.more{background:none;border:0;color:var(--accent2);font-size:12px;font-weight:700;text-align:left;padding:1px 4px}
.bars{position:absolute;left:0;right:0;top:30px;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:22px;gap:2px;padding:0 5px;pointer-events:none}
.bk{pointer-events:auto;height:22px;font-weight:600;background:color-mix(in srgb,var(--cc) 32%,transparent)}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.day h3{margin:0 0 2px;font-size:16px;font-weight:800}.day .sub{color:var(--sub);margin:0 0 12px;font-size:13px}
.empty{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.it{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.it .tm{font-weight:700;font-size:13px;color:var(--cc)}
.it h4{margin:0;font-size:14px;font-weight:700}.it p{margin:2px 0 6px;color:var(--sub);font-size:13px}
.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ac .btn{padding:5px 10px;font-size:12px}
.rs{font-size:12.5px;margin-top:6px}
.ag{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 16px}
.ag h5{margin:8px 0 0;font-size:13px;color:var(--accent2)}
.pop{position:fixed;z-index:20;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.4);display:none}
.pop.on{display:block}
.pop h4{margin:0 0 10px;font-size:14px}.pop label{display:block;font-size:12px;font-weight:700;margin:8px 0 3px}
.pop input,.pop select{width:100%;border:1.5px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px}
.pop .ac{margin-top:12px}.pop .it{grid-template-columns:48px 1fr;padding:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--accent2);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dv .slot{display:grid;grid-template-columns:70px 1fr;border-top:1px solid var(--line);min-height:56px}
.dv .slot>b{padding:8px 12px;font-size:12px;color:var(--sub);font-weight:600}
.dv .slot>div{padding:6px 10px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line)}
.dv .ad{padding:12px 16px;display:flex;flex-direction:column;gap:6px}.dv .chip{font-size:13px;padding:7px 10px}
.wv{display:grid;grid-template-columns:repeat(7,1fr)}
.wc{min-height:300px;padding:8px 6px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.wc:last-child{border:0}.wc.sel{box-shadow:inset 0 0 0 2px var(--accent2)}.wc.past>*{opacity:.55}
.wh{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--sub);padding-bottom:6px;border-bottom:1px solid var(--line)}
.wh .num{position:static}
.wc .chip{white-space:normal;align-items:flex-start}.wc .chip .tx{white-space:normal}
.yv{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px}
.ym{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}
.ym h6{margin:0 0 6px;font-size:13px;font-weight:800;cursor:pointer}.ym h6:hover{color:var(--accent2)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mg i{font-style:normal;font-size:11px;color:var(--sub)}
.yd{position:relative;border:0;background:none;padding:4px 0;font-size:12px;border-radius:6px}
.yd.has::after{content:"";position:absolute;left:50%;bottom:1px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--cc)}
.yd.ex{background:color-mix(in srgb,var(--cc) 24%,transparent)}.yd.tdy{background:var(--accent);color:#fff}.yd.sel{outline:2px solid var(--accent2)}
@media (max-width:1020px){.yv{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){.wv{grid-template-columns:1fr}.wc{min-height:0;border-right:0;border-bottom:1px solid var(--line)}.yv{grid-template-columns:1fr}}
@media (max-width:1020px){.body,.r1{grid-template-columns:1fr}.day{position:static;max-height:none}.next{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){main{padding:14px}.top{padding:12px 14px}.next{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.cell{min-height:70px}.tabs button{padding:6px 8px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

const vis=()=>E.filter(x=>S.cats.has(x.c)&&(S.br==='All'||x.b===S.br||x.b==='All')&&(S.au==='all'||x.a===S.au||x.a==='all'));
const on=(x,dt)=>x.s<=dt&&dt<=x.e,multi=x=>x.s!==x.e;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clash=(ev,dt)=>E.find(x=>x!==ev&&x.c==='exam'&&ev.c==='exam'&&!multi(x)&&x.s===dt&&x.tm===ev.tm&&x.ad===ev.ad);

function item(x){const [n,col,ic]=C[x.c];const r=x.r;
 return `<article class="it" style="--cc:${col}"><div class="tm">${x.tm}</div><div><h4><span class="ic">${ic}</span> ${esc(x.t)}</h4>
 <p>${[x.v,x.ad,multi(x)?lbl(x.s)+' to '+lbl(x.e):'',x.b==='All'?'All branches':x.b+' campus'].filter(Boolean).map(esc).join(' · ')}</p>
 ${r?`<div class="rs">${r[0]} of ${r[1]} ${r[2]} confirmed<div class="prog"><i style="width:${Math.round(r[0]/r[1]*100)}%"></i></div></div>`:''}
 <div class="ac"><button class="btn" data-act="edit">Edit</button>${r?`<button class="btn" data-act="wa" data-n="${r[1]-r[0]}" data-w="${r[2]}">Send reminder via WhatsApp</button>`:'<button class="btn" data-act="rem">Remind</button>'}</div></div></article>`}

function renderNext(){const up=vis().filter(x=>x.e>=TODAY).sort((a,b)=>a.s.localeCompare(b.s)||a.tm.localeCompare(b.tm)).slice(0,4);
 $('#next').innerHTML=up.map(x=>{const k=diff(TODAY,x.s),w=k<=0?'Happening now':k===1?'Tomorrow, '+x.tm:'Starts in '+k+' days';const [n,col,ic]=C[x.c];
  return `<button class="nc" style="--cc:${col}" data-d="${x.s}"><small><span class="ic">${ic}</span> ${n}</small><strong>${esc(x.t)}</strong><span class="cd">${w}</span><small>${[x.v,x.ad].filter(Boolean).map(esc).join(' · ')}</small></button>`}).join('')||'<div class="nc">No upcoming events</div>';
 const mo=E.filter(x=>x.s.slice(0,7)===`${S.y}-${p2(S.m+1)}`).length,ex=E.filter(x=>x.c==='exam'&&x.s>=TODAY&&x.s<=add(TODAY,6)).length,wk=Math.floor(diff(TERM[0],TODAY)/7)+1;
 $('#stats').innerHTML=`<div class="st"><small>Events this month</small><b>${mo}</b></div><div class="st"><small>Exams in next 7 days</small><b>${ex}</b></div><div class="st"><small>Term progress</small><b>Week ${wk} of ${TERM[1]}</b><div class="prog"><i style="width:${wk/TERM[1]*100}%"></i></div></div>`}

function renderFilters(){const mk=S.view==='year'?`${S.y}-`:`${S.y}-${p2(S.m+1)}`;
 $('#filt').innerHTML=Object.entries(C).map(([k,[n,col,ic]])=>`<button class="fc" style="--cc:${col}" data-c="${k}" aria-pressed="${S.cats.has(k)}"><i>${ic}</i>${n}<em>${E.filter(x=>x.c===k&&x.s.startsWith(mk)).length}</em></button>`).join('')+
 `<select id="fb" aria-label="Branch"><option value="All">All branches</option><option>Main</option><option>North</option></select><select id="fa" aria-label="Audience">${Object.entries(AU).map(([k,v])=>`<option value="${k}">${k==='all'?'All audiences':v}</option>`).join('')}</select>`;
 $('#fb').value=S.br;$('#fa').value=S.au}

const wkStart=dt=>add(dt,-((d(dt).getDay()+6)%7)),hm=x=>x.tm.includes(':')?x.tm+' ':'';
const ttl=()=>{if(S.view==='day')return d(S.sel).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 if(S.view==='week'){const a=wkStart(S.sel);return d(a).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' to '+d(add(a,6)).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
 if(S.view==='year')return String(S.y);
 return new Date(S.y,S.m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
const wchip=x=>`<button class="chip" draggable="${!multi(x)}" data-id="${x.id}" style="--cc:${C[x.c][1]}" title="${esc(x.t)}"><span class="ic">${C[x.c][2]}</span><span class="tx">${multi(x)?'':hm(x)}${esc(x.t)}</span><span class="br">${BR[x.b]}</span></button>`;
function dayV(V){const ev=V.filter(x=>on(x,S.sel)).sort((a,b)=>a.tm.localeCompare(b.tm)),ad=ev.filter(x=>multi(x)||!x.tm.includes(':')),tm=ev.filter(x=>!multi(x)&&x.tm.includes(':'));
 let h='<div class="dv">';
 if(!ev.length)h+='<div class="ad"><div class="empty"><span>Nothing scheduled for this day.</span><button class="btn pri" data-act="addsel">Add event</button></div></div>';
 if(ad.length)h+='<div class="ad">'+ad.map(x=>`<button class="chip" data-id="${x.id}" style="--cc:${C[x.c][1]}"><span class="ic">${C[x.c][2]}</span><span class="tx">${multi(x)?lbl(x.s)+' to '+lbl(x.e)+' · ':'All day · '}${esc(x.t)}</span><span class="br">${BR[x.b]}</span></button>`).join('')+'</div>';
 for(let hr=7;hr<=19;hr++){const L=tm.filter(x=>Math.min(19,Math.max(7,+x.tm.slice(0,2)))===hr);
  h+=`<div class="slot"><b>${hr===19?'19:00+':p2(hr)+':00'}</b><div>${L.map(x=>`<button class="chip" data-id="${x.id}" style="--cc:${C[x.c][1]}"><span class="ic">${C[x.c][2]}</span><span class="tx">${x.tm} · ${esc(x.t)} · ${esc([x.v,x.ad].filter(Boolean).join(' · '))}</span><span class="br">${BR[x.b]}</span></button>`).join('')}</div></div>`}
 return h+'</div>'}
function weekV(V){const a=wkStart(S.sel);return '<div class="wv">'+[0,1,2,3,4,5,6].map(i=>{const dt=add(a,i),ev=V.filter(x=>on(x,dt)).sort((p,q)=>p.tm.localeCompare(q.tm));
 return `<div class="wc${dt===S.sel?' sel':''}${dt<TODAY?' past':''}" data-d="${dt}" tabindex="0"><div class="wh"><span>${d(dt).toLocaleDateString('en-GB',{weekday:'short'})}</span><span class="num${dt===TODAY?' today':''}">${d(dt).getDate()}</span></div>${ev.map(wchip).join('')}</div>`}).join('')+'</div>'}
function yearV(V){let h='<div class="yv">';for(let m=0;m<12;m++){const f=new Date(S.y,m,1),lead=(f.getDay()+6)%7,n=new Date(S.y,m+1,0).getDate();
 h+=`<div class="ym"><h6 data-gm="${m}">${f.toLocaleDateString('en-GB',{month:'long'})}</h6><div class="mg">`+['M','T','W','T','F','S','S'].map(x=>`<i>${x}</i>`).join('')+'<i></i>'.repeat(lead);
 for(let i=1;i<=n;i++){const dt=`${S.y}-${p2(m+1)}-${p2(i)}`,ev=V.filter(x=>on(x,dt)),bd=E.find(x=>x.band&&on(x,dt));
  h+=`<button class="yd${ev.length?' has':''}${bd?' ex':''}${dt===TODAY?' tdy':''}${dt===S.sel?' sel':''}" data-yd="${dt}" style="--cc:${C[(bd||ev[0]||{c:'ev'}).c][1]}" title="${esc(ev.map(x=>x.t).join(', '))}">${i}</button>`}
 h+='</div></div>'}return h+'</div>'}
function renderCal(){const V=vis(),first=new Date(S.y,S.m,1),lead=(first.getDay()+6)%7,start=add(iso(first),-lead),days=Math.ceil((lead+new Date(S.y,S.m+1,0).getDate())/7);
 $('#mt').textContent=ttl();if(S.view==='day'){$('#cal').innerHTML=dayV(V);return}if(S.view==='week'){$('#cal').innerHTML=weekV(V);return}if(S.view==='year'){$('#cal').innerHTML=yearV(V);return}
 if(S.view==='agenda'){const ds=[...new Set(V.filter(x=>x.s.slice(0,7)===`${S.y}-${p2(S.m+1)}`).map(x=>x.s))].sort();
  $('#cal').innerHTML=ds.map(dt=>`<div class="ag" data-d="${dt}" style="cursor:pointer"><h5>${lbl(dt)}${dt===TODAY?' · today':''}</h5>${V.filter(x=>x.s===dt).map(item).join('')}</div>`).join('')||'<div class="ag"><p>No events this month</p></div>';return}
 let h='<div class="hd">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div>${x}</div>`).join('')+'</div>';
 for(let w=0;w<days;w++){const ws=add(start,w*7),we=add(ws,6),segs=[],lanes=[];
  V.filter(x=>multi(x)&&x.s<=we&&x.e>=ws).sort((a,b)=>a.s.localeCompare(b.s)).forEach(x=>{const c1=Math.max(0,diff(ws,x.s)),c2=Math.min(6,diff(ws,x.e));let l=0;while(lanes[l]&&lanes[l]>=c1)l++;lanes[l]=c2;segs.push([x,c1,c2,l])});
  const nl=lanes.length;let any=nl>0,cells='';
  for(let i=0;i<7;i++){const dt=add(ws,i),dd=d(dt),one=V.filter(x=>!multi(x)&&x.s===dt).sort((a,b)=>a.tm.localeCompare(b.tm)),bd=E.find(x=>x.band&&on(x,dt));if(one.length)any=true;
   cells+=`<div class="cell${dt===TODAY?' tdy':''}${dt<TODAY?' past':''}${dt===S.sel?' sel':''}${dd.getMonth()!==S.m?' out':''}${bd?' band':''}" data-d="${dt}" tabindex="0" ${bd?`style="--band:${C[bd.c][1]}"`:''}>
   <span class="num${dt===TODAY?' today':''}">${dd.getDate()}</span><i class="lane" style="height:${nl*24}px"></i>
   ${one.slice(0,2).map(x=>`<button class="chip" draggable="true" data-id="${x.id}" style="--cc:${C[x.c][1]}" title="${esc(x.t)}"><span class="ic">${C[x.c][2]}</span><span class="tx">${x.tm.includes(':')&&x.tm!=='All day'?x.tm+' ':''}${esc(x.t)}</span><span class="br">${BR[x.b]}</span></button>`).join('')}
   ${one.length>2?`<button class="more" data-more="${dt}">+${one.length-2} more</button>`:''}</div>`}
  h+=`<div class="wk${any?'':' noev'}"><div class="cells">${cells}</div><div class="bars">${segs.map(([x,c1,c2,l])=>`<button class="bk" data-d="${x.s<ws?ws:x.s}" style="--cc:${C[x.c][1]};grid-column:${c1+1}/${c2+2};grid-row:${l+1}"><span class="ic">${C[x.c][2]}</span><span class="tx">${esc(x.t)}</span><span class="br">${BR[x.b]}</span></button>`).join('')}</div></div>`}
 $('#cal').innerHTML=h}

function renderDay(){const V=vis(),ev=V.filter(x=>on(x,S.sel)),lab=lbl(S.sel)+(S.sel===TODAY?' · today':'');let h;
 if(ev.length)h=`<h3>${lab}</h3><p class="sub">${ev.length} event${ev.length>1?'s':''}</p>`+ev.map(item).join('');
 else{const nx=V.filter(x=>x.e>S.sel).sort((a,b)=>a.s.localeCompare(b.s)),nd=nx.length?(nx[0].s>S.sel?nx[0].s:S.sel):null,list=nd?V.filter(x=>on(x,nd)):[];
  h=`<h3>${lab}</h3><div class="empty"><span>Nothing scheduled${S.sel===TODAY?' today':''}.</span><button class="btn pri" data-act="addsel">Add event</button></div>`+(nd?`<h3>Next: ${lbl(nd)}</h3><p class="sub">${list.length} event${list.length>1?'s':''}</p>`+list.map(item).join(''):'')}
 $('#day').innerHTML=h}

const all=()=>{renderNext();renderFilters();renderCal();renderDay()};
const sel=dt=>{S.sel=dt;const x=d(dt);if(x.getMonth()!==S.m||x.getFullYear()!==S.y){S.y=x.getFullYear();S.m=x.getMonth()}all()};
const place=(el,x,y)=>{el.classList.add('on');const w=el.offsetWidth,hh=el.offsetHeight;el.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+'px';el.style.top=Math.max(8,Math.min(y,innerHeight-hh-8))+'px'};
const closePop=()=>$('#pop').classList.remove('on');
function openAdd(dt,x,y){$('#pop').innerHTML=`<h4>New event · ${lbl(dt)}</h4><label for="qt">Title</label><input id="qt" placeholder="e.g. Grade 7 science quiz"><label for="qc">Category</label><select id="qc">${Object.entries(C).map(([k,v])=>`<option value="${k}">${v[2]} ${v[0]}</option>`).join('')}</select><label for="qa">Audience</label><select id="qa">${Object.entries(AU).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label for="qm">Time</label><input id="qm" type="time" value="09:00"><div class="ac"><button class="btn pri" id="qs">Add event</button><button class="btn" id="qx">Cancel</button></div>`;
 place($('#pop'),x,y);$('#qt').focus();$('#qx').onclick=closePop;
 $('#qs').onclick=()=>{const t=$('#qt').value.trim();if(!t){$('#qt').focus();return}const a=$('#qa').value,ev={id:id++,t,s:dt,e:dt,c:$('#qc').value,tm:$('#qm').value||'09:00',v:'To be set',a,ad:AU[a],b:'All'};E.push(ev);closePop();S.sel=dt;all();toast(clash(ev,dt)?`Added, but it clashes with ${clash(ev,dt).t} at ${ev.tm}`:'Event added to '+lbl(dt))}}

document.addEventListener('click',e=>{const T=e.target;
 if(!T.closest('#pop')&&!T.closest('.more')&&!T.closest('.cell,.wc')&&!T.closest('#add')&&!T.closest('[data-act=addsel]'))closePop();
 const a=T.closest('[data-act]');
 if(a){const k=a.dataset.act;if(k==='edit')toast('Edit opens the event form in the full build');if(k==='rem')toast('Reminder queued for the audience');if(k==='wa')toast(`WhatsApp reminder sent to ${a.dataset.n} ${a.dataset.w}`);if(k==='addsel'){const r=a.getBoundingClientRect();openAdd(S.sel,r.left-200,r.bottom+6)}return}
 const m=T.closest('.more');if(m){const dt=m.dataset.more,r=m.getBoundingClientRect();$('#pop').innerHTML=`<h4>${lbl(dt)}</h4>`+vis().filter(x=>on(x,dt)).map(item).join('');place($('#pop'),r.left,r.bottom+4);return}
 const gm=T.closest('[data-gm]');if(gm){S.m=+gm.dataset.gm;S.view='month';setTab();all();return}const yd=T.closest('[data-yd]');if(yd){S.sel=yd.dataset.yd;all();return}const c=T.closest('.chip,.bk,.nc,.ag');if(c&&c.dataset.d){sel(c.dataset.d);return}
 if(c&&c.dataset.id){const pp=c.closest('.cell,.wc');sel(pp?pp.dataset.d:S.sel);return}
 const fc=T.closest('.fc');if(fc){const k=fc.dataset.c;S.cats.has(k)?S.cats.delete(k):S.cats.add(k);all();return}
 const cell=T.closest('.cell,.wc');if(cell){const dt=cell.dataset.d;closePop();sel(dt);if(!vis().some(x=>on(x,dt)))openAdd(dt,e.clientX,e.clientY)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();if(e.key==='Enter'&&(e.target.classList.contains('cell')||e.target.classList.contains('wc')))e.target.click()});
document.addEventListener('change',e=>{if(e.target.id==='fb'){S.br=e.target.value;all()}if(e.target.id==='fa'){S.au=e.target.value;all()}if(e.target.id==='term'&&e.target.value){const [y,m]=e.target.value.split('-');S.y=+y;S.m=+m;e.target.value='';all()}});
const go=n=>{if(S.view==='day'||S.view==='week'){sel(add(S.sel,n*(S.view==='day'?1:7)));return}if(S.view==='year'){S.y+=n;all();return}const x=new Date(S.y,S.m+n,1);S.y=x.getFullYear();S.m=x.getMonth();all()};const setTab=()=>document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);$('#td').onclick=()=>{S.y=2026;S.m=9;S.sel=TODAY;all()};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;S.view=b.dataset.v;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));all()};
$('#add').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();openAdd(S.sel,r.right-290,r.bottom+8)};
$('#sync').onclick=()=>toast('Google Calendar sync and subscribe link: mockup only');$('#exp').onclick=()=>toast('Exported as an .ics file: mockup only');
let drag=null;document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip');if(c){drag=E[c.dataset.id];e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',c.dataset.id)}});
document.addEventListener('dragover',e=>{if(drag&&e.target.closest&&e.target.closest('.cell,.wc'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.cell,.wc');if(!drag||!c)return;e.preventDefault();const dt=c.dataset.d,x=drag;drag=null;x.s=x.e=dt;S.sel=dt;all();const k=clash(x,dt);toast(k?`Clash: ${k.t} is also at ${x.tm} for ${x.ad}`:`Moved to ${lbl(dt)}`)});
if(S.view==='agenda')document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v==='agenda'));
all();
</script>
</body>
</html>
