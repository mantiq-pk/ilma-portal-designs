/* ---------- teacher / admin detail drawer ---------- */
function hwDet(id){const h=HW.find(x=>x.id===+id);hdet=id;const c=cnt(h),k=sc(h.sub),ro=R!=='teacher',r=ROS[h.cl];
 const row=n=>{const s=stf(h,n),rc=h.st[n];let a='';if(!ro){if(s==='pend'||s==='miss')a='<button class="btn sm" data-hwa="recv" data-h="'+h.id+'" data-n="'+eh(n)+'">Received</button><button class="btn sm" data-hwa="exc" data-h="'+h.id+'" data-n="'+eh(n)+'">Excuse</button>';else if(s==='sub'||s==='late')a='<input type="number" min="0" max="'+h.marks+'" placeholder="/'+h.marks+'" id="m_'+eh(n).replace(/ /g,'_')+'"><button class="btn p sm" data-hwa="grade" data-h="'+h.id+'" data-n="'+eh(n)+'">Grade</button>';else if(s==='gr')a='<b>'+rc.m+'/'+h.marks+'</b><button class="btn sm" data-hwa="reopen" data-h="'+h.id+'" data-n="'+eh(n)+'">Edit</button>'}else if(s==='gr')a='<b>'+rc.m+'/'+h.marks+'</b>';
  return '<div class="ro"><div><b>'+n+'</b><div class="sub">'+(rc.seen?'👁 Parent seen':'Parent not seen yet')+'</div></div><div class="a">'+hpill(s)+a+'</div></div>'};
 open('<div class="chs" style="margin-top:6px"><span class="tag" style="--k:'+k+'">'+(SUBI[h.sub]||'')+' '+h.sub+'</span><span class="pill p">Grade '+h.cl+'</span>'+(h.status==='draft'?'<span class="pill w">Draft</span>':'')+'</div><h3 style="font-size:20px;margin:8px 0 4px">'+eh(h.t)+'</h3><div class="sub">By '+h.by+' · Due '+ds(h.due)+' · '+h.marks+' marks · '+h.ty+'</div><div class="msg">'+eh(h.d)+(h.files.length?'<div class="acts">'+h.files.map(f=>'<button class="btn sm" data-t="Downloading '+f+'">📎 '+f+'</button>').join('')+'</div>':'')+'</div>'+
  (h.status==='draft'?'<div class="acts"><button class="btn p" data-hwpub="'+h.id+'">Assign now</button><button class="btn dn2" data-hwdel="'+h.id+'">Delete draft</button></div>':
  '<div class="chs"><span class="pill g">'+c.done+' handed in</span><span class="pill r">'+c.miss+' missing</span><span class="pill b">'+c.pend+' to do</span><span class="pill w">'+(c.sub+c.late)+' to grade</span></div><h3 style="margin:14px 0 2px;font-size:15px">Students <span class="sub" style="font-weight:500">(first '+r.length+' of '+c.ns+')</span></h3>'+r.map(row).join('')+
  (ro?'<div class="acts"><button class="btn" data-t="Nudge sent to '+h.by+'">Nudge '+h.by+'</button></div>':'<div class="acts" style="margin-top:14px"><button class="btn p" data-hwrem="'+h.id+'"'+(c.pend+c.miss?'':' disabled')+'>Remind pending ('+(c.pend+c.miss)+')</button><button class="btn" data-t="Message sent to parents of missing students"'+(c.miss?'':' disabled')+'>Message parents of missing</button><button class="btn" data-hwdel="'+h.id+'">Delete</button></div>')))}
/* ---------- assign drawer ---------- */
function nextWd(){const d=pd(TODAY);do d.setDate(d.getDate()+1);while(d.getDay()===0);return key(d)}
function newForm(){hform={cl:['6-B'],sub:'Maths',t:'',d:'',ty:'Written',due:nextWd(),gr:true,marks:10,late:true,wa:false,files:[]}}
function loadWarn(){const f=hform,out=[];if(!POL.weekend&&pd(f.due).getDay()===0)out.push('<div class="wn">⚠ '+ds(f.due)+' is a Sunday. Your school does not allow homework due on rest days.</div>');
 f.cl.forEach(c=>{const o=HW.filter(h=>h.status==='active'&&h.cl===c&&h.due===f.due);if(o.length>=LIMIT)out.push('<div class="wn">⚠ Grade '+c+' already has '+o.length+' homework due '+ds(f.due)+' ('+o.map(h=>h.sub).join(', ')+'). The daily limit is '+LIMIT+'. Consider another day.</div>');else if(o.length)out.push('<div class="msg">Grade '+c+' has '+o.length+' other homework due that day: '+o.map(h=>h.sub).join(', ')+'.</div>')});
 return out.length?out.join(''):'<div class="okm">✓ Light day for the selected classes.</div>'}
function formUI(){const f=hform;open('<h3 style="font-size:20px;margin:4px 0">Assign homework</h3><div class="sub">Parents and students see it in their Homework menu straight away.</div><div class="fl" style="margin-top:14px"><label>Classes<div class="cl">'+TEACHER.cls.map(c=>'<label><input type="checkbox" data-hfc="'+c+'"'+(f.cl.includes(c)?' checked':'')+'> '+c+'</label>').join('')+'</div></label><label>Subject<select data-hf="sub">'+TEACHER.sub.map(s=>'<option'+(f.sub===s?' selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Title<input type="text" data-hfi="t" value="'+eh(f.t)+'" placeholder="e.g. Fractions worksheet"></label><label>Instructions<textarea data-hfi="d" placeholder="What should students do? Mention page and question numbers.">'+eh(f.d)+'</textarea></label><label>Type<select data-hf="ty">'+['Written','Reading','Online','Project'].map(t=>'<option'+(f.ty===t?' selected':'')+'>'+t+'</option>').join('')+'</select></label><label>Due date<input type="date" data-hf="due" value="'+f.due+'"></label>'+loadWarn()+
  '<label class="ck"><input type="checkbox" data-hfk="gr"'+(f.gr?' checked':'')+'> Graded</label>'+(f.gr?'<label>Total marks<input type="number" data-hfi="marks" value="'+f.marks+'"></label>':'')+'<label class="ck"><input type="checkbox" data-hfk="late"'+(f.late?' checked':'')+'> Accept late hand-in ('+POL.late.toLowerCase()+')</label><label class="ck"><input type="checkbox" data-hfk="wa"'+(f.wa?' checked':'')+'> Also notify parents on WhatsApp (app push is always sent)</label><div><button class="btn sm" data-hwfile="1">📎 Add file</button> <span class="sub">'+(f.files.length?f.files.map(x=>'📎 '+x).join(' · '):'No files')+'</span></div></div><div class="acts" style="margin-top:18px"><button class="btn" data-hwsave="draft">Save as draft</button><button class="btn p" data-hwsave="go">Assign to '+f.cl.length+' class'+(f.cl.length!==1?'es':'')+'</button></div>')}
function saveHW(mode){const f=hform;if(!f.t.trim()){toast('Add a title first');return}if(!f.cl.length){toast('Pick at least one class');return}
 f.cl.forEach(c=>mk({sub:f.sub,cl:c,t:f.t.trim(),d:f.d||'See your copy.',asg:TODAY,due:f.due,ty:f.ty,marks:f.gr?+f.marks||10:0,late:f.late,files:f.files.slice(),by:TEACHER.n,nw:1,status:mode==='draft'?'draft':'active'}));
 hf.t=mode==='draft'?'draft':'active';close();toast(mode==='draft'?'Saved as draft. Not visible to parents yet':'✓ Assigned to '+f.cl.join(', ')+' · parents and students notified'+(f.wa?' (app + WhatsApp)':''));render()}
/* ---------- parent / student module ---------- */
function mine(){const k=kidRec();return HW.filter(h=>h.status==='active'&&h.cl===k.c)}
const bucket=h=>{const s=stf(h,kidRec().n);return['pend','miss'].includes(s)?'todo':['sub','late'].includes(s)?'sub':'gr'};
function pmod(){const k=kidRec(),L=mine(),isP=R==='parent',cnts={todo:0,sub:0,gr:0};L.forEach(h=>cnts[bucket(h)]++);
 const subs=[...new Set(L.map(h=>h.sub))],od=L.filter(h=>stf(h,k.n)==='miss').length,soon=L.filter(h=>stf(h,k.n)==='pend'&&diff(h.due)<=2).length;
 const days=[0,2,3,4,5,6].map(n=>{const d=pd(TODAY);d.setDate(d.getDate()+n);return key(d)});
 let F=L.filter(h=>(ps.sub==='all'||h.sub===ps.sub)&&(ps.tab==='all'||bucket(h)===ps.tab)).sort((a,b)=>(stf(a,k.n)==='miss'?-1:0)-(stf(b,k.n)==='miss'?-1:0)||(a.due<b.due?-1:1));
 const card=h=>{const s=stf(h,k.n),r=h.st[k.n],c=sc(h.sub);return '<div class="hi" style="--k:'+c+'" data-hwv="'+h.id+'"><div class="si">'+(SUBI[h.sub]||'•')+'</div><div class="mid"><h4>'+eh(h.t)+(h.nw?' <span class="pill g">New</span>':'')+'</h4><div class="mt">'+h.sub+' · '+h.by+' · Due '+ds(h.due)+' ('+dueTxt(h)+')</div><p class="ex">'+eh(h.d.length>90?h.d.slice(0,90)+'…':h.d)+'</p><div class="chs">'+hpill(s)+(s==='gr'?'<span class="pill g">'+r.m+'/'+h.marks+'</span>':h.marks?'<span class="pill n">'+h.marks+' marks</span>':'')+(h.files.length?'<span class="pill n">📎 '+h.files.length+'</span>':'')+(isP&&r.seen?'<span class="pill n">👁 Seen</span>':'')+'</div></div><div class="a">'+(isP?(r.seen?'':'<button class="btn sm" data-hwseen="'+h.id+'">Mark seen</button>'):(s==='pend'||s==='miss'?'<button class="btn p sm" data-hwv="'+h.id+'">Submit</button>':''))+'</div></div>'};
 $('hwm').innerHTML='<div class="hd"><div><h1>Homework</h1><p class="sub">'+(isP?'Everything your child needs to do, subject by subject.':'Your homework, subject by subject. Hand it in here.')+'</p></div>'+(isP?'<div class="seg">'+Object.keys(CHILD).map(x=>'<button data-kid="'+x+'" class="'+(kid===x?'on':'')+'">'+CHILD[x].n+' · '+CHILD[x].c+'</button>').join('')+'</div>':'<span class="pill p">'+k.n+' · Grade '+k.c+'</span>')+'</div>'+
 '<section class="kp"><div><small>Overdue</small><b'+(od?' style="color:var(--bad)"':'')+'>'+od+'</b></div><div><small>Due in 2 days</small><b>'+soon+'</b></div><div><small>To do</small><b>'+cnts.todo+'</b></div><div><small>Handed in or graded</small><b>'+(cnts.sub+cnts.gr)+'</b></div></section>'+
 '<h3 style="margin:6px 0 8px">This week</h3><div class="ws">'+days.map(d=>'<div class="'+(d===TODAY?'tdy':'')+'"><h5>'+ds(d)+(d===TODAY?' · today':'')+'</h5>'+L.filter(h=>h.due===d).map(h=>'<span class="w" style="--k:'+sc(h.sub)+'">'+h.sub.replace('General Science','Science')+'</span>').join('')+'</div>').join('')+'</div>'+
 '<h3 style="margin:6px 0 8px">By subject</h3><div class="gc" style="margin-bottom:14px"><div class="st'+(ps.sub==='all'?' on':'')+'" style="--k:var(--acc)" data-hwsub="all"><b>All subjects</b><span>'+(cnts.todo)+' to do</span></div>'+subs.map(s=>{const q=L.filter(h=>h.sub===s),t=q.filter(h=>bucket(h)==='todo'),nx=t.sort((a,b)=>a.due<b.due?-1:1)[0];return '<div class="st'+(ps.sub===s?' on':'')+'" style="--k:'+sc(s)+'" data-hwsub="'+s+'"><b>'+(SUBI[s]||'')+' '+s+'</b><span>'+q[0].by+'</span><span>'+(t.length?'<b style="color:'+(t.some(h=>stf(h,k.n)==='miss')?'var(--bad)':'var(--ink)')+'">'+t.length+' to do</b> · next '+dshort(nx.due):'✓ All done')+'</span></div>'}).join('')+'</div>'+
 '<div class="fb">'+[['todo','To do'],['sub','Submitted'],['gr','Graded'],['all','All']].map(t=>'<button class="fc'+(ps.tab===t[0]?' on':'')+'" data-hwt="'+t[0]+'">'+t[1]+(t[0]!=='all'?' ('+L.filter(h=>(ps.sub==='all'||h.sub===ps.sub)&&bucket(h)===t[0]).length+')':'')+'</button>').join('')+'</div>'+(F.length?F.map(card).join(''):'<div class="msg">✓ Nothing here. '+(ps.tab==='todo'?'You are all caught up.':'')+'</div>')}
function pdet(id){const h=HW.find(x=>x.id===+id),k=kidRec(),s=stf(h,k.n),r=h.st[k.n],isP=R==='parent',c=sc(h.sub);subFiles=[];
 const tl=[['Assigned by '+h.by+' · '+ds(h.asg),1],['Parent saw it',r.seen],[(s==='late'?'Handed in late':'Handed in'),['sub','late','gr'].includes(s)],['Graded'+(s==='gr'?' · '+r.m+' / '+h.marks:''),s==='gr']];
 open('<div class="chs" style="margin-top:6px"><span class="tag" style="--k:'+c+'">'+(SUBI[h.sub]||'')+' '+h.sub+'</span>'+hpill(s)+'</div><h3 style="font-size:20px;margin:8px 0 4px">'+eh(h.t)+'</h3><div class="sub">Due '+ds(h.due)+' ('+dueTxt(h)+') · '+(h.marks?h.marks+' marks':'Not graded')+' · '+h.ty+'</div><div class="msg">'+eh(h.d)+(h.files.length?'<div class="acts">'+h.files.map(f=>'<button class="btn sm" data-t="Downloading '+f+'">📎 '+f+'</button>').join('')+'</div>':'')+'</div>'+
 (r.fb?'<div class="okm">💬 '+h.by+': '+eh(r.fb)+'</div>':'')+'<div class="tl">'+tl.map(x=>'<div class="'+(x[1]?'':'off')+'">'+x[0]+'</div>').join('')+'</div>'+
 (isP?'<div class="acts">'+(r.seen?'':'<button class="btn p" data-hwseen="'+h.id+'">Mark as seen</button>')+'<button class="btn" data-t="Message sent to '+h.by+'">Message teacher</button>'+(s==='pend'||s==='miss'?'<button class="btn" data-t="Extension request sent to '+h.by+'">Ask for more time</button>':'')+'</div>':
 (s==='pend'||(s==='miss'&&h.late)?'<div class="fl" style="margin-top:12px"><label>Your answer or note<textarea id="ans" placeholder="Type here or attach a photo of your copy"></textarea></label><div><button class="btn sm" data-hwatt="1">📷 Attach photo of copy</button> <span class="sub" id="afs">No file</span></div></div><div class="acts"><button class="btn p" data-hwhand="'+h.id+'">'+(s==='miss'?'Hand in late':'Hand in')+'</button><button class="btn" data-t="Message sent to '+h.by+'">Ask a question</button></div>':s==='miss'?'<div class="wn">This homework no longer accepts late hand-ins. Talk to '+h.by+'.</div>':'<div class="acts"><button class="btn" data-t="Message sent to '+h.by+'">Ask a question</button></div>')))}
/* ---------- events ---------- */
function setRole(r){R=r;close();if(r==='teacher'){st.tab='hw';hf={t:'active',cl:'all'}}if(r==='admin'){st.tab='hw';hf={t:'active',cl:'all'}}ps={tab:'todo',sub:'all'};render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const g=q=>e.target.closest(q);let o;
 if(o=g('[data-role]')){setRole(o.dataset.role);return}
 if(g('[data-hwnew]')){newForm();formUI();return}
 if(o=g('[data-hwsave]')){saveHW(o.dataset.hwsave);return}
 if(g('[data-hwfile]')){hform.files.push(['Page_'+(hform.files.length+1)+'.pdf','Worksheet.pdf','Notes.jpg'][hform.files.length%3]);formUI();return}
 if(o=g('[data-hwf]')){hf.t=o.dataset.hwf;close();render();return}
 if(g('[data-hwpol]')){document.getElementById('pol')?.scrollIntoView({behavior:'smooth'});return}
 if(o=g('[data-hwpub]')){const h=HW.find(x=>x.id===+o.dataset.hwpub);h.status='active';h.nw=1;h.asg=TODAY;hf.t='active';close();toast('✓ Assigned · parents and students notified');render();return}
 if(o=g('[data-hwdel]')){HW=HW.filter(x=>x.id!==+o.dataset.hwdel);close();toast('Homework deleted');render();return}
 if(o=g('[data-hwrem]')){const h=HW.find(x=>x.id===+o.dataset.hwrem),c=cnt(h);toast('Reminder sent to '+(c.pend+c.miss)+' students and their parents');return}
 if(o=g('[data-hwa]')){const h=HW.find(x=>x.id===+o.dataset.h),n=o.dataset.n,r=h.st[n],a=o.dataset.hwa;
  if(a==='recv')r.s='sub';else if(a==='exc')r.s='exc';else if(a==='reopen'){r.s='sub';r.m=null}
  else if(a==='grade'){const i=document.getElementById('m_'+n.replace(/ /g,'_')),v=i?+i.value:NaN;if(isNaN(v)||v<0||v>h.marks){toast('Enter marks between 0 and '+h.marks);return}r.s='gr';r.m=v;r.fb=r.fb||''}
  hwDet(h.id);hwHead();$('body').innerHTML={sch:sched,cw:cw,hw:hwTab,rs:rs,rc:rc}[st.tab]();return}
 if(o=g('[data-hwo]')){hwDet(o.dataset.hwo);return}
 if(o=g('[data-kid]')){kid=o.dataset.kid;ps={tab:'todo',sub:'all'};render();return}
 if(o=g('[data-hwsub]')){ps.sub=o.dataset.hwsub;render();return}
 if(o=g('[data-hwt]')){ps.tab=o.dataset.hwt;render();return}
 if(o=g('[data-hwseen]')){const h=HW.find(x=>x.id===+o.dataset.hwseen);h.st[kidRec().n].seen=true;toast('Marked as seen. Teacher can see this');close();render();return}
 if(g('[data-hwatt]')){subFiles.push('Photo_of_copy.jpg');document.getElementById('afs').textContent='📷 '+subFiles.join(', ');return}
 if(o=g('[data-hwhand]')){const h=HW.find(x=>x.id===+o.dataset.hwhand),r=h.st[kidRec().n],late=h.due<TODAY;r.s=late?'late':'sub';close();toast(late?'Handed in late. Your teacher will see it':'✓ Handed in. Well done!');render();return}
 if(o=g('[data-hwv]')){pdet(o.dataset.hwv);return}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.hwcl){hf.cl=t.value;render();return}
 if(t.dataset.pol){const k=t.dataset.pol;if(k==='lim')LIMIT=+t.value;else if(k==='wk')POL.wk=+t.value;else if(k==='late')POL.late=t.value;else POL[k]=t.checked;toast('Policy updated');render();return}
 if(t.dataset.hfc){const a=hform.cl,c=t.dataset.hfc;hform.cl=t.checked?a.concat(c):a.filter(x=>x!==c);formUI();return}
 if(t.dataset.hf){hform[t.dataset.hf]=t.value;formUI();return}
 if(t.dataset.hfk){hform[t.dataset.hfk]=t.checked;formUI()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.hfi)hform[t.dataset.hfi]=t.value});

render();
