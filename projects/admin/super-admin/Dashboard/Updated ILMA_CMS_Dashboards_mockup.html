<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ILMA CMS · Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#14162b;--mut:#646a8c;--line:#e8eaf3;--hov:#f7f7fd;--acc:#6c4cf1;--accs:#efeaff;--ok:#0f8a66;--oks:#e3f7ef;--warn:#a85a05;--warns:#fff3dc;--bad:#d9362b;--bads:#fdebec;--blue:#2a63d4;--blues:#e6efff;
--shadow:0 1px 2px rgba(20,22,43,.05),0 8px 24px rgba(20,22,43,.06);--glow:radial-gradient(900px 300px at 20% -10%,rgba(108,76,241,.10),transparent),radial-gradient(700px 260px at 100% 0,rgba(255,140,120,.08),transparent)}
:root[data-theme=dark]{--bg:#0d1022;--card:#161a35;--ink:#eceefc;--mut:#9ba1c8;--line:#262b4d;--hov:#1b2040;--accs:#2a2458;--ok:#4fd1a5;--oks:#0f3a2e;--warn:#f4b25c;--warns:#3d2e10;--bad:#ff8a80;--bads:#41191c;--blue:#8ab4ff;--blues:#1a2b52;--glow:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1022;--card:#161a35;--ink:#eceefc;--mut:#9ba1c8;--line:#262b4d;--hov:#1b2040;--accs:#2a2458;--ok:#4fd1a5;--oks:#0f3a2e;--warn:#f4b25c;--warns:#3d2e10;--bad:#ff8a80;--bads:#41191c;--blue:#8ab4ff;--blues:#1a2b52;--glow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:none;position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#1a2152,#12172f 60%);color:#c9cdf0;padding:16px 14px;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;color:#fff;font-weight:800;padding:4px 6px 16px}
.brand i{width:38px;height:38px;border-radius:11px;background:#0b0f26;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal}
.brand small{display:block;font-weight:500;font-size:11.5px;color:#8c91c4}
.nv{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:3px;border-radius:12px;color:#c9cdf0;font-weight:600;cursor:pointer}
.nv:hover{background:rgba(255,255,255,.07)}.nv.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.nv b{margin-left:auto;background:#e5484d;color:#fff;font-size:11px;border-radius:99px;padding:0 7px}
.nv .ch{margin-left:auto;font-size:11px;opacity:.7}
.sub1{padding-left:18px;margin-bottom:6px}.sub1 .nv{font-size:13.5px;padding:7px 12px;font-weight:500}.sub1 .nv.on{box-shadow:none;background:rgba(108,76,241,.35)}
.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:14px 4px 4px;display:flex;gap:10px;align-items:center;color:#fff;font-size:13.5px;font-weight:700}
.me small{display:block;color:#8c91c4;font-weight:500}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none;background:hsl(var(--h,260) 52% 46%)}
.av.s{width:26px;height:26px;font-size:10px}
.col{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--mut)}
select,.in{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 12px;min-width:0}
.in{width:100%}textarea.in{min-height:84px;resize:vertical}
.sp{flex:1}
.bell{position:relative;border:0;border-radius:14px;height:42px;width:42px;color:#fff;background:linear-gradient(135deg,#ffb020,#ff5e7a);box-shadow:0 8px 20px rgba(255,110,100,.35);font-size:18px}
.bell b{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;font-size:10.5px;border-radius:99px;padding:1px 6px;border:2px solid var(--card)}
main{padding:24px 28px 60px;background:var(--glow);min-height:calc(100vh - 66px)}
.hd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.hd>div:first-child{flex:1;min-width:240px;border-left:3px solid var(--acc);padding-left:16px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}h2{margin:0;font-size:20px}h3{margin:0;font-size:16px}
.sub{margin:2px 0 0;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center;transition:transform .15s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,#6c4cf1,#5b43d6);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(108,76,241,.3)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{color:var(--bad)}.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 16px;box-shadow:var(--shadow);text-align:left;width:100%}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em}.kpi span{color:var(--mut);font-size:13px}
button.kpi:hover{border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:6px;min-height:168px}
.tile:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 14px 34px rgba(108,76,241,.18)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:hsl(var(--h) 80% 94%)}
:root[data-theme=dark] .tile .ic{background:hsl(var(--h) 40% 22%)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tile .ic{background:hsl(var(--h) 40% 22%)}}
.tile h3{margin-top:6px}.tile p{margin:0;color:var(--mut);font-size:13.5px;flex:1}
.tile .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile .n{position:absolute;top:16px;right:16px;background:#e5484d;color:#fff;font-weight:800;font-size:12px;border-radius:99px;padding:1px 9px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--hov);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warns);color:var(--warn);border-color:transparent}.pill.bad{background:var(--bads);color:var(--bad);border-color:transparent}.pill.acc{background:var(--accs);color:var(--acc);border-color:transparent}.pill.blue{background:var(--blues);color:var(--blue);border-color:transparent}
.att{display:flex;flex-direction:column;gap:2px}
.att button{display:flex;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:10px 8px;border-radius:12px;border-bottom:1px solid var(--line)}
.att button:hover{background:var(--hov)}.att span{flex:1}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.45);z-index:40;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:75vw;min-width:min(760px,100vw);background:var(--bg);z-index:41;box-shadow:-24px 0 60px rgba(10,12,30,.35);display:flex;flex-direction:column;animation:slide .25s ease;border-left:1px solid var(--line)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}}
.dhd{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dhd h2{flex:1;display:flex;gap:10px;align-items:center}
.dbd{padding:20px 24px 60px;overflow:auto;flex:1}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--accs);color:var(--acc)}.tabs button i{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:700;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--hov);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--hov)}
tr.grp td{background:var(--hov);font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
td.done .tt{text-decoration:line-through;color:var(--mut)}
td small{display:block;color:var(--mut);font-size:12.5px}
td .tt{font-weight:700}
.cb{width:20px;height:20px;accent-color:var(--acc);cursor:pointer}
.ra{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
td select{padding:5px 8px;font-size:13px;border-radius:8px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--mut)}
.fld select,.fld .in{font-weight:500;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.trow:last-child{border-bottom:0}.trow>div:first-child{flex:1}.trow small{display:block;color:var(--mut)}
.sw{position:relative;width:42px;height:24px;flex:none;display:inline-block}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:var(--acc)}.sw input:checked+i::after{left:21px}
.qa{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px;align-items:center}
.qa .in{flex:1;min-width:180px}
.prog{height:8px;background:var(--hov);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:80px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#6c4cf1,#8b6cff)}
.bal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.bal div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.bal b{font-size:22px}.bal span{display:block;color:var(--mut);font-size:13px}
.info{background:var(--blues);color:var(--blue);border-radius:12px;padding:10px 14px;font-size:13.5px;margin:0 0 12px}
.thr{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{display:flex;gap:10px}.msg .bd{background:var(--hov);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px}.msg .hh{font-size:12px;color:var(--mut);font-weight:700}
.msg.me{flex-direction:row-reverse}.msg.me .bd{background:var(--accs);border-color:transparent;border-radius:14px 4px 14px 14px}
.an{border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.an.urgent{border-left-color:var(--bad);background:linear-gradient(90deg,var(--bads),var(--card) 40%)}
.an h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.an p{margin:6px 0 10px;white-space:pre-wrap}
.un{font-weight:800}.unread td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
dialog{border:0;border-radius:22px;padding:0;width:min(620px,94vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(10,12,30,.4)}
dialog::backdrop{background:rgba(10,12,30,.55)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}.mh h3{flex:1}.mh button{border:0;background:var(--hov);width:34px;height:34px;border-radius:10px}
.mb{padding:18px 22px;max-height:66vh;overflow:auto}.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;pointer-events:none}
#toast div{background:#12172f;color:#fff;padding:11px 18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-weight:600;font-size:14px;animation:slide .2s}
.pop{position:absolute;right:28px;top:60px;width:380px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(20,22,43,.25);padding:10px;z-index:30}
.pop h4{margin:6px 8px 8px}.pop button.ni{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:12px}.pop button.ni:hover{background:var(--hov)}.pop small{display:block;color:var(--mut)}
@media(max-width:1100px){.drawer{width:92vw}}
@media(max-width:900px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;align-items:center}.me,.sub1,.brand small{display:none}.brand{padding:0 8px 0 4px}.nv{width:auto;white-space:nowrap;margin:0}
.top{padding:10px 14px}main{padding:18px 14px 60px}.drawer{width:100vw;min-width:0}.dbd{padding:14px 12px 60px}.g2,.g3{grid-template-columns:1fr}.pop{right:10px}}

.scope{display:inline-flex;gap:8px;align-items:center;background:var(--accs);color:var(--acc);font-weight:800;font-size:13px;border-radius:99px;padding:5px 14px}
.seg{display:inline-flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--acc);color:#fff}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;width:100%;transition:.15s;display:block}
.k:hover{border-color:var(--acc);transform:translateY(-2px)}.k span{color:var(--mut);font-size:13px;font-weight:600}.k b{display:block;font-size:28px;letter-spacing:-.02em;margin:2px 0}
.k .dl{font-size:12.5px;font-weight:800}.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--mut)}
.k svg{float:right;margin-top:6px}
.k .prog{margin-top:8px}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:16px}
.hl button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.hl button:hover{border-color:var(--acc)}.hl i{font-style:normal;font-size:22px}.hl small{display:block;color:var(--mut)}
.g{display:grid;gap:16px;margin-bottom:16px}.g.c2{grid-template-columns:1.4fr 1fr}.g.c3{grid-template-columns:repeat(3,1fr)}.g.e2{grid-template-columns:1fr 1fr}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:4px}.card h3 .sp{flex:1}.card .sub{margin-bottom:12px}
.hm{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:13.5px}.hm th{background:none;border:0;padding:4px 8px}
.hm td{padding:8px 10px;border:0;background:var(--hov)}.hm td:first-child{border-radius:10px 0 0 10px;font-weight:800}.hm td:last-child{border-radius:0 10px 10px 0}
.hm tr.clk{cursor:pointer}.hm tr.clk:hover td{outline:0;filter:brightness(.97)}
.c-g{background:var(--oks)!important;color:var(--ok)}.c-w{background:var(--warns)!important;color:var(--warn)}.c-r{background:var(--bads)!important;color:var(--bad)}
.hm td b{font-weight:800}.hm td small{display:block;font-weight:600;font-size:11.5px;opacity:.85}
.leg{display:flex;gap:12px;font-size:12.5px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.hz{display:grid;gap:4px}.hz div{border-radius:8px;padding:8px 6px;text-align:center;font-size:12.5px;font-weight:800}.hz .h{background:none;color:var(--mut);font-weight:700;padding:2px}.hz .rl{background:none;text-align:left;color:var(--ink);padding:8px 2px}
.bars{display:flex;flex-direction:column;gap:12px}.bars .r{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:13.5px}.bars .t{height:12px;background:var(--hov);border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}.bars .t i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#6c4cf1,#8b6cff)}.bars .t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.fn{display:flex;flex-direction:column;gap:6px}.fn div{border-radius:10px;padding:9px 14px;color:#fff;font-weight:800;display:flex;justify-content:space-between;background:linear-gradient(90deg,#6c4cf1,#8b6cff)}
.att2{display:flex;flex-direction:column}.att2 button{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:10px}.att2 button:hover{background:var(--hov)}.att2 button>span:nth-child(2){flex:1}.att2 small{display:block;color:var(--mut)}
.qa2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.qa2 button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-weight:800;text-align:left;display:flex;gap:10px;align-items:center}.qa2 button:hover{border-color:var(--acc);background:var(--accs)}
.ev{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.ev:last-child{border:0}.ev .d{width:46px;text-align:center;background:var(--accs);color:var(--acc);border-radius:12px;padding:4px;font-weight:800;line-height:1.1}.ev .d small{display:block;font-size:10.5px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--blues);color:var(--blue);border-radius:14px;padding:10px 16px;margin-bottom:16px;font-weight:700}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.ch text{font-family:inherit}
@media(max-width:1100px){.g.c2,.g.c3,.g.e2{grid-template-columns:1fr}}
@media(max-width:1100px){.kp{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.kp{grid-template-columns:1fr}}.hm{min-width:820px}.card>.tw{overflow:auto}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div class="col">
 <div class="top">
  <label>View as<select id="role"><option value="super">Super Admin · all branches</option><option value="admin">Admin · single branch</option></select></label>
  <label id="abl" hidden>Admin of<select id="abr"></select></label>
  <div class="sp"></div>
  <button class="btn sm" id="theme">◐ Light / Dark</button>
  <button class="bell" id="bell" aria-label="Notifications">🔔<b>5</b></button>
 </div>
 <main id="main"></main>
</div>
</div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),2600)};
const pill=(t,k='')=>`<span class="pill ${k}">${t}</span>`;
const f1=n=>(Math.round(n*10)/10).toFixed(1),f0=n=>Math.round(n).toLocaleString('en-US'),M=n=>'Rs '+f1(n)+'M';
const BR=[
 {id:'lhr',n:'Lahore Main',c:'#6c4cf1',st:1240,att:94.2,pa:93.1,col:8.4,tg:9.5,res:78,pr:76,sp:96,lv:4,tk:5,df:112,adm:18,ap:3,od:6},
 {id:'gul',n:'Gulberg Campus',c:'#0f9d8a',st:860,att:92.0,pa:92.4,col:5.9,tg:6.2,res:74,pr:75,sp:94,lv:6,tk:3,df:64,adm:11,ap:2,od:3},
 {id:'isb',n:'Islamabad',c:'#d98a1c',st:720,att:95.6,pa:95.0,col:5.1,tg:5.0,res:81,pr:79,sp:97,lv:2,tk:1,df:31,adm:14,ap:1,od:1},
 {id:'khi',n:'Karachi',c:'#d9362b',st:610,att:88.3,pa:92.4,col:3.6,tg:4.8,res:69,pr:71,sp:89,lv:8,tk:9,df:141,adm:5,ap:4,od:11}];
const RG={today:{n:'Today',d:7,f:.05},week:{n:'This week',d:14,f:.25},term:{n:'This term',d:30,f:1}};
const S={role:'super',scope:'all',range:'week',adminBr:'lhr'};
const sc=()=>S.role==='admin'?S.adminBr:S.scope;
const br=id=>BR.find(b=>b.id===id);
const sum=(k,l=BR)=>l.reduce((a,b)=>a+b[k],0);
const wavg=(k,l=BR)=>l.reduce((a,b)=>a+b[k]*b.st,0)/sum('st',l);
/* status rules */
const ST={att:v=>v>=93?'g':v>=90?'w':'r',fee:v=>v>=.95?'g':v>=.85?'w':'r',res:v=>v>=75?'g':v>=70?'w':'r',sp:v=>v>=95?'g':v>=92?'w':'r',tk:v=>v<=3?'g':v<=6?'w':'r',od:v=>v<=3?'g':v<=7?'w':'r',df:v=>v<=5?'g':v<=10?'w':'r'};
const sx={g:'● Good',w:'▲ Watch',r:'✖ Act'};
const cell=(t,s,sub)=>`<td class="c-${s}"><b>${t}</b><small>${sx[s]}${sub?' · '+sub:''}</small></td>`;
const dfp=b=>b.df/b.st*100;
const score=b=>{const l=[ST.att(b.att),ST.fee(b.col/b.tg),ST.res(b.res),ST.sp(b.sp),ST.tk(b.tk),ST.od(b.od),ST.df(dfp(b))];return l.reduce((a,x)=>a+(x==='g'?2:x==='w'?1:0),0)};
/* series */
function series(b,N){const o=[];for(let i=0;i<N;i++){const t=i/(N-1);let v=b.pa+(b.att-b.pa)*Math.pow(t,b.id==='khi'?3:1.5)+Math.sin(i*1.7+b.st)*0.7;if(b.id==='khi'&&t>.8)v-=2.4*(t-.8)*5/1.2;o.push(Math.max(80,Math.min(99.5,v)))}o[N-1]=b.att;return o}
const spark=(arr,c)=>{const mn=Math.min(...arr),mx=Math.max(...arr),w=70,h=26;const p=arr.map((v,i)=>[i/(arr.length-1)*w,h-(v-mn)/((mx-mn)||1)*(h-4)-2]);return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`};
const sp=(base,up)=>{const a=[];for(let i=0;i<10;i++)a.push(base+(up?i*.4:-i*.2)+Math.sin(i*2)*0.6);return a};
function lineChart(list,N){const W=680,H=250,L=40,R=120,T=14,B=28,lo=84,hi=100;const x=i=>L+i/(N-1)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Attendance trend">`;
 for(let v=84;v<=100;v+=4)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${v}%</text>`;
 s+=`<line x1="${L}" x2="${W-R}" y1="${y(93)}" y2="${y(93)}" stroke="var(--mut)" stroke-dasharray="5 4"/><text x="${L+4}" y="${y(93)-6}" font-size="11" fill="var(--mut)">Target 93%</text>`;
 const lab=[0,Math.floor(N/2),N-1];lab.forEach((i,k)=>{s+=`<text x="${x(i)}" y="${H-8}" text-anchor="${k===2?'end':k===0?'start':'middle'}" font-size="11" fill="var(--mut)">${k===2?'Today':(N-1-i)+' days ago'}</text>`});
 const ys=[];list.forEach(b=>{const a=series(b,N);let ly=y(a[N-1]);while(ys.some(q=>Math.abs(q-ly)<13))ly+=13;ys.push(ly);
  s+=`<polyline fill="none" stroke="${b.c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="${a.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/><circle cx="${x(N-1)}" cy="${y(a[N-1])}" r="4" fill="${b.c}"/><text x="${W-R+8}" y="${ly+4}" font-size="12" font-weight="700" fill="${b.c}">${esc(b.n.split(' ')[0])} ${f1(a[N-1])}%</text>`});
 return s+'</svg>'}
/* sample rows */
const CL=['Nursery','Prep','1-A','2-B','3-A','4-C','5-A','6-B','7-B','8-A','9-C','10-A'];
const cls=b=>CL.map((c,i)=>{const n=26+((i*7+b.st)%12);const a=Math.max(78,Math.min(99,b.att+Math.sin(i*2.1+b.st)*5-(b.id==='khi'&&i>7?4:0)));return{c,n,a,p:Math.round(n*a/100)}});
const NAMES=['Zain Kamran','Areeba Noor','Hamid Tariq','Eshal Zahid','Maha Imtiaz','Ahmed Raza','Sara Khan','Bilal Hussain','Hira Malik','Usman Ali','Noor Fatima','Daniyal Shah'];
/* shell */
function side(){const it=[['📊','Dashboard',1],['🎓','Students'],['👥','Staff & HR'],['📚','Academics'],['💰','Finance'],['🧰','WorkHub']];
 $('#side').innerHTML=`<div class="brand"><i>🎓</i><div>ILMA CMS<small>${S.role==='super'?'Super Admin':'Admin · '+br(S.adminBr).n}</small></div></div>`+it.map(x=>`<button class="nv ${x[2]?'on':''}" data-a="${x[2]?'home':'toast'}" data-i="${x[1]} opens in the full ILMA app">${x[0]} ${x[1]}</button>`).join('')+
 `<button class="nv" data-a="toast" data-i="Reports & Analytics opens here: Overview, Analytics, Reports, Scheduled">📈 Reports & Analytics</button>${S.role==='super'?`<button class="nv" data-a="toast" data-i="Branches opens in the full ILMA app">🏫 Branches</button>`:''}<button class="nv" data-a="toast" data-i="Settings opens in the full ILMA app">⚙️ Settings</button>
 <div class="me"><span class="av" style="--h:${S.role==='super'?290:200}">${S.role==='super'?'AM':'SI'}</span><div>${S.role==='super'?'Dr. Ayesha Malik':'Ms. Sana Iqbal'}<small>${S.role==='super'?'Super Admin · all branches':'Admin · '+br(S.adminBr).n}</small></div></div>`}
function head(){const id=sc(),b=id==='all'?null:br(id);
 const sel=S.role==='super'?`<select id="scope" aria-label="Branch"><option value="all" ${id==='all'?'selected':''}>All branches</option>${BR.map(x=>`<option value="${x.id}" ${id===x.id?'selected':''}>${x.n}</option>`).join('')}</select>`:'';
 return `<div class="hd"><div><h1>Good afternoon, ${S.role==='super'?'Dr. Ayesha':'Ms. Sana'}</h1><p class="sub"><span class="scope">${S.role==='admin'?'🔒':'👁'} Viewing: ${b?b.n:'All branches ('+BR.length+')'}</span> &nbsp;Thursday 15 October 2026</p></div>
 ${sel}<div class="seg" role="group" aria-label="Range">${Object.entries(RG).map(([k,v])=>`<button class="${S.range===k?'on':''}" data-a="range" data-i="${k}">${v.n}</button>`).join('')}</div><button class="btn" data-a="toast" data-i="Dashboard PDF downloaded (demo)">⬇ Export</button></div>
 ${S.role==='super'&&b?`<div class="banner">🏫 You are looking at ${b.n} only. <button class="btn sm" data-a="all">← Back to all branches</button><span class="sp"></span><span style="font-weight:600">Admins of this branch see exactly this view.</span></div>`:''}`}
function kpi(k,l,v,d,dc,spk,col,extra){return `<button class="k" data-a="drill" data-i="${k}"><span>${l}</span>${spk?spk:''}<b>${v}</b><span class="dl ${dc}">${d}</span>${extra||''}</button>`}
function kpis(){const id=sc(),L=id==='all'?BR:[br(id)],f=RG[S.range].f,n=L.length>1;
 const st=sum('st',L),att=wavg('att',L),pa=wavg('pa',L),col=sum('col',L)*f,tg=sum('tg',L)*f,res=wavg('res',L),sp_=wavg('sp',L),lv=sum('lv',L);
 const ds=(v,p,u='pts')=>{const d=v-p;return `${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)} ${u} vs last week`};
 const k=[kpi('students','Students',f0(st),'▲ 2.1% vs last term','up',spark(sp(8,1),'#6c4cf1')),
  kpi('att','Attendance today',f1(att)+'%',ds(att,pa),att>=pa?'up':'dn',spark(sp(att-2,1),'#0f8a66')),
  kpi('fee','Fees collected',M(col),`${Math.round(col/tg*100)}% of ${M(tg)} target`,col/tg>=.9?'up':'dn','',0,`<div class="prog"><i style="width:${Math.min(100,col/tg*100)}%"></i></div>`),
  kpi('res','Average result',f1(res)+'%','▲ 1.2 pts vs last term','up',spark(sp(res-4,1),'#6c4cf1')),
  kpi('staff','Staff present',f1(sp_)+'%',lv+' on leave today',sp_>=94?'fl':'dn',spark(sp(sp_-3,1),'#6c4cf1')),
  kpi('tk','Open tickets',sum('tk',L),sum('od',L)+' overdue tasks',sum('tk',L)>8?'dn':'fl'),
  kpi('ap','Awaiting approval',sum('ap',L),'Needs the Principal','fl'),
  kpi('adm','Admissions (Oct)',sum('adm',L),'▲ 4 vs Sept','up')];
 return `<div class="kp">${k.join('')}</div>`}
function heads(){const id=sc();let l;
 if(id==='all')l=[['⚠️','Karachi attendance fell to 88.3%','Lowest in the network, down 4.1 pts this week.','att','khi'],['💰','Fee recovery is 91% network-wide','Karachi is Rs 1.2M behind target.','fee','khi'],['🏆','Islamabad leads on results and staff attendance','81% average result, 97% staff present.','res','isb']];
 else{const b=br(id),c=cls(b).sort((a,z)=>a.a-z.a)[0];l=[[b.att<93?'⚠️':'✅','Attendance is '+f1(b.att)+'% today',b.att<93?'Below the 93% target.':'Above the 93% target.','att',id],['📉','Lowest class: '+c.c+' at '+f1(c.a)+'%','Tap to see absent students.','att',id],['💰',f0(b.df)+' families have overdue fees',''+(b.tg>b.col?'Rs '+f1(b.tg-b.col)+'M still to collect.':'Fee target exceeded.'),'fee',id]]}
 return `<div class="hl">${l.map(x=>`<button data-a="drill" data-i="${x[3]}"><i>${x[0]}</i><span><b>${x[1]}</b><small>${x[2]}</small></span></button>`).join('')}</div>`}
function heat(){const rows=[...BR].sort((a,b)=>score(b)-score(a));
 return `<div class="card"><h3>Branch health</h3><p class="sub">Every branch against the same targets. Click a row to open that branch.</p><div class="tw" style="border:0"><table class="hm"><thead><tr><th>#</th><th>Branch</th><th>Students</th><th>Attendance</th><th>Fee recovery</th><th>Avg result</th><th>Staff present</th><th>Open tickets</th><th>Overdue tasks</th><th>Overall</th></tr></thead><tbody>
 ${rows.map((b,i)=>{const o=score(b),os=o>=11?'g':o>=7?'w':'r';return `<tr class="clk" data-a="branch" data-i="${b.id}"><td>${i+1}</td><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${b.c};margin-right:8px"></span><b>${b.n}</b></td><td><b>${f0(b.st)}</b></td>${cell(f1(b.att)+'%',ST.att(b.att))}${cell(Math.round(b.col/b.tg*100)+'%',ST.fee(b.col/b.tg))}${cell(b.res+'%',ST.res(b.res))}${cell(b.sp+'%',ST.sp(b.sp))}${cell(b.tk,ST.tk(b.tk))}${cell(b.od,ST.od(b.od))}<td class="c-${os}"><b>${o}/14</b><small>${sx[os]}</small></td></tr>`}).join('')}</tbody></table></div>
 <div class="leg"><span>● Good = on target</span><span>▲ Watch = close to target</span><span>✖ Act = needs help</span><span>Colour is always paired with a label.</span></div></div>`}
function attention(){const id=sc();const L=id==='all'?BR:[br(id)];const it=[];
 L.forEach(b=>{const tag=id==='all'?pill(b.n.split(' ')[0],'acc'):'';
  if(ST.att(b.att)==='r')it.push([3,'📉',`Attendance ${f1(b.att)}% is below 90%`,'Call class teachers',tag,'att',b.id]);
  if(ST.df(dfp(b))==='r')it.push([3,'💳',`${b.df} families overdue on fees`,'Send reminders',tag,'fee',b.id]);
  if(ST.od(b.od)==='r')it.push([2,'⏰',`${b.od} tasks overdue`,'Open WorkHub',tag,'tk',b.id]);
  if(ST.tk(b.tk)!=='g')it.push([ST.tk(b.tk)==='r'?3:1,'🛠️',`${b.tk} open tickets`,'Open Helpdesk',tag,'tk',b.id]);
  if(b.ap)it.push([2,'🧾',`${b.ap} approvals waiting`,'Review',tag,'ap',b.id]);
  if(ST.sp(b.sp)==='r')it.push([2,'👥',`Staff attendance ${b.sp}%, ${b.lv} on leave`,'View staff',tag,'staff',b.id])});
 it.sort((a,b)=>b[0]-a[0]);
 return `<div class="card"><h3>Needs attention <span class="sp"></span>${pill(it.length,'bad')}</h3><p class="sub">Most urgent first. Each row opens the fix.</p><div class="att2">${it.slice(0,7).map(x=>`<button data-a="drill" data-i="${x[5]}" data-b="${x[6]}"><span style="font-size:20px">${x[1]}</span><span><b>${x[2]}</b><small>${x[3]}</small></span>${x[4]}<span>${pill(x[0]===3?'Urgent':x[0]===2?'Soon':'Watch',x[0]===3?'bad':x[0]===2?'warn':'blue')}</span></button>`).join('')}</div></div>`}
function bars(rows,fmt,tgt){return `<div class="bars">${rows.map(r=>`<div class="r"><span>${esc(r[0])}</span><div class="t"><i style="width:${Math.min(100,r[1]/r[3]*100)}%;${r[4]?'background:'+r[4]:''}"></i>${r[2]!=null?`<u style="left:${r[2]/r[3]*100}%"></u>`:''}</div><b>${fmt(r[1])}</b></div>`).join('')}</div>`}
function events(){return `<div class="card"><h3>Coming up</h3><p class="sub">Next 2 weeks</p>${[['16','Oct','Term 1 result sheets due','All branches'],['20','Oct','Parent-teacher meeting','Lahore Main'],['24','Oct','Question papers submission','Teachers'],['03','Nov','Mid-term exams begin','All branches']].map(e=>`<div class="ev"><div class="d">${e[0]}<small>${e[1]}</small></div><div><b>${e[2]}</b><div class="sub" style="margin:0">${e[3]}</div></div></div>`).join('')}</div>`}
function quick(){const a=S.role==='super'?[['➕','Add branch'],['📣','Announce to all'],['📄','Board report'],['🧾','Approvals'],['💰','Fee summary'],['🛡️','Audit log']]:[['✅','Mark attendance'],['💳','Collect fee'],['➕','Add student'],['📣','Send announcement'],['🧾','Approvals'],['🛠️','New ticket']];
 return `<div class="card"><h3>Quick actions</h3><div class="qa2" style="margin-top:10px">${a.map(x=>`<button data-a="toast" data-i="${x[1]} opens here"><span style="font-size:20px">${x[0]}</span>${x[1]}</button>`).join('')}</div></div>`}
function helpdesk(){const L=sc()==='all'?BR:[br(sc())];const W=[['IT & app',2],['Facilities',3],['Fees',4],['Academic',3],['Transport',2]],t=sum('tk',L),tw=14;let cats=W.map(c=>[c[0],Math.floor(c[1]*t/tw),(c[1]*t/tw)%1]);let rem=t-cats.reduce((x,c)=>x+c[1],0);[...cats].sort((x,y)=>y[2]-x[2]).slice(0,rem).forEach(c=>c[1]++);cats=cats.filter(c=>c[1]>0);
 return `<div class="card"><h3>Helpdesk & approvals <span class="sp"></span>${pill(t+' open','blue')}</h3><p class="sub">Complaints and tickets across WorkHub.</p>${bars(cats.map(c=>[c[0],c[1],null,Math.max(5,t),'']),v=>v)}<div class="row" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${pill(sum('ap',L)+' approvals waiting','warn')}${pill('Avg first reply 3.2h','ok')}${pill(sum('od',L)>10?'Tasks overdue '+sum('od',L):'Tasks on track',sum('od',L)>10?'bad':'ok')}</div></div>`}
/* super blocks */
function superView(){const f=RG[S.range].f,N=RG[S.range].d;
 return head()+heads()+kpis()+`<div class="g">${heat()}</div><div class="g c2">${attention()}<div class="card"><h3>Attendance trend by branch</h3><p class="sub">Daily attendance, last ${N} days. The dashed line is the 93% target.</p>${lineChart(BR,N)}</div></div>`+
 `<div class="g c2"><div class="card"><h3>Fee collection vs target</h3><p class="sub">${RG[S.range].n}. The line marks each branch's target.</p>${bars(BR.map(b=>[b.n,b.col*f,b.tg*f,Math.max(b.tg,b.col)*f*1.08,ST.fee(b.col/b.tg)==='r'?'linear-gradient(90deg,#d9362b,#ff7a6e)':'']),M)}<div class="lg" style="margin-top:14px"><span><i style="background:#6c4cf1"></i>On track</span><span><i style="background:#d9362b"></i>Behind target</span></div></div>
 <div class="card"><h3>Average result by branch</h3><p class="sub">Latest term, % average.</p>${bars(BR.map(b=>[b.n,b.res,75,100,ST.res(b.res)==='r'?'linear-gradient(90deg,#d9362b,#ff7a6e)':'']),v=>v+'%')}</div></div>
 <div class="g e2"><div class="card"><h3>Admissions funnel</h3><p class="sub">All branches, October.</p><div class="fn" style="margin-top:6px">${[['Inquiries',412,100],['School visits',238,86],['Applications',131,70],['Admitted',48,56]].map(x=>`<div style="width:${x[2]}%"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div><p class="sub" style="margin-top:10px">Conversion 11.7%. Karachi converts lowest.</p></div>
 ${helpdesk()}</div>
 <div class="g c2"><div class="card"><h3>Staff snapshot</h3><p class="sub">Who is in today.</p><div class="tw" style="border:0"><table><thead><tr><th>Branch</th><th>Staff</th><th>Present</th><th>On leave</th><th>Late</th></tr></thead><tbody>${BR.map(b=>`<tr class="clk" data-a="branch" data-i="${b.id}" style="cursor:pointer"><td><b>${b.n}</b></td><td>${Math.round(b.st/14)}</td><td>${pill(b.sp+'%',ST.sp(b.sp)==='g'?'ok':ST.sp(b.sp)==='w'?'warn':'bad')}</td><td>${b.lv}</td><td>${Math.round(b.lv/2)}</td></tr>`).join('')}</tbody></table></div></div>${events()}</div>
 ${quick()}`}
/* admin / branch blocks */
function days(){return ['Mon','Tue','Wed','Thu','Fri']}
function branchView(){const b=br(sc()),N=RG[S.range].d,f=RG[S.range].f,c=cls(b);
 const hz=`<div class="hz" style="grid-template-columns:70px repeat(5,1fr)"><div class="h"></div>${days().map(d=>`<div class="h">${d}</div>`).join('')}${c.slice(0,10).map((x,i)=>`<div class="rl">${x.c}</div>`+days().map((d,j)=>{const v=Math.max(76,Math.min(99,x.a+Math.sin(i*3+j*1.9)*3.5-(j===3?1.5:0)));const s=ST.att(v);return `<div class="c-${s}" title="${f1(v)}%">${Math.round(v)}%</div>`}).join('')).join('')}</div>`;
 const dfs=NAMES.slice(0,6).map((n,i)=>[n,CL[(i*3+2)%CL.length],Math.round((18-i*2.4))*1000,18-i*3]);
 return head()+heads()+kpis()+`<div class="g c2">${attention()}<div class="card"><h3>Attendance trend</h3><p class="sub">${b.n}, last ${N} days.</p>${lineChart([b],N)}</div></div>
 <div class="g c2"><div class="card"><h3>Class attendance this week</h3><p class="sub">Spot the classes dropping before parents call.</p>${hz}<div class="leg"><span style="color:var(--ok)">● 93% or more</span><span style="color:var(--warn)">▲ 90 to 93%</span><span style="color:var(--bad)">✖ under 90%</span></div></div>
 <div class="card"><h3>Fees</h3><p class="sub">${RG[S.range].n}: ${M(b.col*f)} of ${M(b.tg*f)}</p><div class="prog" style="height:12px;margin-bottom:14px"><i style="width:${Math.min(100,b.col/b.tg*100)}%"></i></div><h4 style="margin:0 0 6px;font-size:12px;color:var(--mut);letter-spacing:.06em">TOP OVERDUE</h4><div class="tw" style="border:0"><table><tbody>${dfs.map(d=>`<tr><td><b>${d[0]}</b><small>${d[1]}</small></td><td style="text-align:right"><b>Rs ${f0(d[2])}</b><small>${d[3]} days late</small></td></tr>`).join('')}</tbody></table></div><button class="btn sm" style="margin-top:10px" data-a="toast" data-i="Reminders sent to ${b.df} families (demo)">Send reminders to all ${b.df}</button></div></div>
 <div class="g c3"><div class="card"><h3>Results by subject</h3><p class="sub">Latest term average.</p>${bars([['English',b.res+3],['Maths',b.res-6],['Science',b.res+1],['Urdu',b.res+5],['Islamiat',b.res+8],['Computer',b.res+4]].map(r=>[r[0],r[1],75,100,'']),v=>v+'%')}</div>
 <div class="card"><h3>Staff today</h3><p class="sub">${Math.round(b.st/14)} staff · ${b.sp}% present</p>${[['Ms. Hina Raza','Casual leave'],['Mr. Omar Siddiqui','Sick leave'],['Ms. Nadia Farooq','Half-day'],['Mr. Imran Shah','Late 25 min']].slice(0,Math.max(2,Math.min(4,b.lv))).map(x=>`<div class="ev"><div><b>${x[0]}</b><div class="sub" style="margin:0">${x[1]}</div></div></div>`).join('')}<button class="btn sm" style="margin-top:8px" data-a="toast" data-i="Arrange substitutes opens here">Arrange substitutes</button></div>${helpdesk()}</div>
 <div class="g c2">${events()}${quick()}</div>`}
/* drill */
function drill(k,bid){const id=bid||sc();const T={students:'Students',att:'Attendance today',fee:'Fees',res:'Average result',staff:'Staff present',tk:'Tickets and tasks',ap:'Approvals',adm:'Admissions'}[k];
 if(id==='all'){const col={students:['Students',b=>f0(b.st)],att:['Attendance',b=>f1(b.att)+'%'],fee:['Collected / target',b=>M(b.col)+' / '+M(b.tg)],res:['Avg result',b=>b.res+'%'],staff:['Staff present',b=>b.sp+'%'],tk:['Tickets / overdue',b=>b.tk+' / '+b.od],ap:['Waiting',b=>b.ap],adm:['Admitted',b=>b.adm]}[k];
  modal(T+' by branch',`<div class="tw"><table><thead><tr><th>Branch</th><th>${col[0]}</th><th></th></tr></thead><tbody>${BR.map(b=>`<tr><td><b>${b.n}</b></td><td>${col[1](b)}</td><td><div class="ra"><button class="btn sm" data-a="branch" data-i="${b.id}">Open branch →</button></div></td></tr>`).join('')}</tbody></table></div>`);return}
 const b=br(id),c=cls(b);let tb;
 if(k==='students'||k==='att'||k==='adm'||k==='res')tb=`<table><thead><tr><th>Class</th><th>Strength</th><th>Present</th><th>Attendance</th></tr></thead><tbody>${[...c].sort((x,y)=>x.a-y.a).map(x=>`<tr><td><b>${x.c}</b></td><td>${x.n}</td><td>${x.p}</td><td>${pill(f1(x.a)+'%',ST.att(x.a)==='g'?'ok':ST.att(x.a)==='w'?'warn':'bad')}</td></tr>`).join('')}</tbody></table>`;
 else if(k==='fee')tb=`<table><thead><tr><th>Student</th><th>Class</th><th>Overdue</th><th>Late</th></tr></thead><tbody>${NAMES.map((n,i)=>`<tr><td><b>${n}</b></td><td>${CL[(i*3+2)%CL.length]}</td><td>Rs ${f0((18-i)*1000)}</td><td>${30-i*2} days</td></tr>`).join('')}</tbody></table>`;
 else tb=`<table><thead><tr><th>Item</th><th>Owner</th><th>Status</th></tr></thead><tbody>${['Projector in Lab 2|Mr. Imran|Open','Printer offline|Mr. Bilal|In progress','Leave: Ms. Hina|Ms. Sana|Pending','Fee concession|Dr. Ayesha|Pending','Weekly attendance audit|Ms. Sana|Overdue'].map(r=>r.split('|')).map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${pill(r[2],r[2]==='Overdue'?'bad':'blue')}</td></tr>`).join('')}</tbody></table>`;
 modal(T+' · '+b.n,`<div class="tw">${tb}</div>${S.role==='super'&&S.scope==='all'?`<p style="margin-top:12px"><button class="btn sm" data-a="branch" data-i="${b.id}">Open ${b.n} dashboard →</button></p>`:''}`)}
function modal(t,b){const d=$('#dlg');d.innerHTML=`<div class="mh"><h3>${t}</h3><button data-a="mc" aria-label="Close">✕</button></div><div class="mb">${b}</div><div class="mf"><button class="btn" data-a="toast" data-i="Opens the full report in Reports & Analytics">Open full report</button><button class="btn p" data-a="mc">Close</button></div>`;if(!d.open)d.showModal()}
const A={toast:a=>toast(a.dataset.i),mc:()=>$('#dlg').close(),home:()=>{S.scope='all';render()},all:()=>{S.scope='all';render()},
 range:a=>{S.range=a.dataset.i;render()},branch:a=>{if($('#dlg').open)$('#dlg').close();S.scope=a.dataset.i;render();window.scrollTo(0,0)},drill:a=>drill(a.dataset.i,a.dataset.b)};
function render(){side();$('#abl').hidden=S.role!=='admin';$('#main').innerHTML=S.role==='super'&&S.scope==='all'?superView():branchView()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;const f=A[el.dataset.a];if(f)f(el)});
document.addEventListener('change',e=>{if(e.target.id==='scope'){S.scope=e.target.value;render()}});
$('#abr').innerHTML=BR.map(b=>`<option value="${b.id}">${b.n}</option>`).join('');$('#abr').onchange=e=>{S.adminBr=e.target.value;render()};
$('#role').onchange=e=>{S.role=e.target.value;S.scope='all';render()};
$('#theme').onclick=()=>{const d=document.documentElement;const dk=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';d.dataset.theme=dk?'light':'dark'};
$('#bell').onclick=()=>toast('5 notifications: open WorkHub > Notifications');
render();
</script>
</body></html>
