 case'skip':{const u=snap(),x=L.sch.find(y=>y.s==='due'||y.s==='late');if(!x)break;x.s='skip';const last=L.sch[L.sch.length-1];L.sch.push({m:last.m+1,a:x.a,s:'up'});render();toast(`Skipped ${ml(x.m)}. One extra month added at the end.`,u);break}
 case'rsM':MD={t:'rs',id,k:Math.max(2,unp(L).length)};render();break;
 case'rsOk':{const u=snap(),b=bal(L),kk=Math.max(1,+$('rk').value||1),keep=L.sch.filter(x=>x.s==='paid'||x.s==='skip');let left=b;const ns=[];for(let i=0;i<kk;i++){const am=i===kk-1?left:Math.round(b/kk/100)*100;left-=am;ns.push({m:CM+i,a:am,s:i===0?'due':'up'})}L.sch=[...keep,...ns];MD=null;render();toast(`Rescheduled over ${kk} months`,u);break}
 case'woM':MD={t:'wo',id};render();break;
 case'woOk':{if(($('wr').value||'').trim().length<3){$('we').textContent='A reason is required.';break}const u=snap();L.wo=$('wr').value.trim();MD=null;render();toast('Loan written off',u);break}
 case'newReq':FM={emp:role==='staff'?ME:2,type:'Loan',amt:'',n:6,reason:'',att:false,pay:'cash',err:''};if(!FM.emp)FM.emp=1;render();break;
 case'rtype':FM.type=k;FM.n=Math.min(FM.n,MAXN(k));render();break;case'rpay':FM.pay=k;render();break;case'ratt':FM.att=!FM.att;render();break;
 case'rsub':{const f=FM,am=+f.amt;let er='';if(!(am>0))er='Enter an amount.';else{const bad=checks(f.emp,am,f.n).find(c=>c.s==='bad');if(bad)er=bad.t+'. Change the request or ask the office.'}if(er){FM.err=er;render();break}
  const u=snap();REQ.push({id:nid++,emp:f.emp,type:f.type,amt:am,n:f.n,reason:f.reason.trim()||'Not given',pay:f.pay==='cash'?'cash':EMP[f.emp].m,st:'requested',age:0,att:f.att,notes:[]});FM=null;tab='req';render();toast(role==='staff'?'Request sent. Waiting for '+needApr(am)+'. We will message you on WhatsApp.':'Request created. Waiting for '+needApr(am)+'.',u);break}
 case'adjOpen':AF={mode:'single',emp:1,type:'Bonus',val:'',note:'',grp:'teachers',bm:'amt',off:new Set(),err:''};render();break;
 case'amode':AF.mode=k;render();break;case'atype':AF.type=k;render();break;case'abm':AF.bm=k;render();break;
 case'aoff':{const i=+t.dataset.id;t.checked?AF.off.delete(i):AF.off.add(i);render();break}
 case'asave':{const f=AF,v=+f.val;if(!(v>0)){AF.err='Enter an amount.';render();break}const u=snap();
  if(f.mode==='single')ADJ.unshift({id:nid++,emp:f.emp,type:f.type,amt:v,note:f.note||f.type,st:'draft',mo:'Oct 2026'});
  else Object.keys(EMP).filter(i=>(f.grp==='teachers'?EMP[i].k==='TCH':f.grp==='support'?['SEC','CLN','DRV'].includes(EMP[i].k):true)&&!f.off.has(+i)).forEach(i=>ADJ.unshift({id:nid++,emp:+i,type:f.type,amt:Math.round(f.bm==='pct'?EMP[i].net*v/100:v),note:f.note||f.type,st:'draft',mo:'Oct 2026'}));
  AF=null;tab='adj';render();toast('Saved as draft. Apply it to include it in October payroll.',u);break}
 case'adjApply':{const u=snap();ADJ.find(x=>x.id===id).st='applied';render();toast('Applied. It will show on the October payslip.',u);break}
 case'adjDel':{const u=snap();ADJ=ADJ.filter(x=>x.id!==id);render();toast('Draft deleted',u);break}
 case'prec':P.rec=!P.rec;render();break;
 }});
document.addEventListener('input',e=>{const i=e.target.id;
 if(i==='q'){F.q=e.target.value;const p=e.target.selectionStart;render();const q=$('q');if(q){q.focus();q.setSelectionRange(p,p)}return}
 if(FM){if(i==='fa'){FM.amt=e.target.value;$('fc').innerHTML=fcalc()}if(i==='fn'){FM.n=+e.target.value;$('fc').innerHTML=fcalc();e.target.previousElementSibling.textContent=`Repay over ${FM.n} month${FM.n>1?'s':''}`}if(i==='fr')FM.reason=e.target.value}
 if(AF){if(i==='aa'){AF.val=e.target.value;if(AF.mode==='single')$('apv').innerHTML=apv(AF);else{const p=e.target.selectionStart;render();$('aa').focus();$('aa').setSelectionRange(p,p)}}if(i==='an')AF.note=e.target.value}
 if(dr&&dr.k==='q'){const q=REQ.find(x=>x.id===dr.id);if(i==='qa'){q.eA=+e.target.value||0;$('qc').innerHTML=qcalc(q)}if(i==='qn'){q.eN=Math.max(1,Math.min(24,+e.target.value||1));$('qc').innerHTML=qcalc(q)}}
 if(MD&&MD.t==='rs'&&i==='rk'){MD.k=Math.max(1,+e.target.value||1);const l=LOANS.find(x=>x.id===MD.id);$('rcl').innerHTML=`<b>${R(bal(l)/MD.k)}</b> <span class="sub">per month</span>`}
 if(MD&&MD.t==='pay'&&i==='pa')MD.amt=+e.target.value});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='fe'&&FM){FM.emp=+t.value;render()}if(t.id==='ae'&&AF){AF.emp=+t.value;render()}if(t.id==='ag'&&AF){AF.grp=t.value;render()}
 if(t.dataset.p){P[t.dataset.p]=Math.max(0,+t.value||0);render()}});
$('br').onchange=e=>{F.br=e.target.value;render()};
$('role').onchange=e=>{role=e.target.value;dr=FM=AF=MD=null;tab='ovr';render();toast('Now viewing as '+(role==='staff'?'Naseem Akhtar (staff)':RN[role])+(role==='principal'?'. You can approve any amount but cannot disburse.':role==='fm'?'. You can approve up to '+R(P.fm)+' and disburse.':'.'))};
$('gs').onkeydown=e=>{if(e.key==='Enter'&&role!=='staff'){F.q=e.target.value;tab='act';render()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){dr=FM=AF=MD=null;rej=false;render()}});
render();
</script>
