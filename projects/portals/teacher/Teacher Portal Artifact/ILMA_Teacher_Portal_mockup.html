 <div class="card"><h2 style="margin-bottom:4px">Salary advance</h2><p class="mut" style="margin-bottom:10px">You can request up to <b>PKR ${fmt(mx)}</b> (one month’s net pay, less your PKR ${fmt(OUT)} outstanding).</p>${S.advErr}<label class="fld">Amount (PKR)<input class="in" type="number" min="5000" max="${mx}" step="1000" data-s="adv.amt" value="${esc(a.amt)}"></label><label class="fld">Recover over<select class="in" data-s="adv.inst">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${a.inst==n?'selected':''}>${n} month${n>1?'s':''}</option>`).join('')}</select></label>${+a.amt>=5000?`<div class="info">Deduction of about PKR ${fmt(Math.ceil(a.amt/a.inst))} a month from November salary.</div>`:''}<label class="fld">Reason<textarea class="in" data-s="adv.why" style="min-height:70px">${esc(a.why)}</textarea></label><button class="btn p" data-a="advok">Send request</button>${ADVS.length?`<div class="list" style="margin-top:12px">${ADVS.map(x=>`<div class="li"><div class="g"><b>Advance PKR ${fmt(x.amt)}</b><br><small class="mut">${x.inst} months · ${x.at}</small></div><span class="pill warn">Pending HR</span></div>`).join('')}</div>`:''}</div></div>`}
 return hd('Payroll','Your salary, payslips and HR documents')+tabs([['slips','Payslips'],['struct','Salary structure'],['docs','Documents & advance']],t,'ptab')+b};
Object.assign(A,{ptab:a=>{S.payTab=a.dataset.i;refresh()},slip:a=>{const p=a.dataset.i==='oct'?OCT:PAYM.find(x=>x.id===a.dataset.i);dlg('Payslip · '+p.m,slipHtml(p),`<button class="btn" data-a="mclose">Close</button><button class="btn p" data-a="slipp" data-i="${p.id}">🖨 Print / Save as PDF</button>`,true)},slipp:a=>{const p=a.dataset.i==='oct'?OCT:PAYM.find(x=>x.id===a.dataset.i);printHtml(slipHtml(p))},dl:a=>toast('Downloading “'+a.dataset.i+'”'),
 docreq:a=>{const n=a.dataset.i;if(DOCS.some(d=>d.n===n&&d.st!=='Ready'))return toast('You already have a pending request for this');DOCS.unshift({id:'d'+(DOCS.length+1),n,st:'Pending HR',at:'15 Oct · ready in 1 working day'});refresh();toast('✓ Request sent to HR')},
 advok:()=>{const a=S.adv,mx=maxAdv(),E=[],n=+a.amt;if(!n||n<5000)E.push('The minimum advance is PKR 5,000.');else if(n>mx)E.push('You can request up to PKR '+fmt(mx)+'.');else if(n%1000)E.push('Enter a round amount in thousands.');if(a.why.trim().length<10)E.push('Give a reason of at least 10 characters.');if(ADVS.length)E.push('You already have an advance request pending.');
  if(E.length){S.advErr=`<div class="err" role="alert">${E.join('<br>')}</div>`;return refresh()}ADVS.unshift({amt:n,inst:a.inst,at:'15 Oct'});S.adv={amt:'',inst:'3',why:''};S.advErr='';refresh();toast('✓ Advance request sent to HR')}});
/* ---------- help ---------- */
const FAQ=[['How do I mark attendance for my section?','Open Attendance, choose the class and date, mark each student or use Mark all present, then Review and submit. Parents of absent students can be notified by SMS.'],['I marked a student wrong after submitting. What now?','Open the submitted record and choose Request edit. The Branch admin reviews it, and once approved the record reopens for you.'],['Can I schedule more than one test a day for a class?','No. Each class can have one test per day and 3 per week, and none in exam week. For an exception, use Request approval.'],['How do I nominate a Class Representative?','Go to My Classes, open a student, and choose Nominate as CR, or use Permissions & Requests. The class coordinator approves it.'],['Who can I broadcast to?','Parents and students of the sections you teach. Other classes need approval, and school-wide announcements come from the Admin office.'],['A late mark or absence on my attendance is wrong.','Open Attendance, My attendance, select the day, and choose Request correction before 25 October so payroll is right.'],['When is my salary released?','On the 27th of each month. Attendance and leave records lock on the 25th.']];
SCR.help=()=>{const q=S.qa.toLowerCase(),L=FAQ.filter(f=>!q||(f[0]+f[1]).toLowerCase().includes(q));return hd('Help','Quick answers for teachers')+`<div class="card" style="max-width:820px"><input class="in" placeholder="Search help" data-s="qa" data-live="1" value="${esc(S.qa)}" style="margin-bottom:12px" aria-label="Search help"><div class="list">${L.map((f,i)=>`<div class="li" style="display:block"><button style="width:100%;text-align:left;border:0;background:none;font-weight:700;display:flex;justify-content:space-between;min-height:40px" data-a="faq" data-i="${i}" aria-expanded="${S.faq===f[0]}">${f[0]}<span>${S.faq===f[0]?'−':'+'}</span></button>${S.faq===f[0]?`<p class="mut" style="margin:6px 0 4px">${f[1]}</p>`:''}</div>`).join('')||'<p class="mut">No answers match. Try other words.</p>'}</div><div class="info" style="margin-top:14px">Still stuck? Message the Principal’s Office from Messages.</div></div>`};
/* ---------- core ---------- */
function dlg(t,b,f='',w=false){const d=$('#dlg');d.className=w?'wide':'';d.innerHTML=`<div class="mh"><h3>${t}</h3><button data-a="mclose" aria-label="Close">✕</button></div><div class="mb">${b}</div>${f?`<div class="mf">${f}</div>`:''}`;if(!d.open)d.showModal()}
const mclose=()=>{const d=$('#dlg');if(d.open)d.close()};
$('#dlg').addEventListener('close',()=>{S.mkId=null});
Object.assign(A,{go:a=>{S.screen=a.dataset.i;S.more=false;S.sw=false;render()},more:()=>{S.more=!S.more;refresh()},mclose,faq:a=>{const l=FAQ.filter(f=>!S.qa||(f[0]+f[1]).toLowerCase().includes(S.qa.toLowerCase()))[+a.dataset.i][0];S.faq=S.faq===l?null:l;refresh()}});
document.addEventListener('click',e=>{if(S.sw&&!e.target.closest('.sw')){S.sw=false;refresh()}const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sw){S.sw=false;refresh()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.s){setv(el.dataset.s,el.type==='checkbox'?el.checked:el.value);if(el.dataset.live){const id=el.dataset.s,p=el.selectionStart;refresh();const n=document.querySelector('[data-s="'+id+'"]');if(n){n.focus();n.setSelectionRange(p,p)}}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.lvfile){S.lv.file=el.files[0]?.name||'';refresh();return}if(el.dataset.s==='lv.from'&&S.lv&&S.lv.to<el.value)S.lv.to=el.value;if(el.dataset.s&&(el.tagName==='SELECT'||['date','checkbox','radio'].includes(el.type))){setv(el.dataset.s,el.type==='checkbox'?el.checked:el.value);if(el.dataset.s==='bc.ch.sms'||el.dataset.s==='hwf.notify'||el.dataset.s==='lv.half'||el.dataset.s.startsWith('lv.')||el.dataset.s.startsWith('tef.')||el.dataset.s.startsWith('hwf.')||el.dataset.s.startsWith('rq.')||el.dataset.s.startsWith('adv.')||el.dataset.s==='attDate')refresh()}});
render();
</script></body></html>
